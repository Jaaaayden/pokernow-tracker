[project]
name = "pokernow-tracker"
version = "0.1.0"
description = "Persistent, queryable PokerNow hand database with derived-at-read-time stats"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
# httpx2 backs fastapi.testclient; without it tests/test_api.py cannot even collect.
dev = ["pytest>=8.0", "ruff>=0.4", "httpx2>=0.1"]

[project.scripts]
pnt = "pnt.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pnt*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pnt = ["server/static/*.html"]
