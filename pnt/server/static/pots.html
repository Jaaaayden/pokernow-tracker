<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biggest pots</title>
<script src="/loading.js"></script>
<style>
  /* The palette is loading.js's; the replay's own rules are replay.js's. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The chart's width: side by side, the replay needs the room. */
  main { max-width: none; margin: 0; padding: 20px clamp(12px, 2vw, 28px) 48px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .controls label { color: var(--ink-2); font-size: 13px; }
  select, input, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 8px; }
  input[type=number] { width: 6.5em; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 5px 10px; color: var(--ink-2); }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
  .note { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; max-width: 82ch; }
  .note b { color: var(--ink); font-weight: 600; }
  ul.note { padding-left: 18px; }
  ul.note li { margin: 2px 0; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 8px 12px 12px; }
  .card.loading { opacity: .45; transition: opacity .15s; }
  .err { color: var(--down); margin: 12px 0; }
  .muted { color: var(--muted); }

  /* --- the headline figures --- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px;
    max-width: 1100px; }
  /* Each figure in its own hue, so the four read apart at a glance. */
  .tile { --tone: var(--ink-2); background: color-mix(in srgb, var(--tone) 6%, var(--surface));
    border: 1px solid var(--ring); border-top: 3px solid var(--tone); border-radius: 10px; padding: 8px 12px 10px; }
  .tile.big { --tone: var(--accent); }
  .tile.over { --tone: var(--violet); }
  .tile.vol { --tone: var(--amber); }
  .tile.hands { --tone: var(--teal); }
  .tile b { display: block; font-size: 22px; font-weight: 650; color: var(--tone); font-variant-numeric: tabular-nums; }
  .tile span { color: var(--ink-2); font-size: 12px; }
  .tile small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; font-variant-numeric: tabular-nums; }

  /* --- the list --- */
  .pot-rows { display: flex; flex-direction: column; }
  .pot-row {
    position: relative; display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline;
    text-align: left; width: 100%; border: 0; border-bottom: 1px solid var(--grid); border-radius: 0;
    background: transparent; padding: 7px 6px; font-variant-numeric: tabular-nums; overflow: hidden;
  }
  /* The pot as a bar behind the row: the biggest pot fills it, the rest are read
     against it at a glance. Painted behind the text, never over it. */
  .pot-row::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: var(--share, 0%);
    background: color-mix(in srgb, var(--accent) 12%, transparent); z-index: 0;
  }
  .pot-row > * { position: relative; z-index: 1; }
  .pot-row:hover, .pot-row[aria-pressed=true] { background: var(--mid); }
  .pot-row .pot { min-width: 7.5em; font-size: 15px; font-weight: 600; }
  .pot-row .pot small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 5px; }
  .pot-row .when { min-width: 8.5em; color: var(--muted); font-size: 12px; }
  .pot-row .who { min-width: 15em; flex: 1; }
  .pot-row .up { color: var(--up); }
  .pot-row .down { color: var(--down); }
  .pot-row .who .sep { color: var(--muted); margin: 0 6px; }
  .pot-row .board { min-width: 10em; color: var(--ink-2); }
  .pot-row .board .b2 { display: none; }
  .pot-row .tags { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  .pot-row .tag { font-size: 11px; padding: 0 7px; border: 1px solid var(--axis); border-radius: 999px;
    color: var(--muted); white-space: nowrap; }
  .pot-row .tag.allin { border-color: var(--accent); color: var(--accent); }
  .pot-row .tag.short { border-color: var(--down); color: var(--down); }
  .hidden { display: none !important; }
  @media (max-width: 620px) {
    .pot-row { gap: 1px 10px; font-size: 12px; padding: 6px 2px; }
    .pot-row .pot { font-size: 14px; }
    .pot-row .tags { margin-left: 0; }
  }
  /* Side by side (pntPage.sideBySide has the rest): the list on the left, the
     replay sticking beside it as the page scrolls. A narrow list keeps the pot,
     when, who won it and a short log's warning; the replay has the board and
     the rest. */
  #hand-pair:not(.split) { max-width: 1280px; }
  #hand-pair.split { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
  /* Side by side on a wide screen, a pot is one dense line -- pot, when, who
     won it from whom, the board, the tags that change how it reads -- so the
     replay has room. A second board runs after a slash; the street and table
     size wait for the replay. Stacked keeps the roomier rows. The replay stops
     at about 640px, as on the chart, and the list takes the rest of the card. */
  @media (min-width: 621px) {
    #hand-pair.split { grid-template-columns: minmax(520px, 1fr) minmax(0, min(45%, 640px)); }
    #hand-pair.split .pot-row { flex-wrap: nowrap; gap: 0 10px; padding: 4px 6px; font-size: 12px; white-space: nowrap; }
    #hand-pair.split .pot-row .pot { min-width: 6.4em; font-size: 13px; }
    #hand-pair.split .pot-row .pot small { font-size: 11px; margin-left: 4px; }
    #hand-pair.split .pot-row .when { min-width: 0; font-size: 11px; }
    #hand-pair.split .pot-row .who { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
    #hand-pair.split .pot-row .who .sep { margin: 0 4px; }
    #hand-pair.split .pot-row .board { min-width: 0; flex: none; }
    #hand-pair.split .pot-row .board br { display: none; }
    #hand-pair.split .pot-row .board .b2 { display: inline; color: var(--muted); margin: 0 3px; }
    #hand-pair.split .pot-row .tags { flex: none; flex-wrap: nowrap; gap: 3px; }
    #hand-pair.split .pot-row .tag { font-size: 10px; padding: 0 5px; }
    #hand-pair.split .pot-row .tag.minor { display: none; }
  }
  .pot-rows { container-type: inline-size; }
  @container (max-width: 360px) {
    .pot-row { gap: 1px 6px; padding: 5px 2px; font-size: 11px; }
    .pot-row .board, .pot-row .tag:not(.short), .pot-row .pot small { display: none; }
    .pot-row .pot, .pot-row .when { min-width: 0; }
    .pot-row .who { min-width: 0; flex-basis: 100%; overflow-wrap: anywhere; }
    .pot-row .tags { margin-left: 0; }
    .pot-row .pot { font-size: 13px; }
  }
</style>
</head>
<body>
<main>
  <nav class="pnt-nav" id="crumb" data-page="pots" aria-label="pages"></nav>
  <h1>Biggest pots <small id="subtitle">the hands worth remembering</small></h1>

  <div class="controls">
    <span class="seg" id="dayseg" role="group" aria-label="Window">
      <button data-days="1" aria-pressed="false">24h</button>
      <button data-days="7" aria-pressed="true">7 days</button>
      <button data-days="30" aria-pressed="false">30 days</button>
      <button data-days="all" aria-pressed="false">all</button>
    </span>
    <label for="minpot">Pot at least (chips)</label>
    <input id="minpot" type="number" min="0" step="100" value="2000">
    <label for="player">Player</label>
    <select id="player"><option value="">everyone</option></select>
    <button class="primary" id="apply">Apply</button>
    <span class="seg" id="unitseg" role="group" aria-label="Unit">
      <button data-unit="bb" aria-pressed="true">bb</button>
      <button data-unit="chips" aria-pressed="false">chips</button>
    </span>
    <button id="hands-split" aria-pressed="false" title="list on the left, replay on the right">Side by side</button>
  </div>

  <ul class="note">
    <li>Every pot at least the bar in the window, biggest first. <b>Click a row to replay it.</b></li>
    <li><b>Pot:</b> what sat in the middle, e.g. without uncalled bets or 7-2 bounties.</li>
  </ul>
  <div class="err hidden" id="err"></div>

  <div class="tiles" id="tiles"></div>

  <div class="card" id="card">
    <div id="hand-pair">
      <div class="pot-rows" id="rows"></div>
      <div class="replay hidden" id="replay"></div>
    </div>
  </div>
</main>

<script src="/replay.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  pntPage.nav();
  const theme = pntPage.theme;
  const { pretty, cardsEl, when } = pntReplay;

  const DAYS = ["1", "7", "30", "all"];
  // `widened`: the default window was empty (the sample's games are old), so the
  // page opened on all time instead and says so. `open`: the hand_id of the pot
  // on replay, kept across a change of unit.
  const state = { days: "7", minPot: 2000, player: "", unit: "bb", data: null, widened: null, daysChosen: false, open: null };

  const readUrl = () => {
    const q = new URLSearchParams(location.search);
    state.days = DAYS.includes(q.get("days")) ? q.get("days") : "7";
    state.daysChosen = DAYS.includes(q.get("days"));
    const min = parseInt(q.get("min"), 10);
    state.minPot = Number.isFinite(min) && min >= 0 ? min : 2000;
    state.player = q.get("player") || "";
    state.unit = q.get("unit") === "chips" ? "chips" : "bb";
  };
  const writeUrl = () => {
    const q = new URLSearchParams();
    if (state.days !== "7") q.set("days", state.days);
    if (state.minPot !== 2000) q.set("min", state.minPot);
    if (state.player) q.set("player", state.player);
    if (state.unit !== "bb") q.set("unit", state.unit);
    if (theme) q.set("theme", theme);
    history.replaceState(null, "", "?" + q.toString());
    const who = state.player ? { player: state.player } : {};
    for (const [id, path] of [["chartlink", "/chart"], ["allinlink", "/allin.html"], ["tendencieslink", "/tendencies.html"]]) {
      $(id).href = pntPage.href(path, who);
    }
  };

  const chips = (v) => v == null ? "–" : Math.round(v).toLocaleString();
  const bb = (v) => v == null ? "–" : `${Number(v).toFixed(1)}bb`;
  // A row's money in the chosen unit, signed. bb is per-hand: a hand with no big
  // blind on record has none to show, so it reads "–" rather than inventing one.
  const money = (row, chipsKey, bbKey) => state.unit === "bb" ? pntPage.signed(row[bbKey])
    : pntPage.signed(row[chipsKey] == null ? null : Math.round(row[chipsKey]), 0);
  const { getJson } = pntPage;

  async function loadPlayers() {
    const rows = await getJson("/players");
    const sel = $("player");
    for (const p of [...rows].sort((a, b) => pntPage.byName(a.alias, b.alias))) {
      const o = document.createElement("option");
      o.value = p.alias; o.textContent = p.alias;
      sel.appendChild(o);
    }
    sel.value = rows.some(p => p.alias === state.player) ? state.player : "";
    state.player = sel.value;
  }

  // Bumped by every load: an answer for controls since changed is dropped, so a
  // slow load cannot land after a quicker, newer one and be what is left on show.
  let loadSeq = 0;
  async function load() {
    const seq = ++loadSeq;
    $("card").classList.add("loading");
    $("err").classList.add("hidden");
    const q = new URLSearchParams({ min_pot: state.minPot });
    if (state.days === "all") q.set("all_time", "1"); else q.set("days", state.days);
    if (state.player) q.set("player", state.player);
    try {
      const data = await getJson("/pots?" + q);
      if (seq !== loadSeq) return;
      // Nothing at all in the default window, e.g. the sample, whose games are
      // old: open on all time rather than on four zeros.
      if (!data.hands && !state.daysChosen && state.days !== "all") {
        state.widened = state.days;
        state.days = "all";
        document.querySelectorAll("[data-days]").forEach(x => x.setAttribute("aria-pressed", x.dataset.days === "all"));
        writeUrl();
        return load();
      }
      state.data = data;
      render();
    } catch (e) {
      if (seq !== loadSeq) return;
      $("err").textContent = String(e.message || e);
      $("err").classList.remove("hidden");
      $("tiles").replaceChildren();
      $("rows").replaceChildren();
    } finally {
      if (seq === loadSeq) $("card").classList.remove("loading");
    }
  }

  function tile(hue, value, caption, title, detail) {
    const d = document.createElement("div");
    d.className = "tile " + hue;
    if (title) d.title = title;
    const b = document.createElement("b"); b.textContent = value;
    const s = document.createElement("span"); s.textContent = caption;
    d.append(b, s);
    if (detail) { const m = document.createElement("small"); m.textContent = detail; d.append(m); }
    return d;
  }
  const short = (v) => v >= 1e6 ? `${(v / 1e6).toFixed(2)}M` : v >= 1e4 ? `${Math.round(v / 1e3)}k` : chips(v);

  const WINDOW_WORD = { "1": "in the last 24 hours", "7": "in the last 7 days", "30": "in the last 30 days", all: "ever recorded" };

  // `keep`: a change of unit, which redraws the rows and tiles but leaves the
  // replay on show (redrawn in the new unit) and its row pressed.
  function render(keep = false) {
    const d = state.data;
    const word = WINDOW_WORD[state.days];
    $("subtitle").textContent = `${chips(d.min_pot)}+ chips ${word}` + (d.player ? ` · ${d.player}` : "")
      + (state.widened && state.days === "all" ? ` · nothing ${WINDOW_WORD[state.widened]}, so all time` : "");
    // Pot volume: the chips that went into these pots, each pot once. The same
    // buy-ins go round many pots, so it is far more than anyone won or lost.
    const bbVol = d.chips_bb == null ? null : `${short(d.chips_bb)} bb`;
    const avg = !d.over ? null : state.unit === "bb" && d.chips_bb != null ? `${bb(d.chips_bb / d.over)} a pot`
      : `${chips(d.chips / d.over)} a pot`;
    $("tiles").replaceChildren(
      tile("big", chips(d.biggest), "biggest pot", "the largest single pot in the window"),
      tile("over", d.over.toLocaleString(), `pots of ${chips(d.min_pot)}+ chips`, "how many reached the bar"),
      tile("vol", state.unit === "bb" && bbVol ? bbVol : chips(d.chips), "pot volume, not money won",
        "every chip that went into these pots, each pot once (a run twice or a chop is one pot)."
        + " The same buy-ins go round many pots, so this is far more than anyone won.",
        [state.unit === "bb" ? `${chips(d.chips)} chips` : bbVol, avg].filter(Boolean).join(" · ")),
      tile("hands", d.hands.toLocaleString(), "hands in the window", "the denominator: every hand dealt in it"),
    );

    const list = $("rows");
    list.replaceChildren();
    if (!keep || !d.pots.some(h => h.hand_id === state.open)) {
      state.open = null;
      resetReplay(d.pots.length > 0);
    }
    if (!d.pots.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = d.hands
        ? `no pot reached ${chips(d.min_pot)} ${word} · ${d.hands.toLocaleString()} hands looked at`
        : `no hands ${word}`;
      list.appendChild(p);
      return;
    }
    if (d.over > d.pots.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = `the ${d.pots.length} biggest of ${d.over.toLocaleString()} pots at the bar or over`;
      p.style.margin = "0 0 6px";
      list.appendChild(p);
    }
    const top = d.pots[0].pot || 1;
    for (const h of d.pots) list.appendChild(potRow(h, top, list));
  }

  function potRow(h, top, list) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pot-row"; b.setAttribute("aria-pressed", h.hand_id === state.open);
    // Every pot is read against the biggest one in the window.
    b.style.setProperty("--share", `${Math.max(2, Math.round(100 * h.pot / top))}%`);
    const span = (cls, text, title) => {
      const s = document.createElement("span"); s.className = cls; s.append(text);
      if (title) s.title = title;
      b.appendChild(s); return s;
    };

    const pot = span("pot", state.unit === "bb" && h.pot_bb != null ? bb(h.pot_bb) : chips(h.pot));
    const other = document.createElement("small");
    other.textContent = state.unit === "bb" ? chips(h.pot) : (h.pot_bb != null ? bb(h.pot_bb) : "");
    pot.appendChild(other);
    span("when", when(h.ts), [h.game_id, `#${h.hand_number}`, when(h.ts)].filter(Boolean).join(" · "));

    // Who it went to. A chopped pot has no winner to name, so it says so rather
    // than crowning whoever came out a blind ahead.
    const who = span("who", "");
    if (h.chopped) {
      who.append("chopped ");
      const names = document.createElement("span");
      names.className = "sep";
      names.textContent = h.seats.filter(s => s.collected > 0).map(s => s.player).join(" · ");
      who.appendChild(names);
    } else if (h.winner) {
      // The name in ink, the net in green or red by its sign.
      const net = (row, chipsKey, bbKey) => {
        const n = document.createElement("span");
        n.className = row[chipsKey] > 0 ? "up" : row[chipsKey] < 0 ? "down" : "";
        n.textContent = money(row, chipsKey, bbKey);
        return n;
      };
      who.append(`${h.winner} `, net(h, "won", "won_bb"));
      if (h.loser) {
        const sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "vs";
        const lost = h.seats[h.seats.length - 1];
        who.append(sep, `${h.loser} `, net(lost, "net", "net_bb"));
      }
    } else {
      who.textContent = "–";
    }
    who.title = h.seats.map(s =>
      `${s.player} ${money(s, "net", "net_bb")}${s.hole_cards ? " " + pretty(s.hole_cards) : ""}`
    ).join("\n");

    const board = span("board", h.board.length ? cardsEl(h.board) : "no flop",
      h.run_count > 1 && !h.double_board ? "ran twice; run one shown" : "");
    // Double Board: the second board under the first, both bet on every street.
    // Side by side, it follows the first after a slash on the one line.
    if (h.board2?.length) {
      const slash = document.createElement("span"); slash.className = "b2"; slash.textContent = "/";
      board.append(document.createElement("br"), slash, cardsEl(h.board2));
    }

    const tags = document.createElement("span");
    tags.className = "tags";
    const tag = (text, cls, title) => {
      const t = document.createElement("span");
      t.className = "tag" + (cls ? " " + cls : "");
      t.textContent = text;
      if (title) t.title = title;
      tags.appendChild(t);
    };
    if (h.all_in) tag("all in", "allin");
    tag(h.went_to_showdown ? "showdown" : h.street, "minor",
      h.went_to_showdown ? "shown down" : `no showdown; ended on the ${h.street}`);
    tag(`${h.players}-handed`, "minor");
    if (h.double_board) tag("double board");
    else if (h.run_count > 1) tag("ran twice");
    if (h.plo) tag("PLO");
    // The chips of an unfinished hand are not all on record, so its pot is short.
    if (!h.complete) tag("log cut short", "short", "the log stops mid-hand: this pot is short");
    b.appendChild(tags);

    b.addEventListener("click", () => {
      list.querySelectorAll(".pot-row").forEach(x => x.setAttribute("aria-pressed", x === b));
      state.open = h.hand_id;
      pntReplay.show($("replay"), h.hand_id, { unit: state.unit });
    });
    return b;
  }

  // ---- side by side (pntPage.sideBySide) ---------------------------------
  const resetReplay = pntPage.sideBySide({
    pair: $("hand-pair"), toggle: $("hands-split"), replay: $("replay"),
    empty: "click a pot to replay it", has: () => !!state.data?.pots.length,
  });

  // ---- controls ----------------------------------------------------------
  function apply() {
    const v = parseInt($("minpot").value, 10);
    state.minPot = Number.isFinite(v) && v >= 0 ? v : 0;
    state.player = $("player").value;
    writeUrl(); load();
  }
  $("apply").addEventListener("click", apply);
  $("minpot").addEventListener("change", apply);
  $("minpot").addEventListener("keydown", (e) => { if (e.key === "Enter") apply(); });
  $("player").addEventListener("change", apply);
  document.querySelectorAll("[data-days]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("[data-days]").forEach(x => x.setAttribute("aria-pressed", x === b));
    state.days = b.dataset.days;
    state.daysChosen = true;
    state.widened = null;
    writeUrl(); load();
  }));
  document.querySelectorAll("[data-unit]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("[data-unit]").forEach(x => x.setAttribute("aria-pressed", x === b));
    state.unit = b.dataset.unit;
    writeUrl();
    if (state.data) render(true);
    pntReplay.setUnit($("replay"), state.unit);
  }));

  readUrl();
  $("minpot").value = state.minPot;
  document.querySelectorAll("[data-days]").forEach(x => x.setAttribute("aria-pressed", x.dataset.days === state.days));
  document.querySelectorAll("[data-unit]").forEach(x => x.setAttribute("aria-pressed", x.dataset.unit === state.unit));
  writeUrl();
  loadPlayers().catch(() => {}).then(load);
})();
</script>
</body>
</html>
