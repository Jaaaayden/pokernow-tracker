<script>
(() => {
  // ---- palette (reference instance; one hue per job) ----------------------
  const BLUE = ["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#256abf","#184f95","#0d366b"];
  const RED  = ["#fbd9d8","#f6b6b5","#ef9291","#e66e6d","#e34948","#b93a39","#8f2d2c"];
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  const dark = () => document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  // Ink is chosen from the fill itself, not from the theme: in dark mode the
  // biggest values sit on the palest step and need dark ink there.
  const lum = (hex) => { const n = parseInt(hex.slice(1), 16); const c = [16, 8, 0].map(s => ((n >> s) & 255) / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const inkClass = (hex) => hex.startsWith("#") ? (lum(hex) > 0.35 ? "on-light" : "on-dark") : "";
  // In dark mode "near zero" recedes toward the dark surface, so the ramp runs
  // dark -> light with magnitude instead of light -> dark.
  const ramp = (arr) => dark() ? [...arr].reverse() : arr;

  const PRESETS = [
    ["Any preflop decision", "acted_preflop"],
    ["Opened, single-raised pot", "opener,srp"],
    ["Opened 4bb+", "opener,open_bb>=4,srp"],
    ["Opened 2–3bb", "opener,open_bb<=3,srp"],
    ["Limped", "limp"],
    ["3-bet", "3bet"],
    ["Faced a 3-bet", "faced_3bet"],
    ["Called a 3-bet", "faced_3bet_any=call"],
    ["Folded to a 3-bet", "folded_to_3bet"],
    ["Facing an open", "faced_open"],
    ["Called an open", "called_open"],
    ["Cold call", "cold_call"],
    ["Squeeze", "squeeze"],
    ["Got squeezed", "called_open,faced_3bet_any"],
    // Blind war: SPEC.md, "Steals and blind defense".
    ["Steal", "steal"],
    ["Fold to steal", "fold_to_steal"],
    ["3-bet vs steal", "3bet_vs_steal"],
    ["4-bet", "4bet"],
    ["Facing a 4-bet", "faced_4bet"],
    ["5-bet", "5bet"],
    ["Went to showdown", "wtsd"],
    ["Button", "position=BTN"],
    ["Big blind", "position=BB"],
  ];

  // The presets as labelled rows under More filters, by their filter. A preset in
  // no group lands in the last one.
  const PRESET_GROUPS = [
    ["Preflop", ["acted_preflop", "opener,srp", "opener,open_bb>=4,srp", "opener,open_bb<=3,srp", "limp",
      "faced_open", "called_open", "cold_call"]],
    ["3-bet+", ["3bet", "faced_3bet", "faced_3bet_any=call", "folded_to_3bet", "squeeze",
      "called_open,faced_3bet_any", "4bet", "faced_4bet", "5bet"]],
    ["Steals", ["steal", "fold_to_steal", "3bet_vs_steal"]],
    ["Other", ["wtsd", "position=BTN", "position=BB"]],
  ];
  // The Common row: [label, the chip under More filters it stands for]. Each is a
  // stand-in that clicks the real chip, so the two always agree.
  const COMMON = [
    ["Opened SRP", '#presets [data-preset="opener,srp"]'],
    ["3-bet", '#presets [data-preset="3bet"]'],
    ["Called an open", '#presets [data-preset="called_open"]'],
    ["Faced a 3-bet", '#presets [data-preset="faced_3bet"]'],
    ["Steal", '#presets [data-preset="steal"]'],
    ["3-bet pot", '#pottype [data-term="3bet_pot"]'],
    ["C-bet flop", '#lines [data-term="cbet_flop"]'],
    ["Faced c-bet", '#lines [data-term="faced_cbet_flop"]'],
    ["Faced river bet", '#actions [data-term="faced_bet_river"]'],
    ["Showdown", '#actions [data-term="wtsd"]'],
  ];
  const FILTERS_KEY = "pnt.allFilters";

  // Bet-size buckets; see "Bet size buckets" in SPEC.md. PokerNow's 1/2, 3/4 and
  // pot buttons each start a bucket.
  const SIZES = [["<⅕", "blocker"], ["⅕–½", "small"], ["½–¾", "medium"], ["¾–pot", "large"], ["overbet", "overbet"]];
  // The size words, the bucket rule and card formatting live with the replay
  // renderer (replay.js), which the all-in page shares.
  const { SIZE_LABEL, pretty, cardsEl } = pntReplay;
  const SHORT_SIZE = Object.fromEntries(SIZES.map(([t, b]) => [b, t]));

  // Postflop line chips: one row per street, each holding at most one term, so
  // picking a size replaces "any" or another size on that street.
  const LINES = [
    ["C-bet flop", "cbet_flop", "preflop aggressor bet the flop"],
    ["C-bet turn", "cbet_turn", "flop aggressor bet the turn"],
    ["River bet", "bet_river", "their first river bet"],
    ["Faced c-bet", "faced_cbet_flop", "faced a flop c-bet, by its size"],
  ];
  // Pot type: one of these at a time, since a pot is only ever one of them. An
  // entry marked "toggle" is not a pot level but goes with any of them (a
  // straddled pot is still limped, single-raised or 3-bet), so it switches on and
  // off by itself.
  const POT_TYPES = [["limped", "limped"], ["single-raised", "srp"], ["3-bet pot", "3bet_pot"], ["4-bet pot+", "4bet_pot"],
    ["straddled", "straddled", "toggle"]];
  // Stack depth (SPEC.md, "Stack-depth splits"): the stats page's depth split as
  // chips, one bucket at a time. A chip may write two terms; picking one clears
  // every `eff_bb` comparison in the box first, typed ones too, so two buckets
  // never AND into nothing. The SPR chip toggles on its own.
  const DEPTHS = [
    ["<40bb", "eff_bb<40"], ["40–100bb", "eff_bb>=40,eff_bb<100"],
    ["100–200bb", "eff_bb>=100,eff_bb<200"], ["200bb+", "eff_bb>=200"],
  ];
  const SPR_LOW = ["SPR ≤3", "spr_flop<=3", "stack-to-pot ratio of 3 or less on the flop: one bet or two gets it in"];
  // The game: Hold'em or PLO, one at a time, and the table's extras as toggles.
  // PLO and Double Board are in the hand lists and Results only.
  const GAMES = [
    { text: "Hold'em", term: "holdem", what: "Hold'em hands" },
    { text: "PLO", term: "plo", what: "PLO hands: Session, flagged, tagged and Results only" },
    { text: "bomb pot", term: "bomb_pot", toggle: true, what: "no blinds, everyone posted the bomb" },
    { text: "double board", term: "double_board", toggle: true, what: "two boards every street: Session, flagged, tagged and Results only" },
  ];
  const EFF_TERM = /^eff_bb(>=|<=|=|>|<)/;
  // What they did after the flop, as toggles that compose with everything
  // above. These are the spots the player tags open, so a tag sent from the
  // HUD lights the chips it is made of.
  const ACTION_ROWS = [
    ["Flop", "what they did facing, or holding, the flop initiative", [
      ["c-bet chance", "cbet_flop_opp"], ["called c-bet", "called_cbet_flop"], ["raised c-bet", "raised_cbet_flop"],
      ["led out", "donk_flop"], null, ["checked back", "check_back"]]],
    ["River", "how the river went for them", [
      ["faced a bet", "faced_bet_river"], ["called", "called_bet_river"], ["folded", "folded_to_bet_river"],
      ["bet/raised last", "aggressor_river"], null, ["showdown", "wtsd"], ["won showdown", "won_sd"]]],
  ];
  const KIND_SPOT = { cbet: "c-bet chances", bet: "bets", faced_cbet: "c-bets faced" };
  const KIND_NOTE = {
    cbet: ["Each size is a share of their c-bet chances; **checked** is the chances passed up.", "**Made hands:** shown hands only."],
    bet: ["Every first bet on this street, c-bet or not, by size.", "**Made hands:** shown hands only."],
    faced_cbet: ["By the size of the c-bet they faced.", "**Made hands:** shown hands that called or raised."],
  };
  const $ = (id) => document.getElementById(id);
  // The view's note: a short bullet list. **text** is bold.
  function bulletsInto(host, items) {
    host.replaceChildren(...items.filter(Boolean).map((text) => {
      const li = document.createElement("li");
      text.split(/\*\*(.+?)\*\*/).forEach((part, i) => {
        if (!part) return;
        if (i % 2) { const b = document.createElement("b"); b.textContent = part; li.append(b); } else li.append(part);
      });
      return li;
    }));
    return host;
  }
  const setNote = (...items) => bulletsInto($("note"), items.flat());
  const RANGE_NOTE = [
    "**Shown hands only:** cards are known when a hand reaches showdown, so the hands that folded are missing.",
    "Read **coverage** first.",
  ];

  // Board texture chips. Each toggles one `flop=<tag>` term; groups are
  // separated visually but any combination composes (they AND together).
  const TEXTURES = [
    ["ace high", "ace_high"], ["king high", "king_high"], ["queen high", "queen_high"], ["low", "low"], null,
    ["monotone", "monotone"], ["two-tone", "twotone"], ["rainbow", "rainbow"], null,
    ["paired", "paired"], ["unpaired", "unpaired"], null,
    ["connected", "connected"], ["disconnected", "disconnected"], ["all broadway", "all_broadway"],
  ];
  // Jam chips: one row for jamming, one for calling a jam. Each row holds at most
  // one term, `jam` for any street or `jam_<street>` for one.
  const JAM_ROWS = [["Jammed", "jam", "bet or raised all-in"], ["Called jam", "called_jam", "called someone's all-in"]];
  const JAM_STREETS = ["preflop", "flop", "turn", "river"];
  const jamPattern = (key) => new RegExp(`^${key}(_(${JAM_STREETS.join("|")}))?$`);
  const JAM_TERM = /^(faced_|called_)?jam(_\w+)?$/;
  const JAM_NOTE = "**Jams:** one everyone folded to is never shown, so an all-value jam range may just mean the bluffs got through.";
  // Limp chips: what a limper did when someone raised behind them (SPEC.md,
  // "Decision points": Limp-reraise). Each chip writes two terms, `limp` and the
  // decision at the open, and the row holds one of the three at a time. The last
  // chip narrows any spot to the shown hands in the top 15% (`hand_pct<=15`, the
  // "strong" preflop cutoff), so the hands tile counts the strong ones.
  const LIMP_ROW = [
    ["limp-reraise", "limp,faced_open=raise", "limped, then re-raised the open"],
    ["limp-call", "limp,faced_open=call", "limped, then called the open"],
    ["limp-fold", "limp,faced_open=fold", "limped, then folded to the open"],
  ];
  const LIMP_STRONG = ["top 15% shown", "hand_pct<=15", "shown hands in the top 15% of starting hands"];
  const LIMP_NOTE = "**Limp-reraise:** one everyone folded to is never shown, so an all-big-hands range may just mean the bluffs got through.";
  const isLimpReraise = (filter) => {
    const ts = (filter || "").split(",").map(t => t.trim());
    return ts.includes("limp") && ts.includes("faced_open=raise");
  };
  // Each chip helper comes in two forms: `next…` is the spot a click would leave,
  // without writing it, so the chip counts can ask for it; `set…`/`toggleTerm`
  // writes it into the box.
  // Replace whichever limp chip is pressed with `pair`'s two terms, or clear the
  // row when `pair` was the one already pressed.
  function nextLimpTerms(pair) {
    const want = pair.split(",");
    const cur = terms();
    const pressed = want.every(t => cur.includes(t));
    const next = cur.filter(t => t !== "limp" && t !== "faced_open" && !t.startsWith("faced_open="));
    if (!pressed) next.push(...want);
    return next.join(",");
  }
  const terms = () => $("filter").value.split(",").map(t => t.trim()).filter(Boolean);
  const hasTerm = (t) => terms().includes(t);
  function nextToggle(t) {
    const cur = terms();
    const next = cur.includes(t) ? cur.filter(x => x !== t) : [...cur, t];
    return next.join(",");
  }
  // Replace whatever `key` or `key=<size>` term is present with `term`, or clear
  // the row when `term` was the one already pressed.
  function nextGroupTerm(key, term) {
    const cur = terms();
    const pressed = cur.includes(term);
    const next = cur.filter(t => t !== key && !t.startsWith(key + "="));
    if (!pressed) next.push(term);
    return next.join(",");
  }
  // Replace any of `group`'s terms with `term`, or clear them when `term` was
  // the one already pressed.
  function nextOneOf(group, term) {
    const cur = terms();
    const pressed = cur.includes(term);
    const next = cur.filter(t => !group.includes(t));
    if (!pressed) next.push(term);
    return next.join(",");
  }
  // Replace whatever `eff_bb` comparisons are present with `pair`'s terms, or
  // clear them when `pair` was the bucket already pressed.
  function nextDepthTerms(pair) {
    const want = pair.split(",");
    const cur = terms();
    const pressed = want.every(t => cur.includes(t)) && cur.filter(t => EFF_TERM.test(t)).length === want.length;
    const next = cur.filter(t => !EFF_TERM.test(t));
    if (!pressed) next.push(...want);
    return next.join(",");
  }
  // The same for a jam row, whose terms are `key` and `key_<street>`.
  function nextJamTerm(key, term) {
    const cur = terms();
    const pressed = cur.includes(term);
    const next = cur.filter(t => !jamPattern(key).test(t));
    if (!pressed) next.push(term);
    return next.join(",");
  }
  const setLimpTerms = (pair) => { $("filter").value = nextLimpTerms(pair); };
  const toggleTerm = (t) => { $("filter").value = nextToggle(t); };
  const setGroupTerm = (key, term) => { $("filter").value = nextGroupTerm(key, term); };
  const setOneOf = (group, term) => { $("filter").value = nextOneOf(group, term); };
  const setDepthTerms = (pair) => { $("filter").value = nextDepthTerms(pair); };
  const setJamTerm = (key, term) => { $("filter").value = nextJamTerm(key, term); };
  // The pot box and the vs picker are two more ways of writing a term into the
  // box above them; the text stays the one source of truth, so they read back
  // whatever is typed there. `pot>=` is the only shape the box writes, but it
  // reads any `pot<op>N` so a hand-typed `pot>500` still shows up. `pot_bb` is
  // left alone: it is its own term.
  const POT_TERM = /^pot(>=|<=|=|>|<)(\d+(?:\.\d+)?)$/;
  const VS_TERM = /^vs=(.+)$/;
  function setPotTerm(n) {
    const next = terms().filter(t => !POT_TERM.test(t));
    if (n !== "" && Number(n) > 0) next.push(`pot>=${Number(n)}`);
    $("filter").value = next.join(",");
  }
  function setVsTerm(name) {
    const next = terms().filter(t => !VS_TERM.test(t));
    if (name) next.push(`vs=${name}`);
    $("filter").value = next.join(",");
  }
  // The More filters button counts the chips that are on but not in the Common row.
  function syncMore() {
    const more = $("morefilters");
    if (!more) return;
    const on = $("filters").querySelectorAll("button[aria-pressed=true]:not([data-common])").length;
    const open = more.getAttribute("aria-expanded") === "true";
    more.textContent = `More filters${on ? ` · ${on} on` : ""} ${open ? "▴" : "▾"}`;
    countChips();
  }
  function syncChips() {
    document.querySelectorAll("button[data-term]").forEach(b => b.setAttribute("aria-pressed", hasTerm(b.dataset.term)));
    document.querySelectorAll("button[data-terms]").forEach(b => b.setAttribute("aria-pressed", b.dataset.terms.split(",").every(hasTerm)));
    const current = $("filter").value.trim();
    document.querySelectorAll("button[data-preset]").forEach(b => b.setAttribute("aria-pressed", b.dataset.preset === current));
    $("clear").disabled = !current;
    // PLO and Double Board hands are only in the hand lists and Results: on any
    // other tab their chips could only empty the spot, so they are off there --
    // unless already on, so they can still be taken off.
    const play = scopeOf(state.by) === "play";
    for (const b of document.querySelectorAll('#pottype [data-term="plo"], #pottype [data-term="double_board"]')) {
      b.disabled = play && !hasTerm(b.dataset.term);
    }
    const pot = terms().map(t => t.match(POT_TERM)).find(Boolean);
    $("pot").value = pot ? pot[2] : "";
    const vs = terms().map(t => t.match(VS_TERM)).find(Boolean);
    const sel = $("vs");
    const want = vs ? vs[1].trim() : "";
    // A name typed in a different case than the dropdown's still selects it.
    const opt = [...sel.options].find(o => o.value.toLowerCase() === want.toLowerCase());
    sel.value = opt ? opt.value : "";
    syncMore();
  }

  // ---- chip counts ------------------------------------------------------
  // Each chip carries the player's hands the spot would hold if it were clicked
  // now; a pressed chip, the hands the spot holds as it is. One POST /counts per
  // batch, at most COUNTS_MAX terms: the Common row first, then the More filters
  // chips, only while that is open. Every resync ends up here (syncMore): typing
  // waits for a 300ms pause, an applied spot asks at once, and a newer ask aborts
  // the last. A failed ask drops the badges; a chip never waits on one.
  const COUNTS_MAX = 200; // the API's cap per request
  const chipNext = new WeakMap(); // chip -> () => the box a click leaves
  // A chip's click: write `next()` into the box and apply it. The counts read
  // the same `next`, so a badge and a click cannot disagree.
  function chipClick(b, next) {
    chipNext.set(b, next);

  }
  const state = { player: null, filter: "", by: "preflop", color: "net", street: "flop", kind: "cbet", floor: "set",

  // ---- hand review ------------------------------------------------------
  // Both views read one endpoint and split its rows by group; see "Hand review"
  // in SPEC.md for what each flag means.
  const REVIEW_VIEWS = ["review", "beats"];
  const isReview = (view) => REVIEW_VIEWS.includes(view);
  // The session view lists every hand of one game, flagged or not, with the same

  const VIEWS = ["preflop", "made", "sizing", "lines", "bluffs", "strength", ...REVIEW_VIEWS, SESSION_VIEW, "tilt", "timing", "shows", "bounties", "nit", "results"];
  // The spot tree: one player's decision points, seat first. See "spot tree" below.
  const TREE_VIEW = "tree";
  VIEWS.push(TREE_VIEW);
  // Asked 4 deep, without the nodes under 5 hands: the whole 6-deep tree of a

  const TREE_DEPTH = 4, TREE_MIN = 5, TREE_DIM = 20;
  // Hands you tagged, by tag. See "tagged" below.
  VIEWS.push(TAGGED_VIEW);
  // The views with the Group by panel, and each one's rows when none is picked.
  const GB_VIEWS = ["preflop", "made"];
  const GB_DEFAULT = { preflop: "position", made: "made_flop" };
  // Embedded in the HUD's side panel there is no room for it, nor a need.
  const EMBED = parent !== window;
  const REVIEW_KINDS = {
    review: [["missed_bluff", "Missed bluff"], ["missed_value", "Missed value"], ["failed_bluff", "Failed bluff"]],
    beats: [["suckout", "Suckout"], ["cooler_pre", "Preflop cooler"], ["cooler_post", "Postflop cooler"]],
  };
  const KIND_LABEL = Object.fromEntries(Object.values(REVIEW_KINDS).flat());
  const ALL_KINDS = Object.keys(KIND_LABEL);
  // The first order of each view is its default.
  const ORDERS = { review: ["newest", "pot"], beats: ["newest", "pot", "swing"], session: ["hand", "newest", "pot", "swing"],
                   tagged: ["newest", "pot", "swing"] };
  const ORDER_NAMES = ORDERS.session;
  const orderOf = (view) => ORDERS[view].includes(state.order) ? state.order : ORDERS[view][0];
  const REVIEW_NOTE = {
    review: ["**Flagged by rule** (each one under the flag chips): a prompt to replay, not a verdict.",
      "**Missed bluffs, missed value:** showdowns only, where every live hand was shown.",
      "**Failed bluffs** also count bluffs given up before showdown."],
    tagged: ["Hands you tagged: type in the **+ tag** box on a row or a replay, Enter to add, e.g. river-bluff.",
      "Pick a tag to list its hands; **flagged** is the 🚩 ones.", "In a spot: tag=cooler|study."],
    session: ["Every hand of the session, in deal order.", "Tick hands off or write on them as you go.",
      "**Sat out** adds the hands dealt while they were away."],
    beats: ["**Flagged by rule** (each one under the flag chips): the deck's doing, not a mistake.",
      "**Suckouts, preflop coolers:** all-in showdowns, equity taken where the betting stopped."],
  };

  // Each flag's rule in a line, with the cutoffs the server used (`thresholds`, the
  // copy of review.py's THRESHOLDS on every answer) and a matchup it catches.
  // Printed above the list for the flags on show, and on each row's pill.
  const pctOf = (x) => `${Math.round(x * 100)}%`;
  const FLAG_RULE = {
    missed_bluff: (t) => `river checked through, ${t.bloated_pot_bb}bb+ pot, every hand air · e.g. K-high vs Q-high`,
    missed_value: (t) => `both had a stacks hand on a dry board, under ${pctOf(t.stacks_in_share)} of the stacks went in · e.g. set vs top two`,
    failed_bluff: (t) => `bet or raised air postflop, got called or raised, lost · ${t.failed_bluff_pot_bb}bb+ pot`,
    suckout: (t) => `all in ${pctOf(t.suckout_equity)}+ to win, lost · e.g. AA vs KK, a K on the river`,
    cooler_pre: (t) => `${t.premium.join("/")} all in preflop at ${pctOf(t.cooler_equity)} or less, lost · e.g. QQ vs KK`,
    cooler_post: () => "a stacks hand already behind on a dry board, lost · e.g. top two vs a set",
  };

  const flagRule = (kind, t) => (t && FLAG_RULE[kind] ? FLAG_RULE[kind](t) : "");

    state.color = ["net","pfr","size"].includes(c) ? c : "net";
    state.street = ["turn", "river"].includes(q.get("street")) ? q.get("street") : "flop";
    state.kind = ["bet", "faced_cbet"].includes(q.get("kind")) ? q.get("kind") : "cbet";
    state.lmode = q.get("lmode") === "action" ? "action" : "own";
    state.lstreet = ["flop", "turn", "river"].includes(q.get("lstreet")) ? q.get("lstreet") : "";
    state.bluffScope = q.get("scope") === "pool" ? "pool" : "player";
    state.floor = SP_FLOORS.some(([f]) => f === q.get("floor")) ? q.get("floor") : "set";

  // ---- data ------------------------------------------------------------
  async function sendJson(url, opts) {
    const r = await fetch(url, opts);
    if (!r.ok) {

        throw new Error("the running server is older than this page: restart `pnt service` (or `pnt serve`)");

  });

  async function loadPlayers() {
    const rows = await getJson("/players");
    const sel = $("player");
    sel.replaceChildren();
    for (const p of rows) {
      const o = document.createElement("option");
      o.value = p.alias; o.textContent = p.alias;
      sel.appendChild(o);
    }
    if (!state.player || !rows.some(p => p.alias === state.player)) state.player = rows[0]?.alias ?? null;
    sel.value = state.player ?? "";

    // minus the player on show: swapping the player must not lose the vs term.
    const vs = $("vs");
    vs.replaceChildren(vs.options[0]);

  }

  async function refreshNotes() {
    try { setNotes(await getJson("/players")); paintPlayerNote(); } catch { /* the notes as they were */ }
  }

  function paintPlayerNote() {
    if (noteBox) return;
    const line = $("pnote");
    line.classList.remove("editing");
    line.replaceChildren();
    if (!state.player) return;
    // The ✎ leads, as on the review rows: after the text it hung off the widest
    // line, wherever that fell.
    const text = playerNotes.get(state.player);
    const pen = document.createElement("button");
    pen.type = "button"; pen.className = "pen";
    pen.textContent = text ? "✎" : "✎ note";
    pen.title = text ? `edit your note on ${state.player}` : `write down what you know about ${state.player}`;
    pen.addEventListener("click", editPlayerNote);
    line.appendChild(pen);
    if (text) {
      const fold = document.createElement("button");
      fold.type = "button"; fold.className = "fold";
      fold.textContent = noteHidden ? "show note" : "hide";
      fold.title = noteHidden ? "show your note on every player (also on the Players page)"
        : "hide notes on every player (still on the Players page)";
      fold.setAttribute("aria-expanded", !noteHidden);
      fold.addEventListener("click", () => {
        noteHidden = !noteHidden;
        try { localStorage.setItem(NOTE_HIDE_KEY, noteHidden ? "1" : "0"); } catch { /* this visit only */ }
        paintPlayerNote();
      });
      line.appendChild(fold);
    }
    if (text && !noteHidden) {
      const t = document.createElement("span");
      t.className = "text"; t.textContent = text;
      line.appendChild(t);
    }
  }

  function editPlayerNote() {
    // Saved against the player it was opened for, even if the HUD has moved the
    // chart on to someone else while you typed.
    const player = state.player;
    const box = document.createElement("textarea");
    box.value = playerNotes.get(player) || "";
    box.setAttribute("aria-label", `note on ${player}`);
    box.placeholder = `what you know about ${player} that no log records`;
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = "Ctrl+Enter or click away to save · Esc to cancel · empty to delete";
    noteBox = box;
    const close = () => {
      if (noteBox !== box) return;
      noteBox = null;
      paintPlayerNote();
    };
    async function save() {
      if (noteBox !== box || box.disabled) return;
      if (box.value.trim() === (playerNotes.get(player) || "").trim()) { close(); return; }
      box.disabled = true;
      try {
        const out = await postJson(`/players/${encodeURIComponent(player)}/note`, { note: box.value });
        if (out.note) playerNotes.set(player, out.note);
        else playerNotes.delete(player);
        close();
      } catch (e) {
        // The note is still in the box, and the box stays open with it.
        box.disabled = false;
        box.focus();
        showErr(e);
      }
    }
    box.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") { ev.stopPropagation(); close(); }
      else if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(); }
    });
    box.addEventListener("blur", save);
    const line = $("pnote");
    line.classList.add("editing");
    line.replaceChildren(box, hint);
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  }

  // Bumped by every load. Loads overlap -- the HUD posts a spot each time the
  // action moves, and a view can be switched while the last one is in flight --
  // so a response that lands after a newer load began is dropped: drawn, it put
  // one view's data under another view's renderer. Nor does it touch a cache:
  // an older answer landing last would replace a newer one there.
  let loadSeq = 0;
  async function load({ quiet = false } = {}) {
    if (!state.player) return;
    paintPlayerNote(); // the player on show may have changed
    const seq = ++loadSeq;
    const live = () => seq === loadSeq;
    const view = state.by;
    if (!quiet) $("card").classList.add("loading");
    $("err").classList.add("hidden");
    state.handRows = null; // the hand set may have grown or changed
    const player = encodeURIComponent(state.player);
    const q = new URLSearchParams();
    if (state.filter) q.set("filter", state.filter);
    try {
      let data;
      if (view === SESSION_VIEW) {
        data = await loadSession(quiet, live);
      } else if (view === TAGGED_VIEW) {
        data = await loadTagged(quiet, live);
      } else if (isReview(view)) {
        // One request serves both views: switching between them re-renders
        // rather than re-fetching, unless the HUD said there are new hands.
        const key = `${state.player}|${state.filter}`;
        if (!quiet && state.review?.key === key) {
          data = state.review.data;
        } else {
          data = await getJson(`/players/${player}/review?` + q);
          if (!("counts" in data)) {
            throw new Error("the running server is older than this page: restart `pnt service` (or `pnt serve`)");
          }
          if (live()) state.review = { key, data };
        }
      } else if (view === "bluffs") {
        data = await loadBluffs(quiet, live);
      } else if (view === "sizing") {
        // Fold equity rides along: same player and spot, every street at once. A
        // server too old to have it costs that section, not the view.
        const fe = getJson(`/players/${player}/fold_equity?` + q).catch(e => ({ error: String(e.message || e) }));
        q.set("street", state.street); q.set("kind", state.kind);
        data = await getJson(`/players/${player}/sizing?` + q);
        data.fold_equity = await fe;
      } else if (view === LINES_VIEW) {
        q.set("mode", state.lmode);
        if (state.lstreet) q.set("street", state.lstreet);
        data = await getJson(`/players/${player}/lines?` + q);
      } else if (view === "strength") {
        q.set("street", state.street); q.set("floor", state.floor);
        data = await getJson(`/players/${player}/slowplay?` + q);
      } else if (view === "tilt") {
        data = await getJson(`/players/${player}/tilt?` + q);
      } else if (view === "timing") {
        data = await loadTiming(quiet, live);
      } else if (view === "shows") {
        // Shows are not hands in a spot: the spot box does not narrow them.
        data = await getJson(`/players/${player}/shows`);
      } else if (view === "bounties" || view === "nit") {
        data = await getJson(view === "nit" ? "/nit" : "/bounties");
        data.player = state.player;
      } else if (view === "results") {
        // The red and blue lines ride along: same player and spot. A server too
        // old to have them costs the graph, not the view.
        const wq = new URLSearchParams(q); wq.set("adjusted", "true");
        const w = getJson(`/players/${player}/winnings?` + wq).catch(e => ({ error: String(e.message || e) }));
        const fn = getJson(`/players/${player}/funnel?` + q).catch(e => ({ error: String(e.message || e) }));
        data = await getJson(`/players/${player}/results?` + q);
        data.winnings = await w;
        data.funnel = await fn;
      } else if (view === TREE_VIEW) {
        data = await loadTree(quiet, live);
      } else if (view === "made" && state.made === "streets") {
        // The made view's tiles ride on its range; the Streets tab draws /streets.
        const st = getJson(`/players/${player}/streets?` + q).catch(e => ({ error: String(e.message || e) }));
        const rq = new URLSearchParams(q); rq.set("by", view);
        data = await getJson(`/players/${player}/range?` + rq);
        data.streets = await st;
      } else {
        q.set("by", view);
        data = await getJson(`/players/${player}/range?` + q);
        const probe = data.cells ? Object.values(data.cells)[0] : data.classes?.[0];
        if (probe && !("hand_ids" in probe)) {
          throw new Error("the running server is older than this page (no hand ids in its data): restart `pnt service` (or `pnt serve`)");
        }
      }
      if (!live()) return;
      state.data = data;
      state.dataView = view;
      render();
      loadStrip(live);
    } catch (e) {
      if (!live()) return;
      $("err").textContent = String(e.message || e);
      $("err").classList.remove("hidden");
      // The strip above the card still describes the spot before this one.
      $("strip").classList.add("hidden");
    } finally {
      if (live()) $("card").classList.remove("loading");
    }
  }

  // The player's games, newest first, for the session picker. Fetched once per
  // player; a quiet reload (the HUD saying there are new hands) asks again, since
  // a new game may just have started. False when a newer load has taken over.
  async function loadGames(quiet, live) {
    const player = state.player;
    if (quiet || state.games?.player !== player) {
      const rows = await getJson(`/players/${encodeURIComponent(player)}/games`);
      if (!live()) return false;
      state.games = { player, rows };
    }
    const rows = state.games.rows;
    // A game the player was not in -- another player's session in the URL, or
    // none asked for -- falls back to their latest.
    if (!rows.some(g => g.game_id === state.game)) state.game = rows[0]?.game_id ?? null;
    const sel = $("session-game");
    sel.replaceChildren();
    for (const g of rows) {
      const o = document.createElement("option");
      o.value = g.game_id;
      const d = new Date(g.first_ts || g.started_at);
      const when = isNaN(d) ? g.game_id : SESSION_DATE.format(d);
      o.textContent = `${when} · ${g.hands} hands${g.bb ? ` · ${g.sb}/${g.bb}` : ""}`;
      o.title = g.game_id;
      sel.appendChild(o);
    }
    sel.value = state.game ?? "";
    return true;
  }
  const SESSION_DATE = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

  // Every hand of one game, with the flags the review views would give it merged
  // onto the row: one list, so a flagged hand is never shown twice. With Sat out
  // on, the hands they were not dealt into join it. Every filter describes their
  // own spot, so a filtered session has none of those.
  async function loadSession(quiet, live) {
    if (!await loadGames(quiet, live)) return null;
    const satOut = state.satOut && !!state.game && !state.filter;
    const key = `${state.player}|${state.filter}|${state.game}|${satOut}`;
    if (!quiet && state.session?.key === key) return state.session.data;
    const player = encodeURIComponent(state.player);
    const q = new URLSearchParams();
    if (state.filter) q.set("filter", state.filter);
    if (state.game) q.set("game", state.game);
    const [hands, review, away] = state.game
      ? await Promise.all([
          getJson(`/players/${player}/hands?` + q),
          getJson(`/players/${player}/review?` + q),
          satOut ? getJson(`/players/${player}/sat-out?` + q) : { hands: [] },
        ])
      : [{ hands: [] }, { hands: [] }, { hands: [] }];
    if (!live()) return null;
    if (hands.hands.length && !("reviewed" in hands.hands[0])) {
      throw new Error("the running server is older than this page: restart `pnt service` (or `pnt serve`)");
    }
    const flags = new Map();
    for (const r of review.hands) {
      if (!flags.has(r.hand_id)) flags.set(r.hand_id, []);
      flags.get(r.hand_id).push({ kind: r.kind, label: KIND_LABEL[r.kind] || r.label, group: r.group, why: r.why });
    }
    for (const h of hands.hands) h.flags = flags.get(h.hand_id) || [];
    for (const h of away.hands) h.flags = [];
    // Newest first, like the server's own order, which the "newest" order keeps.
    const all = away.hands.length
      ? [...hands.hands, ...away.hands].sort((a, b) => (b.ts || "").localeCompare(a.ts || "") || b.hand_number - a.hand_number)
      : hands.hands;
    const data = { player: state.player, filter: state.filter, game: state.game, hands: all };
    state.session = { key, data };
    return data;
  }

  // ---- render ----------------------------------------------------------
  const fmtBb = (v) => (v > 0 ? "+" : "") + v.toFixed(1) + " bb";
  const fmtPct = (v) => v == null ? "–" : v.toFixed(1) + "%";
  // A won or lost figure in the profit or loss colour: .up above zero, .down
  // below, neither at zero or with no figure. Given `bb`, the result's size on a
  // tile, one under BIG_BB takes the softer tone. Clears its own classes first,
  // so a reused element never keeps an old sign.
  const BIG_BB = 100;
  function signTone(el, v, bb = null) {
    el.classList.remove("up", "down", "soft");
    if (v > 0 || v < 0) {
      el.classList.add(v > 0 ? "up" : "down");
      if (bb != null && Math.abs(bb) < BIG_BB) el.classList.add("soft");
    }
    return el;
  }
  // `text` as a span in `v`'s colour, for a result inside a line of muted text.
  const toned = (text, v) => signTone(Object.assign(document.createElement("span"), { textContent: text }), v);
  // A figure against its baseline, as the class word for .num-good/-bad/-eh:
  // "good" more than `band` above it, "bad" more than `band` below, "eh" within.
  // Given a 95% interval [lo, hi] instead, only one clear of the baseline is
  // coloured, so noise isn't painted: "good", "bad", or "" where it overlaps.
  function numTone(v, base, band = 0) {
    if (v == null || base == null) return "";
    if (Array.isArray(v)) return v[0] > base ? "good" : v[1] < base ? "bad" : "";
    return v - base > band ? "good" : base - v > band ? "bad" : "eh";
  }

  // Wilson 95% interval for a rate of p (0..1) over n chances, as [lo, hi]
  // fractions; null with no chances. Mirrors queries.wilson (SPEC.md,
  // "Confidence intervals"); stats.html and the HUD's spot.js carry the same copy.
  function wilson(p, n, z = 1.96) {
    if (!(n > 0) || p == null) return null;
    const z2 = z * z;
    const centre = (p + z2 / (2 * n)) / (1 + z2 / n);
    const half = z * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n)) / (1 + z2 / n);
    return [Math.max(0, centre - half), Math.min(1, centre + half)];
  }

  // A rate in percent over n chances, as hover text: "± 8.6 pts (95%: 31.2–48.5%)".
  // Wilson is lopsided near 0% and 100%, so the range is printed beside the ±.
  function ciText(pct, n) {
    const ci = pct == null ? null : wilson(pct / 100, n);
    if (!ci) return "";
    const [lo, hi] = ci.map((x) => 100 * x);
    return `± ${((hi - lo) / 2).toFixed(1)} pts (95%: ${lo.toFixed(1)}–${hi.toFixed(1)}%)`;
  }
  // How each cell's habitual size was decided; see typical_size() in ranges.py.
  const BASIS = {
    mean: "mean; these raises agree",
    median: "median; an outlier raise is present",
    single: "one raise only",
    midpoint: "midpoint of two raises that disagree",
    none: "never raised",
  };
  // Made-hand rows come flat, one per leaf of cards.MADE_LEAVES: top pair is a
  // row of its own, with no "pair" row above it counting the same hands again.
  // Three leaves read wrong bare: "trips" is one hole card to a paired board (it
  // used to read "one hole card", which looks like a player who showed one card),
  // a pocket pair here is one under a board card, and a board pair is a pair the
  // hole cards add nothing to.
  const MADE_LABEL = { trips: "trips (paired board)", pocket_pair: "underpair", board_pair: "board pair only" };
  const classRows = (classes) => classes.map(c => ({ c, text: MADE_LABEL[c.class] || c.class.replace(/_/g, " ") }));
  // The term that finds a made-hand row's hands, added to the spot: `made=` reads
  // the final board the way the composition does (SPEC judgement call 31), so the
  // list it brings back is the row. A hand that ended before the flop has no
  // made hand to name, and lists by its ids.
  const madeTerm = (c) => c.class === "no_board" ? null : `made=${c.class}`;
  const TITLE = {
    preflop: "Starting hands", made: "What they had made", sizing: "What they had, by bet size",
    lines: "What they had, by line",
    review: "Hands to review", beats: "Bad beats", session: "Session",
    bluffs: "Value against bluffs, by kind of aggression",
    strength: "Strength by street",
    results: "Big blinds won and lost",
    tilt: "After a big loss, and through the night",
    timing: "How long they took, and what they had",
    shows: "Shown without being asked",
    bounties: "7-2 bounties",
    nit: "Nit Game",
  };

  // ---- lines ---------------------------------------------------------------
  // Every line they took after the flop, one row each, with what the hands in it
  // were when shown: nutted, strong, marginal, a draw or air, on the board of the
  // last street they acted on. See "Strength by line" in SPEC.md. A row and each
  // of its segments carry the filter that finds exactly their hands; clicking one
  // adds that filter to the spot and lists the hands, so the view narrows to it.
  const LINES_VIEW = "lines";
  const LINES_NOTE = [
    "**Strength:** read on the board of the last street they acted on, shown hands only.",
    "A line that often wins uncontested looks stronger than it is: read coverage first.",
    "**Whole street:** THEIRS IN CAPS, others lower case; **-** not in that street, **.** nobody acted (run-out after an all-in).",
  ];
  // Strongest first. The colours are the page's two ramps as a diverging scale:
  // blue for made value, the grey midpoint for marginal, red for draws and air.
  const TIERS = [
    ["nutted", "beats nearly every holding on that board"],
    ["strong", "a value hand on that board: top pair or better on most"],
    ["marginal", "a pair of their own that beats only some"],
    ["draw", "a flush or straight draw and no pair of their own; flop and turn only"],
    ["air", "high card or a board pair, and on the river a draw that missed"],
  ];
  const tierColor = (t) => ({ nutted: ramp(BLUE)[5], strong: ramp(BLUE)[2], marginal: "var(--axis)",
                              draw: ramp(RED)[2], air: ramp(RED)[5] })[t];
  // The lines people ask about most, as spot terms. One at a time: two lines
  // ANDed together is rarely a question.
  const LINE_CHIPS = [
    ["xc/xc/xc", "line=xc/xc/xc", "check-called every street"],
    ["c/c/c", "line=c/c/c", "called a bet on every street without checking first"],
    ["b/b/b", "line=b/b/b", "bet every street"],
    ["b/x/b", "line=b/x/b", "bet the flop, checked the turn, bet the river"],
    ["x/b/", "line=x/b/", "checked the flop, bet the turn, any river"],
    ["xr*//", "line=xr*//", "check-raised the flop"],
    ["xB*/xB*/", "action=xB*/xB*/", "checked to on the flop and the turn, and bet both"],
    // The bets a missed c-bet leaves open (SPEC.md, "Delayed c-bet, probe and float").
    ["probe", "probe_turn", "bet the turn into the preflop raiser, who checked the flop back"],
    ["float", "float_turn", "called on the flop, then bet the turn when the flop's aggressor checked"],
  ];
  const LINE_CHIP_TERMS = LINE_CHIPS.map(([, t]) => t);
  const LINE_WORD = { x: "check", b: "bet", c: "call", r: "raise", f: "fold" };

  // One street of a line in words. Their own line reads `xc` as check-call; the
  // whole street writes every action, theirs in bold -- `xBr` is check · bet · raise.
  function lineWords(seg, mode) {
    const el = document.createElement("span");
    if (seg === "-") { el.textContent = mode === "own" ? "did not act" : "not in the hand"; return el; }
    if (seg === ".") { el.textContent = "no action (all in)"; return el; }
    if (mode === "own") { el.textContent = [...seg].map(ch => LINE_WORD[ch] ?? ch).join("-"); return el; }
    [...seg].forEach((ch, i) => {
      if (i) el.append(" · ");
      const word = LINE_WORD[ch.toLowerCase()] ?? ch;
      if (ch === ch.toUpperCase()) { const b = document.createElement("b"); b.textContent = word; el.append(b); }
      else el.append(word);
    });
    return el;
  }

  // Which tree rows are open, by mode and line: kept while the page is open.
  const lineOpen = new Set();
  const fmtNet = (v) => v == null ? "–" : fmtBb(v);

  // The terms a click in the tree adds: a line, a whole-street sequence, and the
  // made hand of a strength segment.
  const LINE_DRILL = /^(?:line|action)(?:_(?:flop|turn|river))?!?=|^made(?:_(?:flop|turn|river))?(?:[!<>]?=|[<>])/;

  // Add a row's (or segment's) terms to the spot and list its hands.
  function drillLine(filter, title) {
    const cur = terms();
    $("filter").value = [...cur, ...filter.split(",").filter(t => !cur.includes(t))].join(",");
    apply();
    openHands(title, null);
  }

  function showLineTip(ev, title, rows) {
    const tip = $("tip");
    tip.replaceChildren();
    const big = document.createElement("div"); big.className = "big"; big.textContent = title;
    tip.appendChild(big);
    for (const [k, v] of rows) {
      const r = document.createElement("div"); r.className = "row";
      const kk = document.createElement("span"); kk.textContent = k;
      const vv = document.createElement("b"); vv.textContent = v;
      r.append(kk, vv); tip.appendChild(r);
    }
    tip.style.display = "block";
    const rect = (ev.currentTarget || ev.target).getBoundingClientRect();
    const x = ev.clientX ?? rect.right, y = ev.clientY ?? rect.top;
    tip.style.left = Math.min(x + 14, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = Math.min(y + 14, innerHeight - tip.offsetHeight - 8) + "px";
  }

  function renderLinesTiles(d) {
    setTileKeys("hands in this spot ›", "shown, on a street they acted", "coverage");
    $("t-hands").textContent = d.hands;
    $("t-known").textContent = d.known;
    $("t-cov").textContent = fmtPct(d.coverage);
    $("t-raise").textContent = d.groups.length;
    setRaiseKey("lines", d.hidden.groups
      ? `${d.hidden.groups} more under ${d.min} hands hidden · ${d.hidden.hands} hands`
      : `each with ${d.min}+ hands`);
  }

  function renderLines(d, table) {
    document.querySelectorAll("[data-lmode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lmode === d.mode));
    $("lstreet").value = d.street || "";
    const host = table ? $("table") : $("lineview");
    host.replaceChildren();

    // While a click has the spot narrowed to a line, the way back is here, beside
    // the tree, and not only up in the controls: Back undoes the last change, and
    // "all lines" takes out every line and made-hand term while keeping the rest.
    // One click in, the two land on the same spot, so only Back shows; "all lines"
    // joins it once Back would stop short of every line. Back at every line, the
    // bar goes; the Back up top still undoes.
    const narrowed = state.filter.split(",").map(t => t.trim()).filter(t => LINE_DRILL.test(t));
    if (narrowed.length) {
      const unlined = terms().filter(t => !LINE_DRILL.test(t)).join(",");
      const bar = document.createElement("div"); bar.className = "lback";
      if (spotHistory.length) {
        const b = document.createElement("button"); b.type = "button"; b.textContent = "← Back";
        const prev = spotHistory.at(-1);
        b.title = `back to ${prev ? prev : "all hands"} (Alt+←)`;
        b.addEventListener("click", back);
        bar.appendChild(b);
      }
      const what = document.createElement("span");
      what.append("narrowed to ");
      const code = document.createElement("code"); code.textContent = narrowed.join(",");
      what.appendChild(code);
      const all = document.createElement("button"); all.type = "button"; all.textContent = "× all lines";
      all.title = "take the line and made-hand terms out of the spot, keep the rest";
      all.addEventListener("click", () => {
        $("filter").value = unlined;
        apply();
      });
      bar.append(what);
      const prevSpot = spotHistory.length
        ? spotHistory.at(-1).split(",").map(t => t.trim()).filter(Boolean).join(",") : null;
      if (prevSpot !== unlined) bar.append(all);
      host.appendChild(bar);
    }

    const chips = document.createElement("div"); chips.className = "presets";
    const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "Common lines";
    lbl.title = "flop/turn/river; an empty street is any";
    chips.appendChild(lbl);
    for (const [text, term, what] of LINE_CHIPS) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = text;
      b.title = `${what} · ${term}`;
      b.dataset.term = term;
      b.setAttribute("aria-pressed", hasTerm(term));
      b.addEventListener("click", () => { setOneOf(LINE_CHIP_TERMS, term); apply(); });
      chips.appendChild(b);
    }
    host.appendChild(chips);

    const title = (g) => `${g.line} · ${g.n} hand${g.n === 1 ? "" : "s"}`;
    const tierTitle = (g, t) => `${g.line} · ${t} on the ${g.rated_on}`;
    if (!d.groups.length) {
      host.appendChild(message(d.hands ? `every line here has fewer than ${d.min} hands` : "no hands in this spot"));
    } else if (table) {
      const t = document.createElement("table");
      const head = document.createElement("tr");
      for (const c of ["line", "n", "shown", "coverage", "net bb", ...TIERS.map(([n]) => n), "read on"]) {
        const th = document.createElement("th"); th.textContent = c; head.appendChild(th);
      }
      t.appendChild(head);
      for (const g of d.groups) {
        const tr = document.createElement("tr");
        const vals = [g.line, g.n, g.known, fmtPct(g.coverage), g.net_bb == null ? null : g.net_bb.toFixed(1),
          ...TIERS.map(([n]) => g.known ? fmtPct(g.tiers[n].pct) : null), g.rated_on];
        for (const v of vals) { const td = document.createElement("td"); td.textContent = v ?? "–"; tr.appendChild(td); }
        tr.tabIndex = 0; tr.setAttribute("role", "button"); tr.classList.add("pick");
        tr.setAttribute("aria-label", `${title(g)} — add ${g.filter} and list these hands`);
        tr.addEventListener("click", () => drillLine(g.filter, title(g)));
        tr.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); drillLine(g.filter, title(g)); } });
        t.appendChild(tr);
      }
      host.appendChild(t);
    } else {
      const legend = document.createElement("div"); legend.className = "legend";
      for (const [name, what] of TIERS) {
        const s = document.createElement("span"); s.title = what;
        const sw = document.createElement("i"); sw.style.background = tierColor(name);
        s.append(sw, name);
        legend.appendChild(s);
      }
      host.appendChild(legend);

      const rows = document.createElement("div"); rows.className = "lrows";
      for (const h of ["line", "hands", "strength of the hands shown", "shown · net"]) {
        const el = document.createElement("div"); el.className = "h" + (h === "hands" ? " num" : ""); el.textContent = h;
        rows.appendChild(el);
      }
      // The tree: what they did on the flop, opening into the turn and then the
      // river, so every way of checking the flop sits under one row that adds
      // them up. A row's strength is read on the last street of it they acted on.
      const streets = ["flop", "turn", "river"];
      const addNode = (g, depth) => {
        const segs = g.line.split("/");
        const key = `${d.mode}|${g.line}`;
        const open = lineOpen.has(key);
        const kids = g.children.length > 0;

        const lab = document.createElement("div"); lab.className = "lab tlab" + (depth ? " tsub" : "");
        lab.style.paddingLeft = `${depth * 16}px`;
        const caret = document.createElement("button"); caret.type = "button";
        caret.className = "caret" + (kids ? "" : " leaf");
        caret.textContent = open ? "▾" : "▸";
        if (kids) {
          caret.setAttribute("aria-expanded", open);
          caret.title = open ? "close" : `open the ${streets[segs.length]} under this`;
          caret.addEventListener("click", () => { open ? lineOpen.delete(key) : lineOpen.add(key); renderLines(d, false); });
        } else caret.tabIndex = -1;
        const st = document.createElement("span"); st.className = "st"; st.textContent = d.street || streets[segs.length - 1];
        const words = lineWords(segs.at(-1), d.mode); words.classList.add("words");
        words.title = `${g.line} · add ${g.filter} to the spot and list these hands`;
        words.tabIndex = 0; words.setAttribute("role", "button");
        words.addEventListener("click", () => drillLine(g.filter, title(g)));
        words.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); drillLine(g.filter, title(g)); } });
        const code = document.createElement("span"); code.className = "code"; code.textContent = g.line;
        lab.append(caret, st, words, code);
        if (kids && !open) {
          const ways = document.createElement("span"); ways.className = "ways";
          ways.textContent = `${g.children.length} way${g.children.length === 1 ? "" : "s"} on`;
          lab.appendChild(ways);
        }

        const n = document.createElement("div"); n.className = "num"; n.textContent = g.n;
        const stack = document.createElement("div"); stack.className = "stack";
        if (!g.known) {
          stack.classList.add("none");
          stack.textContent = !g.rated_on ? "no action after the flop" : "none shown";
        }
        for (const [name] of g.known ? TIERS : []) {
          const tier = g.tiers[name];
          if (!tier.n) continue;
          const seg = document.createElement("i");
          seg.style.flex = `${tier.n} 1 0`;
          seg.style.background = tierColor(name);
          seg.tabIndex = 0; seg.setAttribute("role", "button");
          seg.setAttribute("aria-label", `${name}: ${tier.n} of ${g.known} shown, ${fmtPct(tier.pct)}`);
          const tip = [[name, `${tier.n} of ${g.known} shown`], ["share", fmtPct(tier.pct)],
            ["draw-heavy", fmtPct(g.draw_heavy)], ["read on", g.rated_on], ["click", "add to the spot"]];
          seg.addEventListener("pointermove", (ev) => showLineTip(ev, g.line, tip));
          seg.addEventListener("pointerleave", hideTip);
          seg.addEventListener("focus", (ev) => showLineTip(ev, g.line, tip));
          seg.addEventListener("blur", hideTip);
          if (tier.filter) {
            seg.addEventListener("click", () => { hideTip(); drillLine(tier.filter, tierTitle(g, name)); });
            seg.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); drillLine(tier.filter, tierTitle(g, name)); } });
          }
          stack.appendChild(seg);
        }
        const val = document.createElement("div"); val.className = "val";
        val.textContent = `${g.known}/${g.n} (${fmtPct(g.coverage)})`;
        const sm = document.createElement("small"); sm.appendChild(toned(fmtNet(g.net_bb), g.net_bb));
        val.appendChild(sm);
        rows.append(lab, n, stack, val);

        if (!open) return;
        for (const c of g.children) addNode(c, depth + 1);
        if (g.hidden.groups) {
          const more = document.createElement("div"); more.className = "tmore";
          more.style.paddingLeft = `${(depth + 1) * 16 + 18}px`;
          more.textContent = `${g.hidden.groups} more way${g.hidden.groups === 1 ? "" : "s"} on with fewer than `
            + `${d.min} hands (${g.hidden.hands} hands)`;
          rows.appendChild(more);
        }
      };
      // One street only has no tree: those groups are already one level.
      if (d.tree) for (const g of d.tree) addNode(g, 0);
      else for (const g of d.groups) addNode({ ...g, children: [], hidden: { groups: 0, hands: 0 } }, 0);
      host.appendChild(rows);
    }
    if (d.hidden.groups) {
      host.appendChild(message(`${d.hidden.groups} more line${d.hidden.groups === 1 ? "" : "s"} with fewer than `
        + `${d.min} hands hidden (${d.hidden.hands} hands). Narrow to one street to fold them together.`));
    }
    const hint = message("click a line, or one part of its bar, to add it to the spot and list its hands");
    hint.classList.add("note");
    if (table) hint.style.margin = "4px 0 0";
    host.appendChild(hint);
  }

  document.querySelectorAll("[data-lmode]").forEach(b => b.addEventListener("click", () => {
    state.lmode = b.dataset.lmode; writeUrl(); closeHands(); load();
  }));
  $("lstreet").addEventListener("change", () => { state.lstreet = $("lstreet").value; writeUrl(); closeHands(); load(); });

  // ---- value:bluff -----------------------------------------------------------
  // What they bet, raised and jammed with, one row per kind of aggression and
  // grouped by street: a stacked bar of the shown hands, read on the board of the
  // street the action was made on, then value : bluff, how many were shown, and
  // for bets how many everyone folded to. The pool is the same table over every
  // player and every hand. A row lists its hands on a click, a segment the hands
  // of its class: one player's from the ids the row carries, the pool's from
  // /bluffs/hands, since its ids name nobody. See SPEC.md, "Value:bluff".
  const BV_CLASSES = [["value", "value"], ["marginal", "marginal"], ["semi_bluff", "semi-bluff"], ["bluff", "bluff"]];
  const BV_CLASS_TIP = {
    value: "a value hand on that board: top pair or better on most",
    marginal: "a pair of their own that beats only some",
    semi_bluff: "no pair, a flush or straight draw (flop and turn)",
    bluff: "no pair and no draw; on the river a missed draw too",
  };
  const BV_STREET = { flop: "Flop", turn: "Turn", river: "River", all: "Every street" };
  // Which size rows are open, by street and size: kept while the page is open.
  const bvOpen = new Set();
  const BV_NOTE = [
    "**Shown hands only**, each read on the street it bet or raised.",
    "A bluff that got folds is never shown, so every ratio leans to value; **folded** counts the bets that got there.",
    "**Your own rows** are near complete: all your cards are known.",
    "**Ratio:** value against bluffs and semi-bluffs; marginal hands are neither.",
  ];

  async function loadBluffs(quiet, live) {
    const pool = state.bluffScope === "pool";
    const key = `${pool ? "*pool*" : state.player}|${state.filter}`;
    // Both scopes are kept, so the toggle flips between them without asking again;
    // the pool is every hand in the database and takes a second or two.
    if (!quiet && state.bluffs?.has(key)) return state.bluffs.get(key);
    const q = new URLSearchParams();
    if (state.filter) q.set("filter", state.filter);
    const data = await getJson(pool ? "/bluffs?" + q : `/players/${encodeURIComponent(state.player)}/bluffs?` + q);
    if (live()) (state.bluffs ??= new Map()).set(key, data);
    return data;
  }

  // The pool's hands behind one row, or one class of it, in the drill-down list,
  // each with the player who took the line where a review row puts its flag.
  async function openPoolHands(title, key, cls) {
    const seq = ++handsSeq;
    state.poolHands = [title, key, cls];
    $("hands").classList.remove("hidden");
    $("hands-title").textContent = title;
    $("hands-count").textContent = "";
    resetReplay($("replay"), true);
    applyLayout();
    const list = $("hand-rows");
    list.replaceChildren(message("loading…"));
    try {
      const q = new URLSearchParams({ category: key });
      if (cls) q.set("cls", cls);
      if (state.filter) q.set("filter", state.filter);
      const body = await getJson("/bluffs/hands?" + q);
      if (seq !== handsSeq) return;
      let rows = body.hands;
      if (state.handSort === "pot") rows = [...rows].sort((a, b) => (b.pot ?? -1) - (a.pot ?? -1));
      list.replaceChildren();
      const shown = Math.min(rows.length, HAND_LIMIT);
      $("hands-count").textContent = body.total > shown
        ? `${state.handSort === "pot" ? "biggest pots of the" : ""} newest ${shown} of ${body.total}`.trim()
        : `${body.total} hand${body.total === 1 ? "" : "s"}`;
      if (!rows.length) list.appendChild(message("no hands"));
      for (const h of rows.slice(0, HAND_LIMIT)) {
        const row = handRowButton(h, list, $("replay"), { kind: { text: h.player, group: "player" } });
        list.appendChild("note" in h ? reviewedRow(h, row, { noteOnly: true }) : row);
      }
    } catch (e) {
      if (seq !== handsSeq) return;
      list.replaceChildren(message(String(e.message || e), "err"));
    }
    $("hands").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function bvTip(ev, r, cls) {
    const tip = $("tip");
    tip.replaceChildren();
    const big = document.createElement("div"); big.className = "big";
    big.textContent = cls ? `${r.counts[cls]}× ${BV_CLASSES.find(([k]) => k === cls)[1]}` : r.label;
    tip.appendChild(big);
    const rows = cls ? [[BV_CLASS_TIP[cls], ""], ["of the shown", fmtPct(r.pct[cls])]] : [];
    rows.push(["value : bluff", r.ratio_text], ["shown", `${r.known} of ${r.n}`]);
    if (r.folded != null) rows.push(["everyone folded", `${r.folded} of ${r.n}`]);
    rows.push(["filter", (cls ? r.class_filters[cls] : r.filter) || "none: listed by hand"]);
    for (const [k, v] of rows) {
      const row = document.createElement("div"); row.className = "row";
      const kk = document.createElement("span"); kk.textContent = k;
      const vv = document.createElement("b"); vv.textContent = v;
      row.append(kk, vv); tip.appendChild(row);
    }
    tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const rect = (ev.currentTarget || ev.target).getBoundingClientRect();
    const x = ev.clientX ?? rect.right, y = ev.clientY ?? rect.top;
    tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
    tip.style.top = Math.min(y + 14, innerHeight - h - 8) + "px";
  }

  function renderBluffs(d) {
    const pool = d.scope === "pool";
    const all = d.rows.find(r => r.key === "aggression");
    setTileKeys(pool ? "player-hands in the pool" : "hands in this spot ›", "aggressive hands shown", "coverage");
    $("t-hands").textContent = d.hands;
    $("t-known").textContent = all.known;
    $("t-cov").textContent = fmtPct(all.coverage);
    $("t-raise").textContent = all.ratio_text;
    setRaiseKey("value : bluff", `all aggression · ${all.n} hands bet or raised`);
    $("subtitle").textContent = `${pool ? `the pool, ${d.players} players` : d.player} · ${d.filter || "all hands"}`;
    setNote(BV_NOTE);
    // Every other view's parts: whichever view came before, it leaves nothing behind.
    for (const id of ["colorseg", "sizingctl", "linesctl", "reviewctl", "tabletoggle", "grid", "scale", "bars", "sizing",
      "foldeq", "results", "lineview", "strength", "table", "review", "tilt", "timing", "shows", "bounty", "groupby",
      "tree", "treectl", "madeseg", "streets",
      "tagged", "est", "esttoggle"]) {
      $(id).classList.add("hidden");
    }
    $("duo").classList.remove("two");
    $("card-title").textContent = TITLE.bluffs;
    applyLayout();

    const wrap = $("bluffs");
    wrap.replaceChildren();
    const head = document.createElement("div"); head.className = "bv-head";
    const seg = document.createElement("span"); seg.className = "seg"; seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "Whose hands");
    for (const [scope, text] of [["player", state.player], ["pool", "Pool"]]) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = text;
      b.title = scope === "pool" ? "every player, every hand" : "this player's hands";
      b.setAttribute("aria-pressed", (scope === "pool") === pool);
      b.addEventListener("click", () => {
        if (state.bluffScope === scope) return;
        state.bluffScope = scope; closeHands(); writeUrl(); load();
      });
      seg.appendChild(b);
    }
    const key = document.createElement("span"); key.className = "bv-key";
    for (const [k, text] of BV_CLASSES) {
      const s = document.createElement("span"); s.title = BV_CLASS_TIP[k];
      const i = document.createElement("i"); i.style.background = `var(--bv-${k})`;
      s.append(i, text); key.appendChild(s);
    }
    head.append(seg, key);
    wrap.appendChild(head);

    const drill = (r, cls) => {
      const what = cls ? ` · ${BV_CLASSES.find(([k]) => k === cls)[1]}` : "";
      const size = r.parent ? `${d.rows.find(p => p.key === r.parent).label} · ` : "";
      const title = `${BV_STREET[r.street]} ${size}${r.label}${what}`;
      if (pool) { openPoolHands(title, r.key, cls); return; }
      state.poolHands = null;
      openHands(title, cls ? r.class_ids[cls] : r.hand_ids);
    };
    const pick = (el, fn) => {
      el.tabIndex = 0; el.setAttribute("role", "button");
      el.addEventListener("click", (e) => { e.stopPropagation(); fn(); });
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); fn(); } });
    };
    for (const street of d.streets) {
      const rows = d.rows.filter(r => r.street === street);
      const block = document.createElement("div"); block.className = "bv-street";
      const h = document.createElement("h3"); h.textContent = BV_STREET[street];
      const grid = document.createElement("div"); grid.className = "bv-rows";
      for (const [text, cls] of [["", ""], ["shown hands", ""], ["value : bluff", "num"], ["shown", "num"], ["folded", "num"]]) {
        const c = document.createElement("div"); c.className = `bv-cols ${cls}`; c.textContent = text; grid.appendChild(c);
      }
      // Size above action: a row per size, every bet or raise of it, opening into
      // the bet, the raise and the check-raise made at that size; then the
      // street's summaries across sizes. An action nobody took is left out.
      const kids = (r) => rows.filter(c => c.parent === r.key && c.n);
      const addRow = (r, depth) => {
        const sub = r.kind === "size" ? kids(r) : [];
        const open = bvOpen.has(r.key);
        const row = document.createElement("div");
        row.className = "bv-row" + (r.n ? "" : " none") + (["all_bets", "aggression"].includes(r.kind) ? " roll" : "");
        const lab = document.createElement("div"); lab.className = "lab tlab" + (depth ? " tsub" : "");
        lab.style.paddingLeft = `${depth * 16}px`;
        const caret = document.createElement("button"); caret.type = "button";
        caret.className = "caret" + (sub.length ? "" : " leaf");
        caret.textContent = open ? "▾" : "▸";
        if (sub.length) {
          caret.setAttribute("aria-expanded", open);
          caret.title = open ? "close" : "the bet, raise and check-raise at this size";
          caret.addEventListener("click", (e) => {
            e.stopPropagation(); open ? bvOpen.delete(r.key) : bvOpen.add(r.key); renderBluffs(d);
          });
        } else caret.tabIndex = -1;
        const words = document.createElement("span"); words.className = "words"; words.textContent = r.label;
        words.title = r.filter ? `${r.filter} · list these ${r.n} hands`
          : r.kind === "size" ? `every bet or raise this size · list these ${r.n} hands`
          : `bet or raised on any street · list these ${r.n} hands`;
        if (r.n) pick(words, () => drill(r, null));
        lab.append(caret, words);
        const bar = document.createElement("div"); bar.className = "bv-bar" + (r.known ? "" : " empty");
        for (const [k, text] of BV_CLASSES) {
          const v = r.counts[k];
          if (!v) continue;
          const s = document.createElement("span");
          s.style.flex = `${v} 1 0`; s.style.background = `var(--bv-${k})`;
          s.setAttribute("aria-label", `${r.label}: ${v} ${text}, list them`);
          pick(s, () => drill(r, k));
          s.addEventListener("pointermove", (ev) => bvTip(ev, r, k));
          s.addEventListener("pointerleave", hideTip);
          bar.appendChild(s);
        }
        if (r.n) {
          words.addEventListener("pointermove", (ev) => bvTip(ev, r, null));
          words.addEventListener("pointerleave", hideTip);
        }
        const num = (text, small, title) => {
          const c = document.createElement("div"); c.className = "num"; c.textContent = text;
          if (small) { const sm = document.createElement("small"); sm.textContent = small; c.appendChild(sm); }
          if (title) c.title = title;
          return c;
        };
        const ratio = num(r.n ? r.ratio_text : "–", "", `${r.counts.value} value against ${r.counts.bluff + r.counts.semi_bluff} bluffs and semi-bluffs`);
        const shown = num(r.n ? `${r.known}/${r.n}` : "none", r.n ? fmtPct(r.coverage) : "", "cards shown, of every hand in the row");
        const folded = num(r.folded_pct == null ? "" : fmtPct(r.folded_pct), "",
          r.folded == null ? "" : `${r.folded} of ${r.n} bets everyone folded to: never shown`);
        row.append(lab, bar, ratio, shown, folded);
        grid.appendChild(row);
        if (open) for (const c of sub) addRow(c, depth + 1);
      };
      for (const r of rows) if (!r.parent) addRow(r, 0);
      block.append(h, grid);
      wrap.appendChild(block);
    }
  }

  // Fold equity on the street the Sizing view is showing: their bets against a
  // pure bluff's break-even, and their defense against the MDF. Rendered into its
  // own block under the sizing blocks, and shown in the table mode too, since it
  // is a table already. See SPEC.md, "Fold equity by bet size".
  function renderFoldEquity(d) {
    const wrap = $("foldeq");
    wrap.replaceChildren();
    const fe = d.fold_equity;
    if (!fe || fe.error || !fe.streets) {
      wrap.appendChild(message(fe?.error
        ? `fold equity: ${fe.error}`
        : "fold equity: the running server is older than this page: restart `pnt service` (or `pnt serve`)", "err"));
      return;
    }
    const street = d.street;
    const s = fe.streets[street];
    const pct = (v) => v == null ? "–" : v.toFixed(1) + "%";
    const pts = (v) => v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(1);
    const pot = (v) => v == null ? "–" : Math.round(v * 100) + "% pot";
    const head = (title, small) => {
      const h = document.createElement("h3");
      const t = document.createElement("span"); t.textContent = title;
      const sm = document.createElement("small"); sm.textContent = small;
      h.append(t, sm);
      wrap.appendChild(h);
    };
    // One table; `cols` is [header, value(r), hot(r)?, sub(r)?] -- `hot` marks the
    // exploit signal, `sub` makes a cell list a subset of the row's hands.
    const table = (rows, cols, what) => {
      const box = document.createElement("div"); box.className = "tbl";
      const t = document.createElement("table");
      const hr = document.createElement("tr");
      for (const [h, , , , tip] of cols) {
        const th = document.createElement("th"); th.textContent = h; if (tip) th.title = tip; hr.appendChild(th);
      }
      t.appendChild(hr);
      for (const r of rows) {
        const tr = document.createElement("tr");
        if (!r.n) tr.className = "none";
        tr.title = r.filter + (r.judged ? "" : ` · under ${fe.min_sample} hands: not judged`);
        for (const [, val, hot, sub] of cols) {
          const td = document.createElement("td");
          td.textContent = val(r);
          if (hot && r.judged && hot(r)) td.classList.add("hot");
          const part = sub?.(r);
          if (part?.ids.length) {
            td.classList.add("sub");
            td.title = part.filter;
            td.addEventListener("click", (e) => { e.stopPropagation(); openHands(part.title, part.ids); });
          }
          tr.appendChild(td);
        }
        if (r.n) {
          tr.tabIndex = 0;
          tr.setAttribute("role", "button");
          const title = `${street} · ${what} · ${SIZE_LABEL[r.size]}`;
          tr.setAttribute("aria-label", `${title} — list these hands`);
          pickable(tr, title, r.hand_ids);
        }
        t.appendChild(tr);
      }
      box.appendChild(t);
      wrap.appendChild(box);
    };
    const size = ["size", (r) => SIZE_LABEL[r.size]];
    const typical = ["typical", (r) => pot(r.median_size), null, null, "the median bet in the bucket, over the pot"];

    head(`When they bet the ${street}: did everyone fold?`,
      `their own first bet on the street · ${s.totals.bets} bets · the fold equity their sizes earned`);
    table(s.bets, [
      size,
      ["bets", (r) => r.n],
      ["all folded", (r) => pct(r.fold), (r) => r.edge > 0,
        (r) => ({ ids: r.fold_hand_ids, filter: r.fold_filter, title: `${street} bets · ${SIZE_LABEL[r.size]} · everyone folded` }),
        "everyone who acted on the bet folded"],
      ["called", (r) => pct(r.call)],
      ["raised", (r) => pct(r.raise)],
      typical,
      ["break-even", (r) => pct(r.break_even), null, null, "how often a pure bluff this size must be folded to"],
      ["edge", (r) => pts(r.edge), (r) => r.edge > 0, null, "all folded minus break-even, in points: positive and a pure bluff this size showed a profit"],
    ], "their bets");
    const FACING = {
      faced: [`When they faced a bet or raise on the ${street}: did they fold?`,
        "anyone's bet or raise, the first time they faced one on the street"],
      faced_cbet: [`When they faced a c-bet on the ${street}: did they fold?`,
        "only a continuation bet from the last street's aggressor: a subset of the table above"],
    };
    for (const [key, what] of [["faced", "facing a bet or raise"], ["faced_cbet", "facing a c-bet"]]) {
      head(FACING[key][0], `${FACING[key][1]} · ${s.totals[key]} decisions`);
      table(s[key], [
        size,
        ["faced", (r) => r.n],
        ["fold", (r) => pct(r.fold), (r) => r.overfold > 0,
          key === "faced_cbet" ? (r) => ({ ids: r.fold_hand_ids, filter: r.fold_filter, title: `${street} · ${what} · ${SIZE_LABEL[r.size]} · folded` }) : null],
        ["call", (r) => pct(r.call)],
        ["raise", (r) => pct(r.raise)],
        typical,
        ["MDF", (r) => pct(r.mdf), null, null, "minimum defense frequency: how often to call or raise so a pure bluff this size does not profit"],
        ["over-fold", (r) => pts(r.overfold), (r) => r.overfold > 0, null, "fold minus (100 − MDF), in points: positive folds more than the bet demands"],
      ], what);
    }
    const note = bulletsInto(document.createElement("ul"), [
      "**Break-even:** the fold rate a no-equity bluff needs at that size. **MDF:** the share a defender must continue with.",
      `**Highlighted:** a size that profited as a pure bluff, or a defense that over-folds, on ${fe.min_sample}+ hands.`,
      "Every bet counts, shown or not: this says how often a size won, not what it was.",
      "Click a row for its hands; an underlined fold rate lists just the folds.",
    ]);
    note.className = "note"; note.style.margin = "10px 0 0";
    wrap.appendChild(note);
  }

  // ---- strength by street ------------------------------------------------
  // One row per made hand from the strongest down to a floor, one column per
  // thing they did on the street; the columns partition the line, so a row's
  // cells add up to its n. See SPEC.md, "Strength by street (slowplays)".
  const SP_FLOORS = [["full_house", "full house"], ["flush", "flush"], ["straight", "straight"],
                     ["set", "set"], ["two_pair", "two pair"], ["top_pair", "top pair"]];
  // Column groups, in the order the server lists its categories within them.
  const SP_GROUPS = [
    ["Bet it", ["bet", "raise", "check_raise"]],
    ["Slowplayed", ["check_call", "call", "checked", "checked_back"]],
    ["Gave up", ["check_fold", "fold", "other"]],
  ];
  // A gave-up column with nothing in it, in any row, is left off: it is almost
  // always empty for a strong hand and only widens the table.
  const SP_OPTIONAL = new Set(["check_fold", "fold", "other"]);
  const SP_LEAF = { trips: "trips (paired board)", total: "all of them" };
  const spLeaf = (leaf) => SP_LEAF[leaf] || leaf.replace(/_/g, " ");
  const SP_NOTE = [
    "**Grid:** slowplay % of each made hand they had on each street, shown hands only. Hover a cell for what they did, click for its hands.",
    "**Skew:** a strong hand that bet and got folds is never shown, so slowplay % reads high, except yours (all cards known).",
    "**Line by when made:** the whole line, by the street the hand first got that strong. Read coverage first.",
  ];

  function renderStrengthTiles(d) {
    // Every postflop hand sees the flop, so its counts are the view's coverage.
    const f = d.streets.flop, a = d.all_streets;
    setTileKeys("in the hand on the flop", "cards known", "coverage");
    $("t-hands").textContent = f.hands;
    $("t-known").textContent = f.known;
    $("t-cov").textContent = fmtPct(f.coverage);
    $("t-raise").textContent = fmtPct(a.slowplay_pct);
    setRaiseKey("slowplayed", `${a.slowplay} of ${a.n} shown ${spLeaf(d.floor)}+ streets, flop to river`);
    tileTip("t-raise", ciText(a.slowplay_pct, a.n));
  }

  // Which made hand the line-by-when-made table is for, and whether the per-action
  // table is open: kept while the page is open. An old link that named a turn or
  // river table opens it on that street.
  let spMadeLeaf = "total";
  let spDetailOpen = null;
  const SP_STREETS = ["flop", "turn", "river"];
  // A grid cell's bar: bet it, slowplayed, gave up, in the order of SP_GROUPS.
  const SP_MIX = ["var(--ink-2)", "var(--accent)", "var(--axis)"];
  // Lines listed per made-on street before the rest roll up.
  const SP_TOP_LINES = 4;

  function renderStrength(d) {
    const wrap = $("strength");
    wrap.replaceChildren();
    if (spDetailOpen === null) spDetailOpen = state.street !== "flop";
    const labels = Object.fromEntries(d.categories.map(c => [c.key, c.label]));

    // The picker: the weakest made hand counted.
    const ctl = document.createElement("div"); ctl.className = "sp-ctl";
    const fl = document.createElement("label"); fl.textContent = "made at least ";
    const sel = document.createElement("select"); sel.setAttribute("aria-label", "Weakest made hand counted");
    for (const [v, text] of SP_FLOORS) {
      const o = document.createElement("option"); o.value = v; o.textContent = text; sel.appendChild(o);
    }
    sel.value = d.floor;
    sel.addEventListener("change", () => { state.floor = sel.value; writeUrl(); load(); });
    fl.appendChild(sel);
    const key = document.createElement("span"); key.className = "sp-key";
    SP_GROUPS.forEach(([name], i) => {
      const k = document.createElement("i"); k.style.background = SP_MIX[i];
      const item = document.createElement("span"); item.append(k, name.toLowerCase());
      key.appendChild(item);
    });
    ctl.append(fl, key);
    wrap.appendChild(ctl);

    // The grid: a row per made hand, a column per street, each cell the slowplay
    // share of that hand on that street, shaded by it.
    const leaves = d.streets.flop.rows.map(r => r.leaf)
      .filter(leaf => SP_STREETS.some(s => d.streets[s].rows.find(r => r.leaf === leaf).n > 0));
    if (!leaves.length) {
      const p = document.createElement("p"); p.className = "muted";
      p.textContent = `no shown ${spLeaf(d.floor)} or better that acted after the flop in this spot`;
      wrap.appendChild(p);
    } else {
      const t = document.createElement("table"); t.className = "sp-grid";
      const head = document.createElement("tr");
      for (const text of ["made hand", ...SP_STREETS]) {
        const e = document.createElement("th"); e.textContent = text; head.appendChild(e);
      }
      t.appendChild(head);
      const cellFor = (s, r) => {
        const td = document.createElement("td");
        if (!r.n) { td.className = "zero"; td.textContent = "·"; return td; }
        td.className = "c";
        const pct = document.createElement("b"); pct.textContent = fmtPct(r.slowplay_pct);
        const n = document.createElement("small"); n.textContent = `${r.slowplay} of ${r.n}`;
        const mix = document.createElement("span"); mix.className = "sp-mix";
        SP_GROUPS.forEach(([, keys], i) => {
          const k = keys.reduce((sum, key) => sum + r.cells[key].n, 0);
          if (!k) return;
          const seg = document.createElement("i"); seg.style.flex = `${k} 1 0`; seg.style.background = SP_MIX[i];
          mix.appendChild(seg);
        });
        td.append(pct, n, mix);
        td.style.background = `color-mix(in srgb, var(--accent) ${Math.round((r.slowplay_pct || 0) * 0.45)}%, transparent)`;
        const filter = [d.filter, r.filter].filter(Boolean).join(",");
        const tip = d.categories.filter(c => r.cells[c.key].n)
          .map(c => [labels[c.key], `${r.cells[c.key].n} · ${fmtPct(r.cells[c.key].pct)}`]);
        if (r.all_in) tip.push(["all in already", String(r.all_in)]);
        tip.push(["click", "list the hands"]);
        const title = `${spLeaf(r.leaf)} on the ${s}`;
        td.addEventListener("pointermove", (ev) => showLineTip(ev, title, tip));
        td.addEventListener("pointerleave", hideTip);
        td.addEventListener("focus", (ev) => showLineTip(ev, title, tip));
        td.addEventListener("blur", hideTip);
        td.tabIndex = 0; td.setAttribute("role", "button");
        const ids = Object.values(r.cells).flatMap(c => c.hand_ids);
        pickable(td, `${title} · ${filter}`, ids);
        td.addEventListener("click", hideTip);
        return td;
      };
      for (const leaf of [...leaves, "total"]) {
        const tr = document.createElement("tr");
        if (leaf === "total") tr.className = "total";
        const name = document.createElement("td"); name.textContent = spLeaf(leaf);
        tr.appendChild(name);
