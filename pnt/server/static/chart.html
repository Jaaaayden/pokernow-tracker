        for (const s of SP_STREETS) {
          const st = d.streets[s];
          tr.appendChild(cellFor(s, leaf === "total" ? st.total : st.rows.find(r => r.leaf === leaf)));
        }
        t.appendChild(tr);
      }
      const box = document.createElement("div"); box.className = "sp-wrap sp-gridbox"; box.appendChild(t);
      wrap.appendChild(box);
    }

    // The per-action table, one street at a time, under the grid.
    const det = document.createElement("details"); det.className = "sp-detail"; det.open = spDetailOpen;
    const sum = document.createElement("summary"); sum.textContent = "By action, one street";
    const body = document.createElement("div");
    det.append(sum, body);
    det.addEventListener("toggle", () => { spDetailOpen = det.open; });
    const drawDetail = () => renderSpDetail(body, d.streets[state.street], d.filter, labels, () => {
      writeUrl(); drawDetail();
    });
    drawDetail();
    wrap.appendChild(det);

    renderSpMadeOn(wrap, d);

    // What the grid leaves out, said rather than dropped silently.
    const foot = document.createElement("p"); foot.className = "sp-foot";
    const never = d.streets.flop.rows.map(r => r.leaf).filter(leaf => !leaves.includes(leaf)).map(spLeaf);
    if (never.length) foot.append(`Never shown acting with: ${never.join(", ")}. `);
    foot.append("Slowplayed is a check or a call: a check-raise is a trap too, but puts money in, so it is counted as betting it.");
    wrap.appendChild(foot);
  }

  // One street's table: a row per made hand, a column per thing they did. Its
  // cells partition the row and each lists its hands.
  function renderSpDetail(box, d, spot, labels, redraw) {
    box.replaceChildren();
    const seg = document.createElement("span"); seg.className = "seg"; seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "Street");
    for (const s of SP_STREETS) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = s;
      b.setAttribute("aria-pressed", s === d.street);
      b.addEventListener("click", () => { state.street = s; $("street").value = s; redraw(); });
      seg.appendChild(b);
    }
    box.appendChild(seg);
    const rows = d.rows.filter(r => r.n > 0);
    if (!rows.length) {
      const p = document.createElement("p"); p.className = "muted";
      p.textContent = `no shown ${spLeaf(d.floor)} or better that acted on the ${d.street} in this spot`;
      box.appendChild(p);
    } else {
      const groups = SP_GROUPS.map(([name, keys]) =>
        [name, keys.filter(k => !SP_OPTIONAL.has(k) || d.total.cells[k].n > 0)]).filter(([, keys]) => keys.length);
      const t = document.createElement("table");
      const th = (text, cls, span) => {
        const e = document.createElement("th"); e.textContent = text;
        if (cls) e.className = cls; if (span) e.colSpan = span; return e;
      };
      const top = document.createElement("tr");
      top.append(th(""), th(""));
      for (const [name, keys] of groups) top.appendChild(th(name, "grp", keys.length));
      top.appendChild(th(""));
      const head = document.createElement("tr");
      head.append(th(`made on the ${d.street}`), th("n"));
      for (const [, keys] of groups) for (const k of keys) head.appendChild(th(labels[k]));
      head.appendChild(th("slowplay %"));
      t.append(top, head);

      const cellFor = (r, k) => {
        const c = r.cells[k];
        const slow = d.categories.find(x => x.key === k)?.slowplay;
        const td = document.createElement("td");
        td.textContent = c.n || "·";
        if (!c.n) { td.className = "zero"; return td; }
        const sm = document.createElement("small"); sm.textContent = fmtPct(c.pct); td.appendChild(sm);
        td.className = "c" + (slow ? " slow" : "");
        // Shaded by share of the row, slowplays in the accent, the rest in grey.
        const tint = slow ? "var(--accent)" : "var(--muted)";
        td.style.background = `color-mix(in srgb, ${tint} ${Math.round(c.pct * 0.45)}%, transparent)`;
        const filter = [spot, c.filter].filter(Boolean).join(",");
        td.title = `${c.n} of ${r.n} · ${filter}`;
        td.tabIndex = 0; td.setAttribute("role", "button");
        pickable(td, `${d.street} ${spLeaf(r.leaf)} · ${labels[k]} · ${filter}`, c.hand_ids);
        return td;
      };
      for (const r of [...rows, d.total]) {
        const tr = document.createElement("tr");
        if (r === d.total) tr.className = "total";
        const name = document.createElement("td"); name.textContent = spLeaf(r.leaf);
        const n = document.createElement("td"); n.textContent = r.n;
        tr.append(name, n);
        for (const [, keys] of groups) for (const k of keys) tr.appendChild(cellFor(r, k));
        const pct = document.createElement("td"); pct.textContent = fmtPct(r.slowplay_pct);
        tr.appendChild(pct);
        t.appendChild(tr);
      }
      const wrap = document.createElement("div"); wrap.className = "sp-wrap"; wrap.appendChild(t);
      box.appendChild(wrap);
    }
    if (d.total.all_in) {
      const foot = document.createElement("p"); foot.className = "sp-foot";
      foot.append(`${d.total.all_in} more were all in before the ${d.street}, with nothing to decide `);
      const b = document.createElement("button"); b.type = "button"; b.textContent = "list ›";
      b.addEventListener("click", () => openHands(`${d.street} · all in already · ${d.total.all_in_filter}`, d.total.all_in_ids));
      foot.append(b, ".");
      box.appendChild(foot);
    }
  }

  // The whole line of each strong hand, by the street it was first that strong:
  // the flopped boat that went x/b/b beside the turned one that went b/b/b.
  function renderSpMadeOn(wrap, d) {
    const m = d.made_on;
    const shown = m.rows.filter(r => r.n > 0);
    const head = document.createElement("div"); head.className = "sp-ctl sp-h";
    const h = document.createElement("h3"); h.textContent = "Line by when it was made";
    head.appendChild(h);
    if (!shown.length) {
      wrap.appendChild(head);
      return;
    }
    if (spMadeLeaf !== "total" && !shown.some(r => r.leaf === spMadeLeaf)) spMadeLeaf = "total";
    const fl = document.createElement("label"); fl.textContent = "ended as ";
    const sel = document.createElement("select"); sel.setAttribute("aria-label", "Made hand it ended as");
    for (const r of [m.total, ...shown]) {
      const o = document.createElement("option"); o.value = r.leaf;
      o.textContent = `${r.leaf === "total" ? `any ${spLeaf(d.floor)}+` : spLeaf(r.leaf)} (${r.n})`;
      sel.appendChild(o);
    }
    sel.value = spMadeLeaf;
    fl.appendChild(sel);
    head.appendChild(fl);
    wrap.appendChild(head);

    const grid = document.createElement("div"); grid.className = "sp-made";
    const draw = () => {
      grid.replaceChildren();
      const row = spMadeLeaf === "total" ? m.total : m.rows.find(r => r.leaf === spMadeLeaf);
      const name = spMadeLeaf === "total" ? `${spLeaf(d.floor)}+` : spLeaf(spMadeLeaf);
      for (const s of SP_STREETS) {
        const g = row.streets[s];
        const col = document.createElement("div"); col.className = "grp";
        const t = document.createElement("div"); t.className = "gh";
        t.append(`made on the ${s} `);
        const sm = document.createElement("small"); sm.textContent = `${g.n} · ${fmtPct(g.pct)}`; t.appendChild(sm);
        col.appendChild(t);
        if (!g.n) {
          const p = document.createElement("div"); p.className = "muted"; p.textContent = "none";
          col.appendChild(p);
        }
        const top = g.lines.slice(0, SP_TOP_LINES);
        const rest = g.lines.slice(SP_TOP_LINES);
        const lineRow = (code, words, n, pct, ids) => {
          const r = document.createElement("div"); r.className = "ln";
          r.tabIndex = 0; r.setAttribute("role", "button");
          const c = document.createElement("span"); c.className = "code"; c.textContent = code;
          if (words) c.title = words; else c.classList.add("more");
          const bar = document.createElement("span"); bar.className = "bar";
          const fill = document.createElement("i"); fill.style.width = `${pct || 0}%`; bar.appendChild(fill);
          const v = document.createElement("span"); v.className = "num"; v.textContent = `${n} · ${fmtPct(pct)}`;
          r.append(c, bar, v);
          pickable(r, `${name} made on the ${s} · ${code}`, ids);
          return r;
        };
        for (const l of top) {
          const words = l.line.split("/").map(seg => lineWords(seg, "own").textContent).join(" / ");
          col.appendChild(lineRow(l.line, words, l.n, l.pct, l.hand_ids));
        }
        if (rest.length) {
          const n = rest.reduce((sum, l) => sum + l.n, 0);
          col.appendChild(lineRow(`${rest.length} other lines`, null, n, Math.round(1000 * n / g.n) / 10,
            rest.flatMap(l => l.hand_ids)));
        }
        grid.appendChild(col);
      }
      if (row.all_in) {
        const p = document.createElement("p"); p.className = "sp-foot";
        p.append(`${row.all_in} more were already all in when they made it `);
        const b = document.createElement("button"); b.type = "button"; b.textContent = "list ›";
        b.addEventListener("click", () => openHands(`${name} · all in before it was made`, row.all_in_ids));
        p.append(b, ".");
        grid.appendChild(p);
      }
    };
    sel.addEventListener("change", () => { spMadeLeaf = sel.value; draw(); });
    draw();
    wrap.appendChild(grid);
  }

  // ---- results by pot type ----------------------------------------------------
  // Three tables over the same hands -- pot type (split by who raised last), seat,
  // position after the flop -- each adding up to the spot's total. The bar is net
  // bb from zero, on one scale across all three, so a row's bar is comparable with
  // any other's. A row is its filter: clicking it adds the terms to the spot and
  // lists the hands. In-position rows have no filter term yet, so they list their
  // hands by id and leave the spot alone. See "Results by pot type" in SPEC.md.
  const RESULTS_NOTE = [
    "**bb:** each complete hand's net in its own big blinds. A log that stops early counts its hands, not its bb.",
    "**Walk:** the big blind folded to. **Limped:** every other unraised pot.",
    "Click a row to add it to the spot and list its hands.",
  ];
  function renderResults(d) {
    const wrap = $("results");
    wrap.replaceChildren();
    const graph = renderWinnings(d.winnings);
    if (graph) wrap.appendChild(graph);
    const tot = d.total;
    setTileKeys("hands in this spot ›", "net bb, complete hands", "bb/100");
    $("t-hands").textContent = d.hands;
    $("t-known").textContent = tot.net_bb == null ? "–" : fmtBb(tot.net_bb).replace(" bb", "");
    $("t-cov").textContent = tot.bb_per_100 == null ? "–" : tot.bb_per_100.toFixed(1);
    signTone($("t-known"), tot.net_bb, tot.net_bb);
    signTone($("t-cov"), tot.bb_per_100);
    tileTip("t-cov", tot.bb_per_100 == null || tot.bb_per_100_ci == null ? ""
      : `± ${tot.bb_per_100_ci.toFixed(1)} bb/100 (95%: ${(tot.bb_per_100 - tot.bb_per_100_ci).toFixed(1)} to `
        + `${(tot.bb_per_100 + tot.bb_per_100_ci).toFixed(1)}) over ${tot.bb_hands} complete hands`);
    const flat = (t) => t.rows.flatMap(r => [r, ...(r.roles || [])]);
    const potRows = flat(d.tables.find(t => t.key === "pot"));
    const worst = potRows.find(r => r.worst);
    const parent = worst && potRows.find(r => r.roles?.includes(worst));
    $("t-raise").textContent = worst ? (parent ? `${parent.label} · ${worst.label}` : worst.label) : "–";
    setRaiseKey("worst pot, by bb/100", worst ? `${worst.bb_per_100.toFixed(1)} bb/100 · of rows with ${d.min_hands}+ hands`
      : `no losing row of ${d.min_hands}+ hands`);
    setNote(RESULTS_NOTE);
    $("tabletoggle").classList.add("hidden"); // this view is a table already
    $("table").classList.add("hidden");

    const max = Math.max(1, ...d.tables.flatMap(flat).map(r => Math.abs(r.net_bb ?? 0)));
    const num = (v) => v == null ? "–" : v.toFixed(1);
    const COLS = ["", "", "hands", "net bb", "bb/100", "VPIP", "saw flop", "WTSD", "W$SD"];
    const TIPS = {
      VPIP: "share of these hands they put chips in voluntarily",
      "saw flop": "share of these hands they saw a flop",
      WTSD: "went to showdown, of the hands that saw a flop",
      "W$SD": "won at showdown, of the showdowns",
    };

    for (const table of d.tables) {
      const block = document.createElement("div");
      const h = document.createElement("h3"); h.textContent = table.title;
      const t = document.createElement("table");
      const head = document.createElement("tr");
      COLS.forEach((c) => {
        const th = document.createElement("th"); th.textContent = c;
        if (TIPS[c]) th.title = TIPS[c];
        head.appendChild(th);
      });
      t.appendChild(head);
      const add = (r, role) => {
        const tr = document.createElement("tr");
        const name = document.createElement("td");
        if (role) name.className = "role";
        name.textContent = r.label;
        if (r.worst) {
          const tag = document.createElement("span"); tag.className = "worst"; tag.textContent = "worst";
          tag.title = `the lowest bb/100 in this table among rows of ${d.min_hands}+ hands`;
          name.appendChild(tag);
        }
        const bar = document.createElement("td"); bar.className = "diverge";
        const zero = document.createElement("div"); zero.className = "zero";
        if (r.net_bb) {
          const i = document.createElement("i");
          i.className = r.net_bb > 0 ? "up" : "down";
          i.style.width = (Math.abs(r.net_bb) / max * 50) + "%";
          zero.appendChild(i);
        }
        bar.appendChild(zero);
        tr.append(name, bar);
        for (const v of [r.hands, r.net_bb == null ? "–" : fmtBb(r.net_bb).replace(" bb", ""), num(r.bb_per_100),
                         fmtPct(r.vpip_pct), fmtPct(r.saw_flop_pct), fmtPct(r.wtsd), fmtPct(r.wsd)]) {
          const td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
        }
        signTone(tr.cells[3], r.net_bb); signTone(tr.cells[4], r.bb_per_100);
        const where = r.filter == null ? "no filter term says this yet, so the hands are listed as they are"
          : `adds ${r.filter} to the spot`;
        tr.title = `${r.label}: ${r.hands} hands, ${r.bb_hands} with a known result`
          + (r.net_bb == null ? "" : `, ${fmtBb(r.net_bb)}`) + ` · ${where}`;
        if (!r.hands) tr.classList.add("empty");
        else {
          tr.classList.add("pick");
          tr.tabIndex = 0;
          tr.setAttribute("role", "button");
          tr.setAttribute("aria-label", `${r.label} · ${r.hands} hands — list them`);
          const title = role ? `${role} · ${r.label}` : r.label;
          const open = () => {
            if (r.filter == null) { openHands(`${table.title} · ${title}`, r.hand_ids); return; }
            const cur = terms();
            for (const term of r.filter.split(",")) if (!cur.includes(term)) cur.push(term);
            $("filter").value = cur.join(",");
            apply();
            openHands(title, null);
          };
          tr.addEventListener("click", open);
          tr.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); open(); } });
        }
        t.appendChild(tr);
      };
      for (const r of table.rows) {
        add(r, null);
        for (const role of r.roles || []) add(role, r.label);
      }
      block.append(h, t);
      if (table.key === "ip") {
        const p = document.createElement("p"); p.className = "why";
        p.textContent = "In or out of position is decided on the flop, so a hand that never saw one is its own row.";
        block.appendChild(p);
      }
      wrap.appendChild(block);
    }
    const funnelBox = renderFunnel(d.funnel);
    if (funnelBox) wrap.appendChild(funnelBox);
  }

  // ---- red line and blue line -------------------------------------------------
  // Cumulative net bb in hand order, split on whether the player went to
  // showdown: blue the showdowns, red everything else, grey their sum, and a
  // dashed grey for the total with each all-in showdown paid by equity. Under it,
  // one bar per session. Ported from allin.html's renderGraph: hand rolled, since
  // four lines and a zero axis do not need a library. Clicking red or blue in the
  // legend adds its term to the spot; a point opens its hand; a bar its session.
  // See "Red and blue lines" in SPEC.md.
  function renderWinnings(w) {
    if (!w) return null;
    const box = document.createElement("div");
    box.id = "winnings";
    const h = document.createElement("h3");
    h.textContent = "Red line, blue line";
    h.title = "red: net bb on hands that never reached showdown · blue: on hands that did";
    box.appendChild(h);
    const cap = document.createElement("p"); cap.className = "wcap";
    if (w.error) {
      cap.textContent = `no graph: ${w.error}`;
      box.appendChild(cap);
      return box;
    }
    const t = w.totals, pts = w.points;
    const signed = (v) => v == null ? "–" : fmtBb(v);
    const coverage = `${t.bb_hands} of ${t.hands} hands with a known result`;
    const adj = t.adjusted && t.adjusted.allin_hands ? t.adjusted : null;

    const legend = document.createElement("div"); legend.className = "wlegend";
    const chip = (cls, text, tip, filter, title) => {
      const el = document.createElement(filter ? "button" : "span");
      el.className = cls;
      const i = document.createElement("i");
      el.append(i, text);
      el.title = tip;
      if (filter) el.addEventListener("click", () => drillLine(filter, title));
      legend.appendChild(el);
    };
    chip("total", `total ${signed(t.net_bb)}`, `${coverage}; ${t.bb_per_100 == null ? "–" : t.bb_per_100.toFixed(1)} bb/100`);
    chip("red", `no showdown ${signed(t.red.net_bb)} · ${t.red.bb_hands}`,
      `${t.red.bb_hands} of ${t.red.hands} hands with a known result · adds ${t.red.filter} to the spot`,
      t.red.filter, "no showdown");
    chip("blue", `showdown ${signed(t.blue.net_bb)} · ${t.blue.bb_hands}`,
      `${t.blue.bb_hands} of ${t.blue.hands} hands with a known result · adds ${t.blue.filter} to the spot`,
      t.blue.filter, "went to showdown");
    if (adj) {
      chip("adjusted", `all-in adjusted ${signed(adj.net_bb)}`,
        `the total with ${adj.allin_hands} all-in showdown${adj.allin_hands === 1 ? "" : "s"} paid by equity`
        + (adj.skipped ? `; ${adj.skipped} skipped, a live hand was mucked` : ""));
    }
    box.appendChild(legend);
    const rest = () => {
      cap.textContent = `${coverage}, oldest first`
        + (adj && adj.skipped ? ` · ${adj.skipped} all-in showdown${adj.skipped === 1 ? "" : "s"} not adjusted: a live hand was mucked` : "");
    };
    if (!pts.length) {
      cap.textContent = `no hand in this spot has a known result (${coverage})`;
      box.appendChild(cap);
      return box;
    }

    const NS = "http://www.w3.org/2000/svg";
    const mkIn = (svg) => (tag, attrs, text) => {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      if (text != null) e.textContent = text;
      svg.appendChild(e);
      return e;
    };
    const W = 800, H = 240, L = 58, R = 14, T = 12, B = 26;
    const n = pts.length;
    const series = { total: [0], red: [0], blue: [0] };
    if (adj) series.adjusted = [0];
    for (const p of pts) for (const k of Object.keys(series)) series[k].push(p[k]);
    // A loop, not Math.min(...): a big player's four lines outrun the argument limit.
    let lo = 0, hi = 0;
    for (const arr of Object.values(series)) for (const v of arr) { if (v < lo) lo = v; if (v > hi) hi = v; }
    const x = (i) => L + i * (W - L - R) / n;
    const y = (v) => hi === lo ? T + (H - T - B) / 2 : T + (hi - v) * (H - T - B) / (hi - lo);
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `cumulative net bb over ${n} hands: total ${signed(t.net_bb)},`
      + ` no showdown ${signed(t.red.net_bb)}, showdown ${signed(t.blue.net_bb)}`);
    const mk = mkIn(svg);
    mk("line", { class: "wzero", x1: L, x2: W - R, y1: y(0), y2: y(0) });
    // The top, the bottom, and zero where it has room between them.
    const labels = hi === lo ? [0] : [hi, lo];
    if (hi !== lo && Math.min(y(0) - y(hi), y(lo) - y(0)) >= 14) labels.push(0);
    for (const v of labels) mk("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, v === 0 ? "0" : signed(v));
    mk("text", { x: W - R, y: H - 6, "text-anchor": "end" }, `${n} hand${n === 1 ? "" : "s"}, oldest first`);
    const line = (arr) => arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    for (const k of ["adjusted", "red", "blue", "total"]) {
      if (series[k]) mk("polyline", { class: k, points: line(series[k]) });
    }
    const guide = mk("line", { class: "wguide hidden", x1: 0, x2: 0, y1: T, y2: H - B });
    const dots = ["red", "blue", "total"].map(k => [k, mk("circle", { class: `wdot ${k} hidden`, r: 3.2 })]);
    const hit = mk("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" });
    const point = (i) => {
      const p = pts[i - 1];
      guide.classList.remove("hidden");
      guide.setAttribute("x1", x(i)); guide.setAttribute("x2", x(i));
      for (const [k, dot] of dots) {
        dot.classList.remove("hidden");
        dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(series[k][i]));
      }
      const when = p.ts ? new Date(p.ts) : null;
      cap.textContent = `#${p.hand_number}${when && !isNaN(when) ? " · " + SESSION_DATE.format(when) : ""}`
        + ` · this hand ${fmtBb(p.net_bb)} ${p.sd ? "at showdown" : "without showdown"}`
        + ` · total ${fmtBb(p.total)} = red ${fmtBb(p.red)} + blue ${fmtBb(p.blue)}`
        + (adj ? ` · adjusted ${fmtBb(p.adjusted)}${p.allin ? " (all-in)" : ""}` : "");
    };
    // Through the screen transform, not the box: past max-height the drawing
    // shrinks and centres inside a box still the full width.
    const locate = (ev) => {
      const px = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse()).x;
      return Math.max(1, Math.min(n, Math.round((px - L) * n / (W - L - R))));
    };
    hit.addEventListener("mousemove", (ev) => point(locate(ev)));
    hit.addEventListener("mouseleave", () => {
      guide.classList.add("hidden");
      for (const [, dot] of dots) dot.classList.add("hidden");
      rest();
    });
    hit.addEventListener("click", (ev) => {
      const i = locate(ev);
      point(i);
      openHands(`hand #${pts[i - 1].hand_number}`, [pts[i - 1].hand_id]);
    });
    box.appendChild(svg);

    // One bar per session, net bb from zero, oldest on the left. No filter term
    // names a game, so a bar lists its hands by id and leaves the spot alone.
    const sessions = w.sessions || [];
    if (sessions.length > 1) {
      const SH = 90, ST = 6, SB = 6;
      const bars = document.createElementNS(NS, "svg");
      bars.setAttribute("class", "sessions");
      bars.setAttribute("viewBox", `0 0 ${W} ${SH}`);
      bars.setAttribute("role", "group");
      bars.setAttribute("aria-label", `net bb in each of ${sessions.length} sessions`);
      const bk = mkIn(bars);
      const vals = sessions.map(s => s.net_bb ?? 0);
      const blo = Math.min(0, ...vals), bhi = Math.max(0, ...vals);
      const by = (v) => bhi === blo ? ST + (SH - ST - SB) / 2 : ST + (bhi - v) * (SH - ST - SB) / (bhi - blo);
      const slot = (W - L - R) / sessions.length;
      const bw = Math.max(1, Math.min(28, slot * 0.7));
      bk("text", { x: L - 6, y: by(0) + 4, "text-anchor": "end" }, "sessions");
      sessions.forEach((s, i) => {
        const v = s.net_bb ?? 0;
        const top = Math.min(by(v), by(0)), ht = Math.max(1, Math.abs(by(v) - by(0)));
        const r = bk("rect", { class: `bar ${v >= 0 ? "up" : "down"}`, x: (L + i * slot + (slot - bw) / 2).toFixed(1),
          y: top.toFixed(1), width: bw.toFixed(1), height: ht.toFixed(1), tabindex: 0, role: "button" });
        const d = new Date(s.first_ts);
        const when = isNaN(d) ? s.game_id : SESSION_DATE.format(d);
        const say = `${when} · ${signed(s.net_bb)} over ${s.bb_hands} of ${s.hands} hands`
          + ` (red ${signed(s.red)}, blue ${signed(s.blue)}) · click to list them`;
        r.setAttribute("aria-label", say);
        const tip = document.createElementNS(NS, "title"); tip.textContent = say; r.appendChild(tip);
        const open = () => openHands(`session ${when}`, s.hand_ids);
        r.addEventListener("mouseenter", () => { cap.textContent = say; });
        r.addEventListener("mouseleave", rest);
        r.addEventListener("click", open);
        r.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); open(); } });
      });
      bk("line", { class: "wzero", x1: L, x2: W - R, y1: by(0), y2: by(0) });
      box.appendChild(bars);
    }
    rest();
    box.appendChild(cap);
    return box;
  }

  // ---- the give-up funnel -----------------------------------------------------
  // The last tables of Results, over the same spot. The steps narrow from the
  // flops seen to the showdowns won, each with its share of the flops and of the
  // step above; WWSF and its no-showdown part sit under them. The fold table says
  // on which street they let go after the flop, as the previous street's
  // aggressor or not, each over the hands that reached that street the same way.
  // A row is its filter: clicking adds the terms to the spot and lists the hands.
  // See "Give-up funnel" in SPEC.md.
  function renderFunnel(f) {
    if (!f) return null;
    const box = document.createElement("div");
    box.id = "funnel";
    const note = (text) => { const p = document.createElement("p"); p.className = "why"; p.textContent = text; return p; };
    if (f.error) {
      const h = document.createElement("h3"); h.textContent = "Give-up funnel";
      box.append(h, note(`no funnel: ${f.error}`));
      return box;
    }
    const bar = (pct) => {
      const td = document.createElement("td"); td.className = "share";
      const fill = document.createElement("div"); fill.className = "fill";
      if (pct) { const i = document.createElement("i"); i.style.width = Math.min(100, pct) + "%"; fill.appendChild(i); }
      td.appendChild(fill);
      return td;
    };
    const table = (title, cols, tips) => {
      const block = document.createElement("div");
      const h = document.createElement("h3"); h.textContent = title;
      const t = document.createElement("table");
      const head = document.createElement("tr");
      for (const c of cols) {
        const th = document.createElement("th"); th.textContent = c;
        if (tips[c]) th.title = tips[c];
        head.appendChild(th);
      }
      t.appendChild(head);
      block.append(h, t);
      box.appendChild(block);
      return { block, t };
    };
    // One row: its label, a bar, its figures, and a click that drills its filter.
    const row = (t, r, cells, pct, say, sub) => {
      const tr = document.createElement("tr");
      if (sub) tr.className = "sub";
      const name = document.createElement("td");
      if (sub) name.className = "role";
      name.textContent = r.label;
      tr.append(name, bar(pct));
      for (const v of cells) { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); }
      tr.title = `${say} · adds ${r.filter} to the spot`;
      if (!r.n) tr.classList.add("empty");
      else {
        tr.classList.add("pick");
        tr.tabIndex = 0;
        tr.setAttribute("role", "button");
        tr.setAttribute("aria-label", `${say} — list them`);
        const open = () => drillLine(r.filter, `funnel · ${sub ? sub + " · " : ""}${r.label}`);
        tr.addEventListener("click", open);
        tr.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); open(); } });
      }
      t.appendChild(tr);
    };

    const steps = table("Give-up funnel: of the flops they saw", ["", "", "hands", "of flops", "of the row above"], {
      "of flops": "share of the flops they saw in this spot",
      "of the row above": "share of the step before: how many of those went on",
    });
    for (const s of f.steps) {
      row(steps.t, s, [s.n, fmtPct(s.pct), fmtPct(s.step_pct)], s.pct,
        `${s.label}: ${s.n} of ${f.flops} flops seen`);
    }
    for (const w of f.won) {
      row(steps.t, w, [w.n, fmtPct(w.pct), ""], w.pct, `${w.label}: ${w.n} of ${f.flops} flops seen`, w.key === "wwsf_nsd" ? "won the pot" : null);
    }
    const cut = f.flops - f.complete;
    steps.block.appendChild(note(`${f.complete} of ${f.flops} flops are from logs that ran to the end`
      + (cut ? `; ${cut} stop early.` : ".") + " Won the pot is WWSF (a 7-2 bounty doesn't count)."));

    const folds = table("Where they folded after the flop", ["", "", "folds", "of hands", "fold %", "of all folds"], {
      "of hands": "the hands that reached that street the same way: every fold row is a share of these",
      "fold %": "how often reaching the street that way ended in a fold there",
      "of all folds": `share of their ${f.total_folds} folds after the flop`,
    });
    for (const r of f.folds) {
      row(folds.t, r, [r.n, r.of, fmtPct(r.pct), fmtPct(r.share)], r.pct,
        `${r.label}: ${r.n} folds of ${r.of} hands that reached it`);
      for (const x of r.roles) {
        row(folds.t, x, [x.n, x.of, fmtPct(x.pct), fmtPct(x.share)], x.pct,
          `${r.label}, ${x.label}: ${x.n} folds of ${x.of}`, r.label);
      }
    }
    folds.block.appendChild(note("Not the aggressor: a caller of the last bet, or anyone on a checked-through street."
      + " Flop folds split by the preflop aggressor."));
    return box;
  }

  // ---- tilt and session dynamics ---------------------------------------------
  // Two tables over the spot's hands: all of them against the hands just after a
  // big loss and every other hand, then by hours since their first hand of the
  // night. Each row is its filter: clicking one adds the terms to the spot and
  // lists the hands. See "Session dynamics" in SPEC.md.
  const TILT_GAP = 5; // points of VPIP or PFR from all hands that get marked
  const TILT_BB_BAND = 5; // bb/100 from all hands that colours a row good or bad, not eh
  function renderTilt(d) {
    const wrap = $("tilt");
    wrap.replaceChildren();
    const [loss, hour] = d.tables;
    const base = loss.rows.find(r => r.key === "all");
    const post = loss.rows.find(r => r.key === "post_loss");
    setTileKeys("hands in this spot ›", `in the ${d.window} hands after a loss`, "VPIP after a loss, points");
    $("t-hands").textContent = d.hands;
    $("t-known").textContent = post.hands;
    $("t-cov").textContent = d.vpip_gap == null ? "–" : `${d.vpip_gap > 0 ? "+" : ""}${d.vpip_gap.toFixed(1)}`;
    $("t-raise").textContent = d.losses;
    setRaiseKey(`losses of ${d.big_loss_bb}+ bb`, `${d.sessions} session${d.sessions === 1 ? "" : "s"}`);
    setNote(`**Big loss:** one hand that lost ${d.big_loss_bb}+ bb. The window is their next ${d.window} hands that session; a new loss restarts it.`,
      `**Hour bands** need a timestamp: ${d.clock.known} of ${d.clock.n} hands have one.`,
      "Every figure shows its n. Click a row to add it to the spot and list its hands.");
    $("tabletoggle").classList.add("hidden"); // this view is a table already
    $("table").classList.add("hidden");

    const COLS = [["", ""], ["hands", ""], ["VPIP", "voluntarily put chips in, of their preflop decisions"],
      ["PFR", "raised preflop, of their preflop decisions"],
      ["AF", "aggression after the flop: bets and raises over bets, raises, calls and folds"],
      ["bb/100", `over complete hands with a known big blind, ± its 95% interval · against all hands: `
        + `blue more than ${TILT_BB_BAND} above, red more than ${TILT_BB_BAND} below, amber within`]];
    const pct = (v, n, key) => {
      const td = document.createElement("td");
      td.append(v == null ? "–" : v.toFixed(1) + "%");
      const sm = document.createElement("small"); sm.textContent = `/${n}`; td.appendChild(sm);
      td.title = `${n} in the denominator`;
      if (key && v != null && base[key] != null && Math.abs(v - base[key]) >= TILT_GAP) {
        const gap = v - base[key];
        td.classList.add("moved");
        td.title += ` · ${gap > 0 ? "+" : ""}${gap.toFixed(1)} points from all hands`;
      }
      return td;
    };
    for (const table of [loss, hour]) {
      const block = document.createElement("div");
      const h = document.createElement("h3"); h.textContent = table.title;
      const t = document.createElement("table");
      const head = document.createElement("tr");
      for (const [c, tip] of COLS) {
        const th = document.createElement("th"); th.textContent = c;
        if (tip) th.title = tip;
        head.appendChild(th);
      }
      t.appendChild(head);
      for (const r of table.rows) {
        const tr = document.createElement("tr");
        const name = document.createElement("td"); name.textContent = r.label;
        const n = document.createElement("td"); n.textContent = r.hands;
        const bb = document.createElement("td");
        bb.append(r.bb_per_100 == null ? "–" : r.bb_per_100.toFixed(1));
        const sm = document.createElement("small");
        sm.textContent = (r.bb_per_100_ci == null ? "" : `±${r.bb_per_100_ci.toFixed(0)} `) + `/${r.bb_hands}`;
        bb.appendChild(sm);
        const isBase = r.key === "all";
        const tone = isBase ? "" : numTone(r.bb_per_100, base.bb_per_100, TILT_BB_BAND);
        if (tone) {
          const gap = r.bb_per_100 - base.bb_per_100;
          bb.classList.add(`num-${tone}`);
          bb.title = `${gap > 0 ? "+" : ""}${gap.toFixed(1)} bb/100 from all hands`;
        }
        tr.append(name, n, pct(r.vpip, r.vpip_n, isBase ? null : "vpip"), pct(r.pfr, r.pfr_n, isBase ? null : "pfr"),
                  pct(r.af, r.af_n, null), bb);
        tr.title = `${r.label}: ${r.hands} hands · ` + (r.filter ? `adds ${r.filter} to the spot` : "the whole spot");
        if (!r.hands) tr.classList.add("empty");
        else {
          tr.classList.add("pick");
          tr.tabIndex = 0;
          tr.setAttribute("role", "button");
          tr.setAttribute("aria-label", `${r.label} · ${r.hands} hands — list them`);
          const open = () => r.filter ? drillLine(r.filter, r.label) : openHands(r.label, null);
          tr.addEventListener("click", open);
          tr.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); open(); } });
        }
        t.appendChild(tr);
      }
      block.append(h, t);
      if (table.key === "hour") {
        const p = document.createElement("p"); p.className = "why";
        p.textContent = "Hours since their own first hand of the session, so a player who sat down late starts at zero.";
        block.appendChild(p);
      }
      wrap.appendChild(block);
    }
  }

  // ---- timing tells --------------------------------------------------------------
  // How long each first decision on a street took, and what the hands were, by
  // tempo bucket: the pool first (every player, every hand), then this player's,
  // against the pool's cuts or against their own median, then their pace street
  // by street. A player's row is its filter: clicking adds the terms to the spot
  // and lists the hands. The pool's rows name nobody, so they carry their filter
  // in the hover instead. See "Timing tells" in SPEC.md.
  let timingRel = false; // this player's buckets cut from their own median
  const TEMPO_WORD = { pre: "pre-selected", snap: "snap", normal: "normal", tank: "tank", timeout: "timed out" };

  async function loadTiming(quiet, live) {
    const q = new URLSearchParams();
    if (state.filter) q.set("filter", state.filter);
    const key = state.filter || "";
    // The pool is every hand in the database and takes a second or two: kept per
    // spot, and asked again on a quiet reload, when the HUD says there are new hands.
    const held = !quiet && state.timingPool?.key === key ? state.timingPool.data : null;
    const poolReq = held ? Promise.resolve(held)
      : getJson("/timing?" + q).catch(e => ({ error: String(e.message || e) }));
    const data = await getJson(`/players/${encodeURIComponent(state.player)}/timing?` + q);
    const pool = await poolReq;
    if (live() && !pool.error) state.timingPool = { key, data: pool };
    data.pool = pool;
    return data;
  }

  function tempoRange(b, bet, cuts, rel) {
    const s = (ms) => `${+(ms / 1000).toFixed(2)} s`;
    if (b === "pre") return `≤ ${s(cuts.pre_ms)} after the last action`;
    const [lo, hi] = rel || (bet ? [cuts.aggressive_snap_ms, cuts.aggressive_tank_ms]
      : [cuts.passive_snap_ms, cuts.passive_tank_ms]);
    if (b === "snap") return `${bet || rel ? "<" : "≤"} ${s(lo)}`;
    if (b === "tank") return `> ${s(hi)}`;
    return `${s(lo)}–${s(hi)}`;
  }

  function renderTiming(d) {
    const wrap = $("timing");
    wrap.replaceChildren();
    const cov = d.timed;
    const river = d.streets.find(s => s.street === "river");
    setTileKeys("hands in this spot ›", "first decisions timed", "coverage");
    $("t-hands").textContent = d.hands;
    $("t-known").textContent = cov.timed;
    $("t-cov").textContent = cov.decisions ? fmtPct(100 * cov.timed / cov.decisions) : "–";
    $("t-raise").textContent = river.median_ms == null ? "–" : `${(river.median_ms / 1000).toFixed(1)} s`;
    setRaiseKey("median river decision", `${river.timed} timed`);
    setNote([].concat(d.note), "Click one of their rows to list its hands.");
    $("tabletoggle").classList.add("hidden"); // this view is a table already
    $("table").classList.add("hidden");
    const para = (cls, text) => { const p = document.createElement("p"); p.className = cls; p.textContent = text; return p; };
    if (cov.rebuild || d.pool?.timed?.rebuild) {
      wrap.appendChild(para("warn", "Some hands have no times: they were stored before this version. "
        + "Run `pnt rebuild` once to time every hand from the logs already stored."));
    }

    const td = (text, small, title) => {
      const c = document.createElement("td");
      c.append(text);
      if (small != null) { const sm = document.createElement("small"); sm.textContent = small; c.appendChild(sm); }
      if (title) c.title = title;
      return c;
    };
    const tierBar = (c) => {
      const cell = document.createElement("td"); cell.className = "tbar";
      const bar = document.createElement("span");
      for (const [t] of TIERS) {
        const v = c.counts[t];
        if (!v) continue;
        const i = document.createElement("i"); i.style.flex = `${v} 1 0`; i.style.background = tierColor(t);
        bar.appendChild(i);
      }
      cell.appendChild(bar);
      cell.title = TIERS.map(([t]) => `${t} ${c.counts[t]}`).join(" · ") + ` — of ${c.known} known`;
      return cell;
    };
    // `all` is the spot's value share over every bucket in the same column: a
    // bucket is coloured only when its interval clears it.
    const value = (c, all) => {
      const cell = td(fmtPct(c.value), ` ${c.known}/${c.n}`,
        c.value_ci ? `value: nutted or strong, of the ${c.known} known · 95% interval ${c.value_ci[0]}–${c.value_ci[1]}%`
          + (all == null ? "" : ` · ${fmtPct(all)} at every speed`) : "no cards known");
      const tone = numTone(c.value_ci, all);
      if (tone) cell.classList.add(`num-${tone}`);
      return cell;
    };
    // The value share of a spot's rows, every speed together; `pick` finds the cell.
    const allSpeeds = (rows, pick) => {
      let value = 0, known = 0;
      for (const r of rows) { const c = pick(r); value += c.counts.nutted + c.counts.strong; known += c.known; }
      return known ? 100 * value / known : null;
    };

    // One table: a header row per spot, a row per bucket.
    function spotTable(spots, { pool, rel }) {
      const t = document.createElement("table");
      const head = document.createElement("tr");
      const cols = [["", ""], ["time", "how long the first decision on the street took"], ["n", "decisions in the bucket"],
        ["what they had", "nutted, strong, marginal, draw, air: the known hands"], ["value", "nutted or strong, of the known hands · blue when its 95% interval is above the spot at every speed, red when below"],
        ["draw", ""], ["air", ""]];
      if (pool) cols.push(["others, shown", "everyone's hands shown at showdown, the logs' owners left out · coloured as value is"],
        ["owners, own cards", "the logs' owners, whose every card their own log shows · coloured as value is"]);
      for (const [c, tip] of cols) { const th = document.createElement("th"); th.textContent = c; if (tip) th.title = tip; head.appendChild(th); }
      t.appendChild(head);
      for (const sp of spots) {
        const bet = sp.key.endsWith("_bet");
        const h = document.createElement("tr"); h.className = "spot";
        const name = td(sp.label, ` ${sp.timed} timed of ${sp.n}`);
        name.colSpan = cols.length;
        h.appendChild(name);
        t.appendChild(h);
        const all = allSpeeds(sp.rows, r => r);
        const allOthers = pool ? allSpeeds(sp.rows, r => r.others) : null;
        const allOwn = pool ? allSpeeds(sp.rows, r => r.own) : null;
        for (const r of sp.rows) {
          const tr = document.createElement("tr");
          const word = TEMPO_WORD[r.bucket];
          tr.append(td(word), td(tempoRange(r.bucket, bet, d.cuts, rel ? rel[sp.street] : null)), td(String(r.n)),
            tierBar(r), value(r, all), td(fmtPct(r.draw)), td(fmtPct(r.air)));
          if (pool) tr.append(value(r.others, allOthers), value(r.own, allOwn));
          if (!r.n) tr.classList.add("empty");
          if (pool) tr.title = `${sp.label}, ${word}: ${r.filter} — add it to a player's spot to list their hands`;
          else if (r.n) {
            tr.classList.add("pick"); tr.tabIndex = 0; tr.setAttribute("role", "button");
            tr.title = `${sp.label}, ${word}: adds ${r.filter} to the spot`;
            const open = () => drillLine(r.filter, `${sp.label} · ${word}`);
            tr.addEventListener("click", open);
            tr.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); open(); } });
          }
          t.appendChild(tr);
        }
      }
      return t;
    }

    // The pool.
    const pb = document.createElement("div");
    const ph = document.createElement("h3");
    const pool = d.pool;
    ph.textContent = pool && !pool.error ? `The pool: every player, ${pool.hands} player-hands` : "The pool";
    pb.appendChild(ph);
    if (!pool || pool.error) pb.appendChild(para("why", pool?.error ? `The pool could not be read: ${pool.error}` : "loading…"));
    else {
      pb.appendChild(spotTable(pool.spots, { pool: true }));
      const found = bulletsInto(document.createElement("ul"), [
        "**Slow calls** have been stronger than quick ones: more value, fewer draws.",
        "**A long think before a river bet** has meant value; a snapped one has been the weakest.",
        "**River calls:** little timing signal.",
      ]);
      found.className = "why";
      pb.appendChild(found);
      const rb = pool.thin?.river_bet;
      if (rb) {
        pb.appendChild(para("why", `Per player the cells are thin: of ${rb.players} players with river bets known, `
          + (rb.full.length ? `only ${rb.full.join(" and ")} ${rb.full.length === 1 ? "has" : "have"}` : "none has")
          + ` ${pool.min_cell} known hands in every bucket: read the pool first.`));
      }
    }
    wrap.appendChild(pb);

    // This player.
    const mb = document.createElement("div");
    const mh = document.createElement("h3");
    mh.append(`${d.player}`);
    const seg = document.createElement("span"); seg.className = "seg"; seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "Cut the buckets from");
    for (const [rel, text, tip] of [[false, "pool's cuts", "the same seconds for everyone"],
      [true, "own median", "half and twice their own median time on the street"]]) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = text; b.title = tip;
      b.setAttribute("aria-pressed", rel === timingRel);
      b.addEventListener("click", () => { if (timingRel !== rel) { timingRel = rel; renderTiming(d); } });
      seg.appendChild(b);
    }
    mh.appendChild(seg);
    mb.appendChild(mh);
    const rel = timingRel && d.relative;
    mb.appendChild(spotTable(rel ? d.relative.spots : d.spots, { pool: false, rel: rel ? d.relative.cuts_ms : null }));
    if (rel) {
      const med = Object.entries(d.relative.medians_ms).map(([s, ms]) => `${s} ${(ms / 1000).toFixed(1)} s`).join(" · ");
      mb.appendChild(para("why", `Their median decision, pre-selected clicks and timeouts left out: ${med}.`));
    }
    wrap.appendChild(mb);

    // Their pace, street by street.
    const sb = document.createElement("div");
    const sh = document.createElement("h3"); sh.textContent = "Their pace: the first decision on each street";
    const t = document.createElement("table");
    const head = document.createElement("tr");
    for (const c of ["", "timed", "median", "middle half", ...d.buckets.map(b => TEMPO_WORD[b])]) {
      const th = document.createElement("th"); th.textContent = c; head.appendChild(th);
    }
    t.appendChild(head);
    const sec = (ms) => ms == null ? "–" : `${(ms / 1000).toFixed(1)} s`;
    for (const st of d.streets) {
      const tr = document.createElement("tr");
      tr.append(td(st.street), td(String(st.timed)), td(sec(st.median_ms)),
        td(st.p25_ms == null ? "–" : `${sec(st.p25_ms)}–${sec(st.p75_ms)}`));
      for (const b of st.buckets) {
        const c = td(fmtPct(b.pct), ` ${b.n}`, `${st.street}, ${TEMPO_WORD[b.bucket]}: ${b.n} of ${st.timed}`);
        if (b.n) {
          c.classList.add("cellpick"); c.tabIndex = 0; c.setAttribute("role", "button");
          const open = () => drillLine(b.filter, `${st.street} · ${TEMPO_WORD[b.bucket]}`);
          c.addEventListener("click", open);
          c.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); open(); } });
        }
        tr.appendChild(c);
      }
      t.appendChild(tr);
    }
    const how = bulletsInto(document.createElement("ul"), [
      "**Timed** from the action or board before it, never from chat.",
      "**Pre:** a check, call or fold within 1 s of the action before, a pre-selected button. After a board it counts as a snap.",
    ]);
    how.className = "why";
    sb.append(sh, t, how);
    wrap.appendChild(sb);
  }

  // ---- group by ----------------------------------------------------------------
  // GET /groupby: the spot's hands split by one dimension, or two nested, beside
  // the grid. The dimensions come from the server's own catalog. Every row carries
  // the term that finds its hands, and a click adds it to the spot. See SPEC.md,
  // "Group by". The pool scope reads every player's hands and offers `player`.
  const GB_MIX = [["two_pair+", "two pair+", () => ramp(BLUE)[5]], ["top_pair+", "top pair+", () => ramp(BLUE)[2]],
    ["weak_pair", "weak pair", () => "var(--axis)"], ["draw", "draw", () => ramp(RED)[2]], ["air", "air", () => ramp(RED)[5]]];
  const GB_MIX_OF = Object.fromEntries(GB_MIX.map(([g, text, color]) => [g, { text, color }]));
  // [key, header, tip, sort value]: the label column sorts back to the server's order.
  // The seats that post a blind, so folding them every hand costs something.
  const BLIND_SEATS = new Set(["SB", "BB", "BTN/SB"]);
  const GB_COLS = [
    ["hands", "hands", "hands in the spot in this row", (c) => c.hands],
    ["shown", "shown", "hands with their cards known", (c) => c.shown],
    ["net", "net bb", "big blinds won or lost", (c) => c.net_bb],
    ["bb100", "bb/100", "bb won per 100 complete hands; hover a value for its 95% interval", (c) => c.bb_per_100],
    ["vsfold", "vs folding all", "blinds only: bb/100 better (+) or worse (−) than folding every hand you had a choice in",
      (c) => (c.keys?.some(k => BLIND_SEATS.has(k)) ? c.bb_per_100_vs_fold : null)],
    ["mix", "made", "", null],
  ];
  // The request on show: its key, so an unchanged state never asks again, and its
  // controller, so a newer request aborts it. Each scope's catalog, once seen.
  const gb = { key: null, ctl: null, timer: 0, data: null, dims: { player: null, pool: null }, sort: null };
  const gbScope = () => state.gbScope === "pool" ? "pool" : "player";
  const gbDims = () => {
    const a = state.gb || GB_DEFAULT[state.by] || "position";
    return state.gb2 && state.gb2 !== a ? [a, state.gb2] : [a];
  };
  const scheduleGroupby = () => { clearTimeout(gb.timer); gb.timer = setTimeout(loadGroupby, 120); };

  async function loadGroupby(retried = false) {
    if (!GB_VIEWS.includes(state.by) || EMBED || !state.player) return;
    const scope = gbScope();
    // A dimension the scope's catalog lacks (`player` taken back to one player)
    // goes back to the view's own rows.
    const known = gb.dims[scope]?.map(d => d.name);
    if (known) {
      if (state.gb && !known.includes(state.gb)) state.gb = null;
      if (state.gb2 && !known.includes(state.gb2)) state.gb2 = "";
    }
    const q = new URLSearchParams({ by: gbDims().join(","), street: state.gbStreet });
    if (scope === "player") q.set("player", state.player);
    if (state.filter) q.set("filter", state.filter);
    if (state.gbMin) q.set("min", state.gbMin);
    const key = q.toString();
    paintGroupbyControls();
    if (key === gb.key) return; // on show, or on its way
    gb.ctl?.abort();
    const ctl = gb.ctl = new AbortController();
    gb.key = key;
    $("gb-body").classList.add("loading");
    try {
      const r = await fetch("/groupby?" + q, { signal: ctl.signal });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) {
        if (r.status === 404 && body.detail === "Not Found") {
          throw new Error("the running server is older than this page: restart `pnt service` (or `pnt serve`)");
        }
        // A dimension from the URL this scope does not have, before its catalog is known.
        if (r.status === 400 && !retried && !known && (state.gb || state.gb2)) {
          state.gb = null; state.gb2 = ""; gb.key = null; writeUrl();
          return loadGroupby(true);
        }
        throw new Error(body.detail || `${r.status} ${r.statusText}`);
      }
      if (ctl !== gb.ctl) return;
      gb.dims[scope] = body.dims;
      gb.data = body;
      paintGroupbyControls();
      renderGroupby();
    } catch (e) {
      if (ctl !== gb.ctl || e.name === "AbortError") return;
      gb.key = null; // asked again next time
      gb.data = null;
      $("gb-body").replaceChildren(message(String(e.message || e), "err"));
    } finally {
      if (ctl === gb.ctl) $("gb-body").classList.remove("loading");
    }
  }

  // The selects, from the scope's catalog; before it is known, the choices alone.
  function paintGroupbyControls() {
    const scope = gbScope();
    const [a, b = ""] = gbDims();
    const dims = gb.dims[scope] || [...new Set([a, b].filter(Boolean))].map(name => ({ name, label: name }));
    const fill = (sel, opts, value) => {
      sel.replaceChildren(...opts.map(([v, text]) => Object.assign(document.createElement("option"), { value: v, textContent: text })));
      sel.value = value;
    };
    fill($("gb-by"), dims.map(d => [d.name, d.label]), a);
    fill($("gb-by2"), [["", "—"], ...dims.filter(d => d.name !== a).map(d => [d.name, d.label])], b);
    $("gb-street").value = state.gbStreet;
    $("gb-min").value = state.gbMin || "";
    document.querySelectorAll("[data-gbscope]").forEach(x => {
      x.setAttribute("aria-pressed", x.dataset.gbscope === scope);
      if (x.dataset.gbscope === "player") x.textContent = state.player || "player";
    });
  }

  // A row's click: its term onto the spot, as a chip adds one. A pool row of
  // `player` names whose hands it is instead, so it switches the chart to them.
  function pickGroupRow(c) {
    if (c.player && [...$("player").options].some(o => o.value === c.player)) {
      $("player").value = c.player;
      state.gbScope = "player";
      if (state.gb === "player") state.gb = null;
      if (state.gb2 === "player") state.gb2 = "";
    }
    if (c.term) {
      const cur = terms();
      $("filter").value = [...cur, ...c.term.split(",").filter(t => !cur.includes(t))].join(",");
    }
    apply();
  }

  function renderGroupby() {
    const d = gb.data;
    const body = $("gb-body");
    if (!d) return;
    const pool = d.player == null;
    $("gb-sub").textContent = `${pool ? "the pool" : d.player} · ${d.filter || "all hands"}`;
    if (!d.cells.length) {
      body.replaceChildren(message(d.hidden.cells
        ? `every row has under ${d.min} hands (${d.hidden.cells} rows, ${d.hidden.hands} hands)` : "no hands in this spot"));
      return;
    }
    const two = d.by.length === 2;
    const t = document.createElement("table");
    const head = document.createElement("tr");
    const sortTh = (text, tip, key) => {
      const th = document.createElement("th");
      th.className = "sort";
      const on = gb.sort?.key === key || (key == null && !gb.sort);
      th.textContent = text + (on && key != null ? (gb.sort.dir < 0 ? " ▾" : " ▴") : "");
      if (tip) th.title = tip;
      th.addEventListener("click", () => {
        // Most first, then least first; the label column goes back to the order served.
        gb.sort = key == null ? null : gb.sort?.key === key && gb.sort.dir < 0 ? { key, dir: 1 } : { key, dir: -1 };
        renderGroupby();
      });
      return th;
    };
    head.appendChild(sortTh(d.by.map(x => x.label).join(" › "), "click a row to add it to the spot", null));
    // vs fold only means something where folding costs a blind: the SB and BB rows
    // of a position split. Without one the column is left out.
    const seatAt = d.by.findIndex(x => x.name === "position");
    const blindRow = (c) => seatAt >= 0 && BLIND_SEATS.has(c.keys?.[seatAt]);
    const cols = GB_COLS.filter(([key]) => key !== "vsfold" || seatAt >= 0);
    for (const [key, text, tip, val] of cols) {
      if (val) { head.appendChild(sortTh(text, tip, key)); continue; }
      const th = document.createElement("th");
      th.textContent = `${text} (${d.street})`;
      th.title = `their made hand on the ${d.street}, of the shown hands: ${GB_MIX.map(([, text]) => text).join(" · ")}`;
      head.appendChild(th);
    }
    const thead = document.createElement("thead"); thead.appendChild(head); t.appendChild(thead);

    const cellRow = (c, label, cls) => {
      const tr = document.createElement("tr");
      tr.className = cls;
      const lab = document.createElement("td"); lab.className = "lab";
      if (cls !== "total") {
        const add = document.createElement("span"); add.className = "add"; add.textContent = "⊕"; add.setAttribute("aria-hidden", "true");
        lab.appendChild(add);
      }
      lab.append(label);
      tr.appendChild(lab);
      const td = (text, small, title) => {
        const el = document.createElement("td"); el.textContent = text;
        if (small) { const s = document.createElement("small"); s.textContent = small; el.appendChild(s); }
        if (title) el.title = title;
        tr.appendChild(el);
        return el;
      };
      const ci = (v, h) => v == null || h == null ? "" : `95%: ${(v - h).toFixed(1)} to ${(v + h).toFixed(1)} over ${c.bb_hands} complete hands`;
      td(String(c.hands));
      td(String(c.shown), c.hands ? `${Math.round(100 * c.shown / c.hands)}%` : "");
      signTone(td(c.net_bb == null ? "–" : (c.net_bb > 0 ? "+" : "") + c.net_bb.toFixed(1)), c.net_bb);
      signTone(td(c.bb_per_100 == null ? "–" : c.bb_per_100.toFixed(1), c.bb_per_100_ci == null ? "" : `±${c.bb_per_100_ci.toFixed(0)}`,
        ci(c.bb_per_100, c.bb_per_100_ci)), c.bb_per_100);
      if (seatAt >= 0) {
        const vf = c.bb_per_100_vs_fold, raw = c.bb_per_100;
        if (cls === "total" || !blindRow(c) || vf == null || raw == null) td("");
        else {
          // Folding every hand with a choice would have scored raw − vf.
          const fold = raw - vf;
          td((vf > 0 ? "+" : "") + vf.toFixed(1), ` fold all ${fold.toFixed(0)}`,
            `you ${raw.toFixed(1)} bb/100 · folding every hand ${fold.toFixed(1)} → `
            + `${vf >= 0 ? `${vf.toFixed(1)} better` : `${(-vf).toFixed(1)} worse`} than folding`
            + (c.bb_per_100_vs_fold_ci == null ? "" : ` (±${c.bb_per_100_vs_fold_ci.toFixed(0)})`));
          tr.lastChild.classList.add(vf >= 0 ? "up" : "down");
        }
      }
      const mixTd = document.createElement("td"); mixTd.className = "mix";
      const bar = document.createElement("div"); bar.className = "gb-mix";
      if (!c.mix.known) bar.classList.add("none");
      for (const g of c.mix.groups) {
        const i = document.createElement("i");
        i.style.width = g.pct + "%";
        i.style.background = (GB_MIX_OF[g.group]?.color ?? (() => "var(--axis)"))();
        bar.appendChild(i);
      }
      const tipRows = [...c.mix.groups.map(g => [GB_MIX_OF[g.group]?.text ?? g.group, `${g.n} · ${fmtPct(g.pct)}`]),
        ["known", `${c.mix.known} of ${c.hands}`]];
      bar.addEventListener("mousemove", (ev) => showLineTip(ev, `${label} · ${c.mix.street}`, tipRows));
      bar.addEventListener("mouseleave", hideTip);
      mixTd.appendChild(bar);
      tr.appendChild(mixTd);
      if (cls !== "total") {
        tr.tabIndex = 0;
        tr.setAttribute("role", "button");
        const what = c.term ? `adds ${c.term} to the spot` : `switches the chart to ${c.player}`;
        tr.title = `${c.keys.join(" · ")}: ${c.hands} hands · ${what}`;
        tr.addEventListener("click", () => pickGroupRow(c));
        tr.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); pickGroupRow(c); } });
      }
      return tr;
    };
    const val = gb.sort && GB_COLS.find(([k]) => k === gb.sort.key)[3];
    const sorted = (cells) => !val ? cells : [...cells].sort((x, y) => {
      const a = val(x), b = val(y);
      if (a == null || b == null) return (a == null) - (b == null); // blanks last
      return gb.sort.dir * (a - b);
    });
    const tb = document.createElement("tbody");
    if (!two) {
      for (const c of sorted(d.cells)) tb.appendChild(cellRow(c, c.keys[0], "row"));
    } else {
      // Row groups, not a pivot: each first-dimension bucket, the second under it.
      const groups = new Map();
      for (const c of d.cells) {
        if (!groups.has(c.keys[0])) groups.set(c.keys[0], []);
        groups.get(c.keys[0]).push(c);
      }
      for (const [label, cells] of groups) {
        const tr = document.createElement("tr"); tr.className = "grp";
        const td = document.createElement("td"); td.colSpan = GB_COLS.length + 1;
        td.textContent = label;
        tr.appendChild(td);
        tb.appendChild(tr);
        for (const c of sorted(cells)) tb.appendChild(cellRow(c, c.keys[1], "row sub"));
      }
    }
    t.appendChild(tb);
    const tf = document.createElement("tbody");
    tf.appendChild(cellRow(d.total, "all", "total"));
    t.appendChild(tf);

    const foot = document.createElement("p"); foot.className = "gb-foot";
    for (const [g, text, color] of GB_MIX) {
      const s = document.createElement("span");
      const i = document.createElement("i"); i.style.background = color();
      s.append(i, text);
      s.title = g;
      foot.appendChild(s);
    }
    const bits = seatAt >= 0 ? ["vs folding all: how much better (+) or worse (−) than folding every blind you had a choice in"] : [];
    if (d.skipped) bits.push(`${d.skipped} hands in no row`);
    if (d.hidden.cells) bits.push(`${d.hidden.cells} rows under ${d.min} hands hidden (${d.hidden.hands} hands)`);
    if (bits.length) foot.append(bits.join(" · "));
    body.replaceChildren(t, foot);
  }

  // ---- spot tree -----------------------------------------------------------------
  // GET /players/{alias}/tree: seat, then each spot they reached, what they chose
  // there, and the spot those hands reached next, in one request up to the depth
  // asked. Every node and choice carries the filter that finds exactly its hands,
  // added to the spot the tree was built on; a click puts it in the Spot box and
  // goes to the grid, where the range and the group-by panel follow it. See
  // SPEC.md, "Spot tree".
  TITLE[TREE_VIEW] = "Spot tree";
  TITLE[TAGGED_VIEW] = "Tagged hands";
  const TREE_NOTE = [
    "**Every hand**, shown or not: what they did, not what they held.",
    "Click a spot for its range and group-by; a bar part for one choice.",
    "Untracked spots (a bet into a limped pot) are skipped.",
  ];
  // A preflop raise named by the level it is made at; a call when nobody has raised is a limp.
  const TREE_RAISE = { unopened: "raise", faced_open: "3-bet", faced_3bet_any: "4-bet", faced_4bet: "5-bet", faced_5bet: "6-bet" };
  const TREE_COLOR = { fold: "fold", check: "check", call: "call", raise: "raise", bet: "raise" };
  const TREE_KEY = [["fold", "fold"], ["check", "check"], ["call", "call / limp"], ["raise", "bet / raise"]];
  const choiceWord = (n, d) => {
    const spot = n.filter.split(",").at(-1); // a node's own spot term ends its filter
    return spot === "unopened" && d === "call" ? "limp" : d === "raise" && TREE_RAISE[spot] || d;
  };
  // The ids toggled from their default: a seat starts open, every other node closed.
  const treeToggled = new Set();

  async function loadTree(quiet, live) {
    const q = new URLSearchParams({ depth: state.tdepth, texture: state.tx, min_hands: TREE_MIN });
    if (state.filter) q.set("filter", state.filter);
    const key = `${state.player}|${q}`;
    if (!quiet && state.tree?.key === key) return state.tree.data;
    // Built from scratch it takes a second or two: say so while the card is dimmed.
    const building = `${TITLE[TREE_VIEW]} · building…`;
    if (!quiet) $("card-title").textContent = building;
    try {
      const data = await getJson(`/players/${encodeURIComponent(state.player)}/tree?` + q);
      if (!("roots" in data)) throw new Error("the running server is older than this page: restart `pnt service` (or `pnt serve`)");
      if (live()) state.tree = { key, data };
      return data;
    } finally {
      if ($("card-title").textContent === building) $("card-title").textContent = TITLE[state.dataView] || "";
    }
  }

  function renderTreeTiles(d) {
    setTileKeys("hands in this spot ›", "seats", "no seat, left out");
    $("t-hands").textContent = d.hands;
    $("t-known").textContent = d.roots.length;
    $("t-cov").textContent = d.unplaced;
    tileTip("t-cov", "dead-button hands have no seat, so no place in the tree");
    $("t-raise").textContent = d.depth;
    setRaiseKey("decisions deep", `spots under ${d.min_hands} hands cut`);
  }

  // A node's (or one choice's) terms onto the spot the tree was built on, then the
  // grid: the range and the group-by panel for exactly those hands. A history
  // entry of its own, so Back (the browser's, or ‹ Back to tree) returns here with
  // the tree's entry holding where it was scrolled to.
  function drillTree(base, filter) {
    hideTip();
    history.replaceState({ ...history.state, scrollY }, "");
    const cur = (base || "").split(",").map(t => t.trim()).filter(Boolean);
    $("filter").value = [...cur, ...filter.split(",").filter(t => !cur.includes(t))].join(",");
    state.by = "preflop";
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === state.by));
    apply(false, true);
    scrollTo(0, 0); // the grid starts at the top, not where the tree was scrolled
  }

  function renderTree(d) {
    $("tdepth").value = String(state.tdepth);
    $("ttexture").setAttribute("aria-pressed", state.tx);
    $("tmin").value = state.tmin;
    const host = $("tree");
    host.replaceChildren();
    if (d.filter) {
      const p = message("Tree of hands matching "); p.classList.add("tbase");
      const code = document.createElement("code"); code.textContent = d.filter;
      p.appendChild(code);
      host.appendChild(p);
    }
    if (!d.roots.length) {
      host.appendChild(message(d.hands ? `every seat has under ${d.min_hands} hands here` : "no hands in this spot"));
      return;
    }
    const legend = document.createElement("div"); legend.className = "legend";
    for (const [k, text] of TREE_KEY) {
      const s = document.createElement("span");
      const i = document.createElement("i"); i.style.background = `var(--tr-${k})`;
      s.append(i, text); legend.appendChild(s);
    }
    host.appendChild(legend);

    const rows = document.createElement("div"); rows.className = "trows";
    for (const h of ["spot", "hands", "what they chose", ""]) {
      const el = document.createElement("div"); el.className = "h" + (h === "hands" ? " num" : ""); el.textContent = h;
      rows.appendChild(el);
    }
    const addNode = (n, depth, parent) => {
      const seat = parent == null;
      const kids = n.children.length > 0;
      const open = kids && (seat ? !treeToggled.has(n.id) : treeToggled.has(n.id));
      const row = document.createElement("div");
      row.className = "trow" + (seat ? " seat" : "") + (n.hands < state.tmin ? " dim" : "");
      row.style.setProperty("--d", depth);

      const tl = document.createElement("div"); tl.className = "tl";
      const caret = document.createElement("button"); caret.type = "button";
      caret.className = "caret" + (kids ? "" : " leaf");
      caret.textContent = open ? "▾" : "▸";
      if (kids) {
        caret.setAttribute("aria-expanded", open);
        caret.title = open ? "close" : `open the ${n.children.length} spot${n.children.length === 1 ? "" : "s"} after this`;
        caret.addEventListener("click", () => {
          if (treeToggled.has(n.id)) treeToggled.delete(n.id); else treeToggled.add(n.id);
          renderTree(d);
        });
      } else caret.tabIndex = -1;
      tl.appendChild(caret);
      const how = [parent && n.via ? `${choiceWord(parent, n.via)} →` : "", n.edge || ""].filter(Boolean).join(" ");
      if (how) {
        const edge = document.createElement("span"); edge.className = "edge"; edge.textContent = how + " ·";
        edge.title = how;
        tl.appendChild(edge);
      }
      const spot = document.createElement("span"); spot.className = "spot"; spot.textContent = n.label;
      spot.tabIndex = 0; spot.setAttribute("role", "button");
      spot.title = `${n.filter} · range and group-by for these ${n.hands} hands`;
      spot.addEventListener("click", () => drillTree(d.filter, n.filter));
      spot.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); drillTree(d.filter, n.filter); } });
      tl.appendChild(spot);

      const num = document.createElement("div"); num.className = "num"; num.textContent = n.hands;
      num.title = seat ? `${n.hands} hands in this seat · ${n.ended} with no decision`
        : `${n.hands} hands reached this spot · ${n.ended} stopped here`;
      const stack = document.createElement("div"); stack.className = "stack";
      const made = n.decisions.filter(x => x.hands > 0);
      for (const x of made) {
        const word = choiceWord(n, x.decision);
        const seg = document.createElement("i");
        seg.style.flex = `${x.hands} 1 0`;
        seg.style.background = `var(--tr-${TREE_COLOR[x.decision] || "check"})`;
        seg.tabIndex = 0; seg.setAttribute("role", "button");
        seg.setAttribute("aria-label", `${word}: ${x.hands} of ${n.hands}, ${fmtPct(x.pct)}`);
        const tip = [[word, `${x.hands} of ${n.hands}`], ["share", fmtPct(x.pct)], ["click", "range for this choice"]];
        seg.addEventListener("pointermove", (ev) => showLineTip(ev, n.label, tip));
        seg.addEventListener("pointerleave", hideTip);
        seg.addEventListener("focus", (ev) => showLineTip(ev, n.label, tip));
        seg.addEventListener("blur", hideTip);
        seg.addEventListener("click", () => drillTree(d.filter, x.filter));
        seg.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); drillTree(d.filter, x.filter); } });
        stack.appendChild(seg);
      }
      if (!seat && !made.length) { stack.classList.add("none"); stack.textContent = "no choice read"; }
      const txt = document.createElement("div"); txt.className = "txt";
      txt.textContent = seat ? (n.ended ? `${n.ended} with no decision` : "")
        : n.decisions.map(x => `${choiceWord(n, x.decision)} ${x.pct > 0 && x.pct < 0.5 ? "<1" : Math.round(x.pct ?? 0)}%`).join(" · ");
      row.append(tl, num, stack, txt);
      rows.appendChild(row);
      if (open) for (const c of n.children) addNode(c, depth + 1, n);
    };
    for (const r of d.roots) addNode(r, 0, null);
    host.appendChild(rows);
    const hint = message(`dimmed: under ${state.tmin} hands · ${d.notes?.[0] || ""}`);
    hint.classList.add("note"); hint.style.margin = "4px 0 0";
    host.appendChild(hint);
  }

  $("tdepth").addEventListener("change", () => { state.tdepth = Number($("tdepth").value) || TREE_DEPTH; writeUrl(); load(); });
  $("ttexture").addEventListener("click", () => { state.tx = !state.tx; writeUrl(); load(); });
  // Dimming is the page's own: the tree on show is drawn again, not asked for.
  $("tmin").addEventListener("change", () => {
    const n = Number($("tmin").value);
    state.tmin = Number.isInteger(n) && n >= 0 ? n : TREE_DIM;
    writeUrl();
    if (state.data && state.dataView === TREE_VIEW) render();
  });

  // ---- made hands by street (Made hands › Streets) ------------------------------
  // GET /players/{alias}/streets: the shown hands' flop holding against their river
  // holding, and for a log's owner where each flop holding went. Every cell carries
  // the filter that finds its hands; a click adds it and lists them. See SPEC.md,
  // "Holdings by street".
  const STREET_PATHS = [["fold_flop", "fold F"], ["fold_turn", "fold T"], ["fold_river", "fold R"],
    ["won_flop", "won F"], ["won_turn", "won T"], ["won_river", "won R"], ["showdown", "showdown"]];
  // A count tinted by its share of the row: the deeper the blue, the more of the row.
  function shareCell(td, share) {
    const hex = ramp(BLUE)[Math.min(6, Math.floor(share * 7 - 1e-9))];
    td.style.background = hex;
    const k = inkClass(hex); if (k) td.classList.add(k);
  }
  function streetCell(tr, c, of, title, { tint = true, small = null } = {}) {
    const td = document.createElement("td");
    if (!c || !c.hands) { td.className = "zero"; td.textContent = "·"; tr.appendChild(td); return; }
    td.className = "c"; td.textContent = c.hands;
    if (small) { const s = document.createElement("small"); s.textContent = small; td.appendChild(s); }
    const share = of ? c.hands / of : 0;
    if (tint && share > 0) shareCell(td, share);
    td.title = `${title}: ${c.hands} hands${of ? ` · ${fmtPct(100 * share)} of the row` : ""} · net ${fmtNet(c.net_bb)}`
      + (c.filter ? ` · ${c.filter}` : "");
    if (c.filter) {
      td.tabIndex = 0; td.setAttribute("role", "button");
      td.addEventListener("click", () => drillLine(c.filter, title));
      td.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); drillLine(c.filter, title); } });
    }
    tr.appendChild(td);
  }
  function streetMatrix(m, rows, label) {
    const t = document.createElement("table");
    const head = document.createElement("tr");
    const th = (text, title) => { const el = document.createElement("th"); el.textContent = text; if (title) el.title = title; head.appendChild(el); };
    th(`${rows} ↓ · river →`);
    for (const c of m.totals) th(label[c.river]);
    th("all");
    if (rows === "flop") th("reach river", "of the shown hands that saw the flop with it; runs high, shown hands went far");
    const thead = document.createElement("thead"); thead.appendChild(head); t.appendChild(thead);
    const tb = document.createElement("tbody");
    for (const r of m.rows) {
      const tr = document.createElement("tr");
      const lab = document.createElement("td"); lab.textContent = r.label; tr.appendChild(lab);
      for (const c of r.cells) streetCell(tr, c, r.hands, `${r.label} on the ${rows} → ${label[c.river]} on the river`);
      streetCell(tr, r, 0, `${r.label} on the ${rows}, to the river`, { tint: false });
      if (rows === "flop") {
        const td = document.createElement("td"); td.textContent = fmtPct(r.reach_river_pct);
        td.title = `${r.hands} of ${r.saw_flop} shown hands with ${r.label} on the flop`;
        tr.appendChild(td);
      }
      tb.appendChild(tr);
    }
    const tot = document.createElement("tr"); tot.className = "total";
    const lab = document.createElement("td"); lab.textContent = "all"; tot.appendChild(lab);
    for (const c of m.totals) streetCell(tot, c, 0, `${label[c.river]} on the river`, { tint: false });
    const all = document.createElement("td"); all.textContent = m.hands; tot.appendChild(all);
    if (rows === "flop") {
      const td = document.createElement("td"); td.textContent = fmtPct(m.saw_flop ? 100 * m.hands / m.saw_flop : null);
      tot.appendChild(td);
    }
    tb.appendChild(tot);
    t.appendChild(tb);
    return t;
  }

  function renderStreets(d) {
    const host = $("streets");
    host.replaceChildren();
    const s = d.streets;
    if (!s) return; // the Mix tab's data, with the Streets tab's on its way
    if (s.error) { host.appendChild(message(s.error, "err")); return; }
    const label = Object.fromEntries(s.groups.map(g => [g.key, g.label]));
    const h3 = (text, small, title) => {
      const h = document.createElement("h3"); h.textContent = text;
      if (small) { const sm = document.createElement("small"); sm.textContent = small; h.appendChild(sm); }
      if (title) h.title = title;
      host.appendChild(h);
    };
    const m = s.shown_matrix;
    h3("Shown hands: flop → river", `${m.hands} reached the river · click a cell to add it`);
    host.appendChild(m.hands ? streetMatrix(m, "flop", label) : message("no shown hand in this spot reached the river"));
    const note = document.createElement("p"); note.className = "snote"; note.textContent = s.notes.join(" ");
    host.appendChild(note);

    const hf = s.hero_funnel;
    if (!hf) return;
    h3("Their own logs: flop → outcome", `${hf.flops} flops`, "the logs they recorded: every card known, no showdown lean");
    const t = document.createElement("table");
    const head = document.createElement("tr");
    const names = Object.fromEntries(hf.rows[0]?.paths.map(p => [p.key, p.label]) || []);
    const cut = hf.rows.some(r => r.paths.some(p => p.key === "other" && p.hands));
    for (const [k, text] of [["", "flop"], ["", "flops"], ...STREET_PATHS, ...(cut ? [["other", "cut short"]] : [])]) {
      const el = document.createElement("th"); el.textContent = text; if (names[k]) el.title = names[k];
      head.appendChild(el);
    }
    const thead = document.createElement("thead"); thead.appendChild(head); t.appendChild(thead);
    const tb = document.createElement("tbody");
    for (const r of hf.rows) {
      const tr = document.createElement("tr");
      const lab = document.createElement("td"); lab.textContent = r.label; tr.appendChild(lab);
      streetCell(tr, r, 0, `${r.label} on the flop`, { tint: false });
      const by = Object.fromEntries(r.paths.map(p => [p.key, p]));
      for (const [k] of [...STREET_PATHS, ...(cut ? [["other"]] : [])]) {
        const p = by[k];
        streetCell(tr, p, r.hands, `${r.label} on the flop · ${p?.label ?? k}`, { small: p?.hands ? fmtNet(p.net_bb) : null });
      }
      tb.appendChild(tr);
    }
    t.appendChild(tb);
    host.appendChild(t);
    h3("Their own logs: turn → river", `${hf.turn_river.hands} reached the river`);
    host.appendChild(hf.turn_river.hands ? streetMatrix(hf.turn_river, "turn", label) : message("none reached the river"));
  }

  document.querySelectorAll("[data-made]").forEach(b => b.addEventListener("click", () => {
    if (state.made === b.dataset.made) return;
    state.made = b.dataset.made; writeUrl(); closeHands(); load();
  }));

  // ---- estimated range ---------------------------------------------------------
  // GET /players/{alias}/estimate: the range their frequency at the spot's one
  // preflop decision implies, outlined on the grid; GET /board breaks it down on a
  // board. Each answer is kept by its key, so a re-render does not ask again, and
  // a newer request aborts the one before it. See "Estimated ranges" in SPEC.md.
  const est = { key: null, ctl: null, data: null, err: null, bkey: null, bctl: null, board: null, berr: null };
  const GROUP_FILL = { strong: BLUE[6], trips: BLUE[5], two_pair: BLUE[4], top_pair: BLUE[3], weak_pair: BLUE[1],
    draw: RED[3], air: "var(--axis)" };
  const VALUE_GROUPS = ["strong", "trips", "two_pair", "top_pair", "weak_pair"];
  const leafWord = (x) => MADE_LABEL[x] || x.replace(/_/g, " ");
  const estOn = () => state.est && state.by === "preflop" && !state.table && !EMBED;
  const estKey = () => `${state.player}|${state.filter}`;
  // A class's weight in the estimate on show, 0 outside it; null with none on show.
  const estWeight = (label) => estOn() && est.data && est.key === estKey() ? (est.data.cells[label] || 0) : null;

  async function getAbortable(url, ctl) {
    const r = await fetch(url, { signal: ctl.signal });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 404 && body.detail === "Not Found") {
        throw new Error("the running server is older than this page: restart `pnt service` (or `pnt serve`)");
      }
      throw new Error(body.detail || `${r.status} ${r.statusText}`);
    }
    return body;
  }

  async function loadEstimate() {
    const key = estKey();
    if (key === est.key) { paintEstimate(); return; } // on show, or on its way
    est.ctl?.abort(); est.bctl?.abort();
    const ctl = est.ctl = new AbortController();
    Object.assign(est, { key, data: null, err: null, bkey: null, board: null, berr: null });
    paintEstimate();
    const q = new URLSearchParams();
    if (state.filter) q.set("filter", state.filter);
    try {
      const d = await getAbortable(`/players/${encodeURIComponent(state.player)}/estimate?` + q, ctl);
      if (ctl !== est.ctl) return;
      est.data = d;
    } catch (e) {
      if (ctl !== est.ctl || e.name === "AbortError") return;
      est.err = String(e.message || e);
    }
    paintEstimate();
  }

  function paintEstimate() {
    const on = estOn();
    const d = on && est.key === estKey() ? est.data : null;
    $("grid").classList.toggle("est-on", !!d);
    for (const el of $("grid").children) {
      const w = d ? d.cells[el.dataset.hand] || 0 : 0;
      el.classList.toggle("est-in", w > 0);
      el.classList.toggle("est-part", w > 0 && w < 0.999);
      if (d) el.style.setProperty("--w", w); else el.style.removeProperty("--w");
    }
    if (!on) return;
    const box = $("est");
    box.replaceChildren();
    if (est.err) { box.appendChild(message(est.err)); return; }
    if (!d) { box.appendChild(message("estimating…")); return; }
    box.appendChild(estCaption(d));
    if (d.n) { box.appendChild(boardPanel()); loadBoard(); }
  }
