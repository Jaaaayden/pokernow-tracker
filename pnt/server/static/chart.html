  // "Estimated 62% (±6) from 380 hands unopened (open 236×); 3 shown outside → moved suited connectors up"
  function estCaption(d) {
    const wrap = document.createElement("div");
    const nd = d.node;
    const cap = document.createElement("div"); cap.className = "cap";
    if (!d.n) {
      cap.textContent = `No hands at this spot to estimate from (${nd.spot_filter}).`;
      wrap.appendChild(cap); return wrap;
    }
    const b = document.createElement("b"); b.textContent = `Estimated ${d.pct}% (±${d.pm})`;
    const parts = [`from ${d.n} hands ${nd.spot} (${nd.label} ${d.count}×)`];
    if (d.method === "capped") parts.push(`less the top ${d.slice_pct}% they raise`);
    if (d.calibrated) {
      // Families first, the most combos moved first; the rest as a count.
      const by = new Map();
      for (const r of d.calibration) {
        if (!r.moved.length) continue;
        const k = r.family || r.class;
        by.set(k, (by.get(k) || 0) + r.moved.length + (r.family ? 100 : 0));
      }
      const moved = [...by].sort((a, b) => b[1] - a[1]).map(([k]) => k);
      const more = moved.length > 3 ? ` +${moved.length - 3} more` : "";
      // Nothing moved in: the shown hands only reweighed classes already in it.
      parts.push(moved.length
        ? `${d.outside} shown outside → moved ${moved.slice(0, 3).join(", ")}${more} up`
        : `reweighed inside by ${d.shown} shown`);
    } else if (d.outside) {
      parts.push(`${d.outside} shown outside; nothing moves under ${d.min_shown} shown (${d.shown})`);
    }
    cap.append(b, " " + parts.join("; "));
    const sub = document.createElement("div"); sub.className = "sub";
    sub.textContent = "bright = in the estimate · faded = out · dashed = only some of its combos" +
      (nd.ignored.length ? ` · not in the frequency: ${nd.ignored.join(", ")}` : "");
    wrap.append(cap, sub);
    return wrap;
  }

  function boardPanel() {
    const wrap = document.createElement("div");
    const h = document.createElement("h3"); h.textContent = "Board";
    const sm = document.createElement("small"); sm.textContent = "the estimate's combos on it, card removal applied";
    h.appendChild(sm);
    const ctl = document.createElement("div"); ctl.className = "bd-ctl";
    const input = document.createElement("input");
    Object.assign(input, { id: "est-board", type: "text", spellcheck: false, placeholder: "Ah7c2d", value: state.estBoard });
    input.setAttribute("aria-label", "Board, 3 to 5 cards");
    const go = document.createElement("button"); go.type = "button"; go.textContent = "Break down";
    const run = () => { state.estBoard = input.value.trim(); writeUrl(); loadBoard(); };
    go.addEventListener("click", run);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });
    const hint = document.createElement("span"); hint.className = "sub";
    hint.textContent = "blank: ~30 flops of the spot's flop texture, e.g. flop=king_high";
    ctl.append(input, go, hint);
    const body = document.createElement("div"); body.id = "est-bd";
    wrap.append(h, ctl, body);
    return wrap;
  }

  async function loadBoard() {
    const box = () => $("est-bd");
    if (!estOn() || !est.data?.n) return;
    const key = `${est.key}|${state.estBoard}`;
    if (key === est.bkey) { if (box()) paintBoard(box()); return; }
    est.bctl?.abort();
    const ctl = est.bctl = new AbortController();
    Object.assign(est, { bkey: key, board: null, berr: null });
    if (box()) paintBoard(box());
    const q = new URLSearchParams();
    if (state.filter) q.set("filter", state.filter);
    if (state.estBoard) q.set("board", state.estBoard);
    try {
      const d = await getAbortable(`/players/${encodeURIComponent(state.player)}/board?` + q, ctl);
      if (ctl !== est.bctl) return;
      est.board = d;
    } catch (e) {
      if (ctl !== est.bctl || e.name === "AbortError") return;
      est.berr = String(e.message || e);
    }
    if (box()) paintBoard(box());
  }

  // value / draw / air shares of a group mix, in percent.
  // Value, draw and air as % of the mix, from its combos: summing the groups'
  // already-rounded shares can come to 100.1.
  function vda(mix) {
    const sum = (keys) => mix.filter(m => keys.includes(m.group)).reduce((s, m) => s + (m.combos || 0), 0);
    const parts = [sum(VALUE_GROUPS), sum(["draw"]), sum(["air"])];
    const total = parts[0] + parts[1] + parts[2];
    return parts.map((c) => (total ? 100 * c / total : 0));
  }

  function paintBoard(body) {
    body.replaceChildren();
    if (est.berr) { body.appendChild(message(est.berr)); return; }
    const d = est.board;
    if (!d) { body.appendChild(message("breaking down…")); return; }
    const head = document.createElement("div"); head.className = "cap";
    head.textContent = d.sampled
      ? `${d.boards.length} random flops with ${d.flop_terms.join(", ")} · ≈${Math.round(d.combos)} combos each, averaged`
      : `${d.board.map(pretty).join(" ")} · ≈${Math.round(d.combos)} combos`;
    body.appendChild(head);

    const bar = document.createElement("div"); bar.className = "catbar";
    const key = document.createElement("div"); key.className = "catkey";
    for (const c of d.categories) {
      if (!c.pct) continue;
      const i = document.createElement("i");
      i.style.flex = `${c.pct} 1 0`; i.style.background = GROUP_FILL[c.group];
      i.title = `${c.label} ${fmtPct(c.pct)} · ` + c.leaves.map(x => `${leafWord(x.leaf)} ${fmtPct(x.pct)}`).join(", ");
      bar.appendChild(i);
      const k = document.createElement("span");
      const sw = document.createElement("i"); sw.style.background = GROUP_FILL[c.group];
      k.append(sw, `${c.label} ${fmtPct(c.pct)}`);
      key.appendChild(k);
    }
    const cut = d.linear_cut, nx = d.next;
    if (cut && nx) {
      // The cut takes the strongest combos first, and the bar runs strongest first.
      const m = document.createElement("div"); m.className = "cut" + (cut.pct > 60 ? " right" : "");
      m.style.left = cut.pct + "%";
      const s = document.createElement("span"); s.textContent = `${nx.label} ${fmtPct(cut.pct)} → cut at ${leafWord(cut.at)}`;
      m.appendChild(s); bar.appendChild(m);
    }
    body.append(bar, key);

    const notes = [];
    if (!nx) notes.push("no next action after a limp: the mix alone");
    else {
      const t = document.createElement("table");
      const tr = (cells, tag = "td") => {
        const r = document.createElement("tr");
        for (const c of cells) { const e = document.createElement(tag); e.textContent = c; r.appendChild(e); }
        t.appendChild(r); return r;
      };
      tr(["", "value", "draw", "air", ""], "th");
      const pct = (v) => fmtPct(Math.round(10 * v) / 10);
      if (cut) tr([`If they bet only their best ${fmtPct(cut.pct)}`, ...vda(cut.mix).map(pct), `≈${Math.round(cut.combos)} combos`]);
      const sm = nx.shown_mix;
      tr(sm.n ? [`What they showed after a ${nx.label}`, ...vda(sm.mix).map(pct), `${sm.n} shown`]
        : [`What they showed after a ${nx.label}`, "–", "–", "–", "none shown"]);
      body.appendChild(t);
      // The one-line reading: how far their real bets stray from betting by strength.
      if (cut && sm.n >= 10) {
        const light = (mix) => 100 - vda(mix)[0];
        const gap = light(sm.mix) - light(cut.mix);
        const verdict = document.createElement("div"); verdict.className = "cap";
        verdict.textContent = `${fmtPct(Math.round(light(sm.mix)))} of what they showed was a draw or air, against `
          + `${fmtPct(Math.round(light(cut.mix)))} if they bet only by strength → `
          + (gap > 15 ? "they bet this board much lighter than their value"
            : gap < -15 ? "they bet it only with strong hands"
            : "about what betting by strength gives");
        body.appendChild(verdict);
      }
      notes.push(`${nx.label} ${fmtPct(nx.pct)} of ${nx.n}` + (nx.ci ? ` (${nx.ci[0]}–${nx.ci[1]}%)` : ""));
      if (d.texture.length) notes.push(`rate and shown hands: boards like this (${d.texture.join(",")})`);
    }
    const ul = document.createElement("ul");
    bulletsInto(ul, [...notes, ...d.notes]);
    body.appendChild(ul);
  }

  function render() {
    const d = state.data;
    const view = state.by;
    // The view was switched and its data is still loading: what is held is the
    // last view's, in that view's shape. The load renders when it lands.
    if (!d || state.dataView !== view) return;
    $("bluffs").classList.toggle("hidden", view !== "bluffs");
    if (view === "bluffs") { renderBluffs(d); return; }
    const review = isListView(view);
    const strength = view === "strength"; // already a table: no grid/table switch
    const table = state.table && !review && !strength;
    if (view === SESSION_VIEW) renderSessionTiles(d);
    else if (view === TAGGED_VIEW) renderTaggedTiles(d);
    else if (review) renderReviewTiles(d, view);
    else if (view === "sizing") renderSizingTiles(d);
    else if (view === LINES_VIEW) renderLinesTiles(d);
    else if (strength) renderStrengthTiles(d);
    else if (view === TREE_VIEW) renderTreeTiles(d);
    else renderRangeTiles(d);
    $("subtitle").textContent = `${d.player} · ${d.filter || "all hands"}`;
    setNote(review ? REVIEW_NOTE[view]
      : view === "sizing" ? KIND_NOTE[d.kind]
      : view === LINES_VIEW ? LINES_NOTE
      : strength ? SP_NOTE
      : view === TREE_VIEW ? TREE_NOTE
      : (d.filter || "").split(",").some(t => JAM_TERM.test(t.trim())) ? [...RANGE_NOTE, JAM_NOTE] : RANGE_NOTE,
      (view === "preflop" || view === "made") && isLimpReraise(d.filter) ? LIMP_NOTE : []);
    $("colorseg").classList.toggle("hidden", view !== "preflop");
    $("sizingctl").classList.toggle("hidden", view !== "sizing");
    $("linesctl").classList.toggle("hidden", view !== LINES_VIEW);
    $("reviewctl").classList.toggle("hidden", !review);
    $("tabletoggle").classList.toggle("hidden", review || strength);
    $("card-title").textContent = TITLE[view];
    $("grid").classList.toggle("hidden", view !== "preflop" || table);
    $("scale").classList.toggle("hidden", view !== "preflop" || table);
    // The estimate is an outline over the grid, so the table has nothing to put it on.
    $("esttoggle").classList.toggle("hidden", view !== "preflop" || EMBED || state.table);
    $("esttoggle").setAttribute("aria-pressed", state.est);
    $("est").classList.toggle("hidden", view !== "preflop" || table || !state.est || EMBED);
    $("bars").classList.toggle("hidden", view !== "made" || table);
    $("sizing").classList.toggle("hidden", view !== "sizing" || table);
    $("results").classList.toggle("hidden", view !== "results");
    $("lineview").classList.toggle("hidden", view !== LINES_VIEW || table);
    $("table").classList.toggle("hidden", !table);
    $("foldeq").classList.toggle("hidden", view !== "sizing");
    $("review").classList.toggle("hidden", !review);
    $("tagged").classList.toggle("hidden", view !== TAGGED_VIEW);
    $("strength").classList.toggle("hidden", !strength);
    $("tilt").classList.toggle("hidden", view !== "tilt");
    $("timing").classList.toggle("hidden", view !== "timing");
    $("shows").classList.toggle("hidden", view !== "shows");
    $("bounty").classList.toggle("hidden", view !== "bounties" && view !== "nit");
    // The spot tree and the made view's Streets tab draw into boxes of their own,
    // with no grid or table to switch to.
    const madeStreets = view === "made" && state.made === "streets";
    $("tree").classList.toggle("hidden", view !== TREE_VIEW);
    $("treectl").classList.toggle("hidden", view !== TREE_VIEW);
    $("madeseg").classList.toggle("hidden", view !== "made");
    $("streets").classList.toggle("hidden", !madeStreets);
    document.querySelectorAll("[data-made]").forEach(b => b.setAttribute("aria-pressed", b.dataset.made === state.made));
    if (view === TREE_VIEW || madeStreets) for (const id of ["tabletoggle", "table", "bars"]) $(id).classList.add("hidden");
    const gbOn = GB_VIEWS.includes(view) && !EMBED;
    $("groupby").classList.toggle("hidden", !gbOn);
    $("duo").classList.toggle("two", gbOn);
    if (gbOn) scheduleGroupby();
    applyLayout();
    if (strength) { renderStrength(d); return; }
    if (view === SESSION_VIEW) { renderSession(d); return; }
    if (view === TAGGED_VIEW) { renderTagged(d); return; }
    if (review) { renderReview(d, view); return; }
    if (view === "results") { renderResults(d); return; }
    if (view === "tilt") { renderTilt(d); return; }
    if (view === "timing") { renderTiming(d); return; }
    if (view === "shows") { renderShows(d); return; }
    if (view === "bounties" || view === "nit") { renderBounties(d, SIDE_BETS[view]); return; }
    if (view === LINES_VIEW) { renderLines(d, table); return; }
    if (view === TREE_VIEW) { renderTree(d); return; }
    if (madeStreets) { renderStreets(d); return; }
    // Off, paintEstimate takes the fade back off the grid as well as drawing nothing.
    if (view === "preflop") { renderGrid(d); if (estOn()) loadEstimate(); else paintEstimate(); }
    else if (view === "made") renderClassBars($("bars"), d.classes, "", true);
    else renderSizing(d);
    renderTable(d, view);
  }

  // ---- shows without being asked -----------------------------------------------
  // GET /players/{alias}/shows: the hands they turned over when nobody asked. Not
  // hands in a spot, so the spot box leaves them alone. A row lists and replays
  // its one hand. See "Voluntary shows" in SPEC.md.
  const SHOW_CLASSES = ["strong", "marginal", "draw", "air"];
  const SHOW_WORDS = { ahead: "ahead of", chop: "chopping with", behind: "behind" };
  // The pot types the rows carry (`pot`, from Facts.pot_level), and the list's
  // three filters. Kept across renders; a value with no rows falls back to all.
  const SHOW_POTS = { limped: "limped", srp: "SRP", "3bet": "3-bet", "4bet": "4-bet+", other: "bomb pot" };
  const SHOW_KINDS = { strong: "strong", marginal: "marginal", draw: "draw", air: "air", one: "one card" };
  // A shown fold against a winner whose cards are known (`vs`): what they let go.
  const SHOW_VS = { ahead: "folded the best", chop: "folded a chop", behind: "folded behind" };
  const showsPick = { pot: "all", kind: "all", vs: "all" };
  function renderShows(d) {
    const wrap = $("shows");
    wrap.replaceChildren();
    const fv = d.folded_vs;
    setTileKeys("shown unasked ›", "showed air", "showed a strong hand");
    $("t-hands").textContent = d.shows;
    $("t-known").textContent = fmtPct(d.air_pct);
    $("t-cov").textContent = fmtPct(d.strong_pct);
    $("t-raise").textContent = fv.known ? `${fv.ahead} of ${fv.known}` : "–";
    setRaiseKey("folded the best hand", fv.known ? "folds shown against a winner whose cards are known" : "no shown fold with the winner's cards known");
    tileTip("t-known", `${d.classes.air} of ${d.two_card} two-card shows`);
    tileTip("t-cov", `${d.classes.strong} of ${d.two_card} two-card shows`);
    setNote(d.note, `${d.shows} shown of ${d.hands} hands dealt in; ${d.two_card} with both cards, ${d.one_card} with one (counted only).`,
      "The spot box does not narrow shows. Click a row to replay the hand.");
    $("tabletoggle").classList.add("hidden");
    $("table").classList.add("hidden");
    if (!d.shows) { wrap.appendChild(message("never showed a hand unasked")); return; }

    // Each class cell is tinted by its share of the row's two-card shows.
    const t = document.createElement("table");
    const head = document.createElement("tr");
    for (const h of ["how the hand ended", "shows", "1 card", ...SHOW_CLASSES]) head.appendChild(Object.assign(document.createElement("th"), { textContent: h }));
    t.appendChild(head);
    const total = { label: "all", shows: d.shows, one_card: d.one_card, classes: d.classes };
    for (const c of [...d.contexts, total]) {
      if (!c.shows && c !== total) continue;
      const tr = document.createElement("tr");
      if (c === total) tr.className = "total";
      const cell = (v, cls) => { const td = document.createElement("td"); td.textContent = v; if (cls) td.className = cls; tr.appendChild(td); return td; };
      cell(c.label); cell(c.shows); cell(c.one_card || "·", "dim");
      const two = c.shows - c.one_card;
      for (const k of SHOW_CLASSES) {
        const n = c.classes[k];
        if (!n) { cell("·", "dim"); continue; }
        const pct = 100 * n / two;
        const td = cell(n, `share cls-${k}`);
        td.appendChild(Object.assign(document.createElement("small"), { textContent: `${Math.round(pct)}%` }));
        td.style.background = `color-mix(in srgb, var(--c) ${Math.round(pct * 0.6)}%, transparent)`;
        td.title = `${n} of ${two} two-card shows`;
      }
      t.appendChild(tr);
    }
    wrap.appendChild(t);

    const kindOf = (r) => r.class || "one";
    const filters = document.createElement("div");
    filters.className = "showfilters";
    const list = document.createElement("table");
    const lh = document.createElement("tr");
    for (const h of ["hand", "pot", "shown", "how it ended", "board as it stood", "read as", "against the winner"]) lh.appendChild(Object.assign(document.createElement("th"), { textContent: h }));
    const thead = document.createElement("thead"); thead.appendChild(lh); list.appendChild(thead);
    const body = document.createElement("tbody");
    list.appendChild(body);
    wrap.append(filters, list);

    const words = Object.fromEntries(d.contexts.map(c => [c.key, c.label]));
    const vsOf = (r) => r.vs ? r.vs.result : "none";
    const seen = { pot: new Set(d.rows.map(r => r.pot)), vs: new Set(d.rows.map(vsOf)) };
    for (const key of ["pot", "vs"]) if (showsPick[key] !== "all" && !seen[key].has(showsPick[key])) showsPick[key] = "all";
    // A button counts the rows it would show with the other filters as they are.
    const seg = (label, key, labels, of, other) => {
      const box = document.createElement("span");
      box.className = "seg"; box.setAttribute("role", "group"); box.setAttribute("aria-label", label);
      for (const v of ["all", ...Object.keys(labels)]) {
        if (seen[key] && v !== "all" && !seen[key].has(v)) continue;
        const n = d.rows.filter(r => other(r) && (v === "all" || of(r) === v)).length;
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-pressed", showsPick[key] === v);
        b.append(v === "all" ? "all" : labels[v], Object.assign(document.createElement("small"), { textContent: n }));
        b.addEventListener("click", () => { showsPick[key] = v; draw(); });
        box.appendChild(b);
      }
      return box;
    };
    const potOk = (r) => showsPick.pot === "all" || r.pot === showsPick.pot;
    const kindOk = (r) => showsPick.kind === "all" || kindOf(r) === showsPick.kind;
    const vsOk = (r) => showsPick.vs === "all" || vsOf(r) === showsPick.vs;
    const row = (r) => {
      const tr = document.createElement("tr");
      tr.title = `${r.game_id}, hand ${r.hand_number}${r.ts ? " · " + r.ts.slice(0, 16).replace("T", " ") : ""}: click to replay`;
      const cell = (content, cls) => { const td = document.createElement("td"); td.append(content); if (cls) td.className = cls; tr.appendChild(td); return td; };
      cell(`#${r.hand_number}`);
      cell(SHOW_POTS[r.pot] || "", "dim");
      cell(cardsEl(r.cards));
      cell(words[r.context] || r.context, "dim");
      const board = cell(r.board.length ? cardsEl(r.board) : "preflop", r.board.length ? "" : "dim");
      if (r.board.length) board.prepend(Object.assign(document.createElement("span"), { className: "street", textContent: r.street }));
      const made = r.made ? (r.missed ? "missed " : "") + r.made.replace(/_/g, " ") : "";
      cell(Object.assign(document.createElement("span"), {
        className: r.class ? `read cls-${r.class}` : "read",
        textContent: r.class ? `${r.class} · ${made}` : "one card",
      }));
      const vs = cell("", r.vs ? `vs ${r.vs.result}` : "vs");
      if (r.vs) vs.append(`${SHOW_WORDS[r.vs.result]} ${r.vs.you ? "you" : r.vs.player}`, cardsEl(r.vs.cards));
      tr.addEventListener("click", () => {
        openHands(`${d.player}: hand #${r.hand_number}, shown unasked`, [r.hand_id]);
        pntReplay.show($("replay"), r.hand_id);
      });
      return tr;
    };
    const draw = () => {
      const group = (label, box) => { const g = document.createElement("span"); g.append(label, box); return g; };
      filters.replaceChildren(
        group("pot", seg("Pot type", "pot", SHOW_POTS, r => r.pot, r => kindOk(r) && vsOk(r))),
        group("shown", seg("Shown class", "kind", SHOW_KINDS, kindOf, r => potOk(r) && vsOk(r))),
      );
      // Only when some shown fold has a winner to compare against.
      if (seen.vs.size > 1 || !seen.vs.has("none"))
        filters.append(group("after a fold", seg("Against the winner", "vs", SHOW_VS, vsOf, r => potOk(r) && kindOk(r))));
      const rows = d.rows.filter(r => potOk(r) && kindOk(r) && vsOk(r));
      body.replaceChildren(...rows.map(row));
      if (!rows.length) {
        const td = Object.assign(document.createElement("td"), { colSpan: 7, className: "dim", textContent: "no shows match these filters" });
        const tr = document.createElement("tr"); tr.appendChild(td); body.appendChild(tr);
      }
    };
    draw();
  }

  // ---- 7-2 bounties ----------------------------------------------------------
  // GET /bounties: the side bet's board, every player, the one on show marked. A
  // count opens that player's bounty hands; a row switches the chart to them.
  const signed = (n) => (n > 0 ? "+" : "") + n.toLocaleString();
  // The two side-bet boards share one table; this is what each says. GET /nit is
  // /bounties' shape without the 72 half (`hero`).
  const SIDE_BETS = {
    bounties: {
      count: (t) => t.bounties, tiles: ["bounties collected", "chips changed hands", "players"],
      none: "no bounty yet", empty: "no bounty has been paid yet", noun: "a bounty", hands: "bounty hand",
      note: "**Win a pot with 7-2** and everyone at the table pays you.",
    },
    nit: {
      count: (t) => t.penalties, tiles: ["penalties paid", "chips changed hands", "players"],
      none: "no penalty yet", empty: "no Nit penalty has been paid yet", noun: "the Nit penalty", hands: "Nit hand",
      note: "**Last to win a pot** pays everyone else in the Nit.",
    },
  };
  function renderBounties(d, copy = SIDE_BETS.bounties) {
    const wrap = $("bounty");
    wrap.replaceChildren();
    // To a player; with a filter, to their hands in it on the starting-hands grid.
    const go = (player, filter) => {
      $("player").value = player;
      if (filter != null) {
        $("filter").value = filter;
        state.by = "preflop";
        document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === "preflop"));
      }
      apply();
    };
    // A count's hands, listed under the board. The board counts every hand -- PLO
    // and Double Board too -- which the starting-hands grid leaves out.
    const list = (player, filter, title) => {
      $("player").value = player;
      $("filter").value = filter;
      apply();
      openHands(title, null, null, "every");
    };
    setTileKeys(...copy.tiles);
    $("t-hands").textContent = copy.count(d.total).toLocaleString();
    $("t-hands").classList.toggle("down", copy.count(d.total) > 0); // chips paid out
    $("t-known").textContent = d.total.won.toLocaleString();
    $("t-cov").textContent = d.players.length;
    const me = d.players.find(r => r.player === d.player);
    $("t-raise").textContent = me ? signed(me.net.chips) : "–";
    if (me) signTone($("t-raise"), me.net.chips, me.net.bb);
    setRaiseKey(me ? `${d.player}'s net` : "net", me ? `${me.won.count} won · ${me.paid.count} paid` : copy.none);
    $("subtitle").textContent = "every player · all hands";
    setNote(copy.note,
      "A side bet: chips only move between players, so **net** sums to zero."
        + (d.balance ? ` (It is ${signed(d.balance)} off: a payment named someone not dealt in.)` : ""),
      "Click a count for those hands; a row switches the chart to that player.");
    $("tabletoggle").classList.add("hidden");
    $("table").classList.add("hidden");
    if (!d.players.length) wrap.appendChild(message(copy.empty));
    else {
      const t = document.createElement("table");
      const head = document.createElement("tr");
      for (const h of ["player", "won", "chips", "paid", "chips", "net", "net bb", "of hands"]) head.appendChild(Object.assign(document.createElement("th"), { textContent: h }));
      const thead = document.createElement("thead"); thead.appendChild(head); t.appendChild(thead);
      const body = document.createElement("tbody");
      for (const r of d.players) {
        const tr = document.createElement("tr");
        if (r.player === d.player) tr.className = "me";
        const cell = (text, cls) => { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); return td; };
        const count = (side, filter) => {
          const td = cell("");
          const n = r[side].count;
          if (!n || !filter) { td.textContent = n; return; }
          const a = document.createElement("a"); a.href = "#"; a.textContent = n; a.className = "link";
          a.title = `${r.player}'s ${n} hand${n === 1 ? "" : "s"} ${side === "won" ? "won" : "paid"} ${copy.noun} in`;
          a.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); list(r.player, filter, a.title); });
          td.appendChild(a);
        };
        cell(r.player);
        count("won", r.won_filter);
        cell(r.won.chips.toLocaleString(), "dim");
        count("paid", r.paid_filter);
        cell(r.paid.chips.toLocaleString(), "dim");
        cell(signed(r.net.chips), r.net.chips > 0 ? "up" : r.net.chips < 0 ? "down" : "");
        signTone(cell(r.net.bb == null ? "—" : signed(r.net.bb)), r.net.bb);
        const of = cell(r.hands.toLocaleString(), "dim");
        of.title = `${r.bounty_hands} ${copy.hands}${r.bounty_hands === 1 ? "" : "s"} of ${r.hands} dealt in`;
        tr.title = `Switch the chart to ${r.player}`;
        tr.addEventListener("click", () => go(r.player, null));
        body.appendChild(tr);
      }
      t.appendChild(body);
      wrap.appendChild(t);
    }
    // The logs' owners only: anyone else's 72 is seen only when shown.
    for (const h of d.hero || []) {
      const p = document.createElement("p"); p.className = "hero72";
      const link = (text, filter) => {
        if (!filter) return document.createTextNode(text);
        const a = document.createElement("a"); a.href = "#"; a.className = "link"; a.textContent = text;
        a.addEventListener("click", (e) => { e.preventDefault(); go(h.player, filter); });
        return a;
      };
      const own = `${h.hands.toLocaleString()} hands of their own log${h.logs === 1 ? "" : "s"}`;
      if (h.dealt_72) {
        p.append(`${h.player} was `, link(`dealt 72 ${h.dealt_72}×`, h.dealt_filter), " and ",
          link(`played it ${h.played_72}×`, h.played_filter), ` (${h.played_pct}%) in ${own}`);
      } else {
        p.append(`${h.player} wasn't dealt 72 in ${own}`);
      }
      if (h.shown_72) p.append(" · ", link(`showed it ${h.shown_72}× in other logs`, h.shown_filter));
      if (h.known < h.hands) p.append(` · cards known on ${h.known} of ${h.hands}`);
      p.append(".");
      wrap.appendChild(p);
    }
  }

  function setRaiseKey(text, small) {
    $("t-raise-k").replaceChildren();
    $("t-raise-k").append(text + " ");
    const sm = document.createElement("small");
    sm.textContent = small;
    $("t-raise-k").appendChild(sm);
  }

  // The tile captions the range views print; the review views swap in their own.
  // Every tile renderer starts here, so it also clears the last view's hover text.
  function setTileKeys(hands, known, cov) {
    $("t-hands-k").textContent = hands; $("t-known-k").textContent = known; $("t-cov-k").textContent = cov;
    for (const id of ["t-known", "t-cov", "t-raise"]) tileTip(id, "");
    // and the colours the last view put on the figures (signTone, .attn)
    for (const id of ["t-hands", "t-known", "t-cov", "t-raise"]) $(id).classList.remove("up", "down", "soft", "attn");
  }
  // Hover text on the tile around a figure: the ± on a tile that shows a sampled
  // rate. Coverage gets none: it counts these exact hands, it does not estimate.
  function tileTip(id, text) {
    const tile = $(id).parentElement;
    if (text) tile.title = text; else tile.removeAttribute("title");
  }

  function renderRangeTiles(d) {
    setTileKeys("hands in this spot ›", "cards known", "coverage");
    $("t-hands").textContent = d.hands;
    $("t-known").textContent = d.known;
    $("t-cov").textContent = fmtPct(d.coverage);
    const rs = d.raise;
    $("t-raise").textContent = rs ? `${rs.median} bb` : "–";
    setRaiseKey("usual preflop raise", rs
      ? `median · ${rs.mode == null ? "no repeated size" : "mode " + rs.mode} · mean ${rs.mean} · ${rs.min}–${rs.max} · n=${rs.n}`
      : "no raises in this spot");
  }

  function renderSizingTiles(d) {
    setTileKeys("hands in this spot ›", "cards known", "coverage");
    const known = d.blocks.reduce((s, b) => s + b.known, 0);
    // Faced c-bets: only the hands that continued can be shown, so they are the base.
    const base = d.blocks.reduce((s, b) => s + (b.continued ?? b.n), 0);
    $("t-hands").textContent = d.hands;
    $("t-known").textContent = known;
    $("t-cov").textContent = fmtPct(base ? Math.round(1000 * known / base) / 10 : null);
    $("t-raise").textContent = d.spot;
    setRaiseKey(KIND_SPOT[d.kind], `on the ${d.street}`);
  }

  // The rows a review view lists: its own group, minus the flags switched off.
  const reviewRows = (d, view) => d.hands.filter(h =>
    REVIEW_KINDS[view].some(([k]) => k === h.kind) && !state.hide.has(h.kind));

  function renderReviewTiles(d, view) {
    const rows = reviewRows(d, view);
    setTileKeys("hands in this spot ›", "showdowns, every hand shown", "of showdowns shown");
    $("t-hands").textContent = d.examined;
    $("t-known").textContent = d.known_showdowns;
    $("t-cov").textContent = fmtPct(d.showdowns ? Math.round(1000 * d.known_showdowns / d.showdowns) / 10 : null);
    const biggest = Math.max(...rows.map(h => h.pot_bb ?? 0), 0);
    $("t-raise").textContent = rows.length ? `${Math.round(biggest)} bb` : "–";
    // Won or lost: that hand's own net, not the pot's size.
    const top = rows.find(h => (h.pot_bb ?? 0) === biggest);
    if (top) signTone($("t-raise"), top.net_bb, top.net_bb);
    const skipped = d.skipped.stack_unknown ? ` · ${d.skipped.stack_unknown} with a stack unknown` : "";
    setRaiseKey("biggest pot flagged", `${rows.length} flagged · ${d.skipped.cards_unknown} showdowns mucked${skipped}`);
  }

  // Their own hands only: the ones they sat out are listed, never counted.
  function renderSessionTiles(d) {
    setTileKeys("hands dealt", "hands played", "net");
    const mine = d.hands.filter(h => !h.sat_out);
    const net = mine.reduce((s, h) => s + (h.net_bb ?? 0), 0);
    $("t-hands").textContent = mine.length;
    $("t-known").textContent = mine.filter(played).length;
    $("t-cov").textContent = mine.length ? fmtBb(net) : "–";
    if (mine.length) signTone($("t-cov"), net, net);
    $("t-raise").textContent = mine.filter(h => h.flags.length).length;
    $("t-raise").classList.toggle("attn", mine.some(h => h.flags.length));
    const seen = mine.filter(h => h.reviewed).length;
    setRaiseKey("flagged for review", `${seen} of ${mine.length} marked reviewed`);
  }

  // value -> [fillColor, deep?] for the current color mode
  function colorer(d) {
    const cells = Object.values(d.cells).filter(c => c.n > 0);
    if (state.color === "net") {
      const max = Math.max(1, ...cells.map(c => Math.abs(c.net_bb)));
      const B = ramp(BLUE), R = ramp(RED);
      return {
        fill(c) {
          if (c.n === 0) return null;
          const t = Math.sqrt(Math.abs(c.net_bb) / max);
          if (t < 0.05) return "var(--mid)";
          const i = Math.min(6, Math.floor(t * 7));
          return (c.net_bb > 0 ? B : R)[i];
        },
        legend: { left: `−${max.toFixed(0)} bb loss`, right: `+${max.toFixed(0)} bb profit`, steps: [...ramp(RED).slice().reverse(), "var(--mid)", ...ramp(BLUE)] },
      };
    }
    if (state.color === "pfr") {
      // Raise frequency: raised / preflop opportunities, on a fixed 0-100 scale
      // so the same colour means the same percentage on every chart.
      const B = ramp(BLUE);
      return {
        fill(c) {
          if (c.n === 0) return null;
          if (c.raise_pct == null) return "var(--mid)";
          return B[Math.min(6, Math.floor((c.raise_pct / 100) * 7 - 1e-9))];
        },
        legend: { left: "0% raised", right: "100% raised, of preflop decisions", steps: B },
      };
    }
    // raise size, relative to how this player usually sizes in this spot.
    // Gray = at the usual size; red = smaller than usual; blue = larger. The
    // usual size comes from every hand in the spot, shown or not, so it has
    // full coverage. Absolute values live in the tooltip and table. A
    // light->dark ramp on absolute size put a 2bb-opener's whole chart on one
    // step; centring on the median is what makes the exceptions visible.
    const usual = d.raise ? d.raise.median : null;
    const SPAN = 3; // +-3bb from usual reaches the deepest step; beyond saturates
    const B = ramp(BLUE), R = ramp(RED);
    return {
      fill(c) {
        if (c.n === 0) return null;
        if (c.raise_typical == null || usual == null) return "var(--mid)";
        const delta = c.raise_typical - usual;
        if (Math.abs(delta) < 0.25) return "var(--mid)";
        const t = Math.min(1, Math.abs(delta) / SPAN);
        const i = Math.min(6, Math.floor(t * 7 - 1e-9));
        return (delta > 0 ? B : R)[i];
      },
      legend: {
        left: `−${SPAN}bb smaller`,
        right: `+${SPAN}bb larger than usual (${usual == null ? "–" : usual + "bb"})`,
        steps: [...ramp(RED).slice().reverse(), "var(--mid)", ...ramp(BLUE)],
      },
    };
  }

  // Make an element open the hand list for `ids`, or for the spot narrowed by
  // `term`, by click or Enter.
  function pickable(el, title, ids, term = null) {
    el.classList.add("pick");
    const open = () => openHands(title, ids, term);
    el.addEventListener("click", open);
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); open(); } });
  }

  function renderGrid(d) {
    const col = colorer(d);
    const grid = $("grid");
    grid.replaceChildren();
    for (const row of d.rows) {
      for (const label of row) {
        const c = d.cells[label];
        const el = document.createElement("div");
        el.className = "cell";
        el.dataset.hand = label;
        el.tabIndex = 0;
        el.setAttribute("role", "gridcell");
        const l = document.createElement("span"); l.className = "l"; l.textContent = label;
        const n = document.createElement("span"); n.className = "n";
        n.textContent = state.color === "pfr" ? (c.raise_pct == null ? "–" : Math.round(c.raise_pct) + "%")
          : state.color === "size" ? (c.raise_typical == null ? "–" : c.raise_typical)
          : c.n;
        el.append(l, n);
        const f = col.fill(c);
        if (!f) el.classList.add("empty");
        else { el.style.background = f; const k = inkClass(f); if (k) el.classList.add(k); }
        if (c.n > 0) pickable(el, `${label} · shown ${c.n}×`, c.hand_ids);
        el.setAttribute("aria-label", tipText(label, c).join(", "));
        el.addEventListener("pointermove", (ev) => showTip(ev, label, c));
        el.addEventListener("pointerleave", hideTip);
        el.addEventListener("focus", (ev) => showTip(ev, label, c));
        el.addEventListener("blur", hideTip);
        grid.appendChild(el);
      }
    }
    const s = $("scale");
    s.replaceChildren();
    const left = document.createElement("span"); left.textContent = col.legend.left;
    const bar = document.createElement("span"); bar.className = "bar";
    for (const hex of col.legend.steps) { const i = document.createElement("i"); i.style.background = hex; bar.appendChild(i); }
    const right = document.createElement("span"); right.textContent = col.legend.right;
    const note = document.createElement("span"); note.style.marginLeft = "auto"; note.style.color = "var(--muted)";
    note.textContent = state.color === "size"
      ? "outlined = never shown · grey = sized as usual · click a hand to list it"
      : "outlined cells were never shown in this spot · click a hand to list it";
    s.append(left, bar, right, note);
  }

  function tipText(label, c) {
    if (c.n === 0) return [label, "never shown in this spot"];
    const out = [`${label}: shown ${c.n}×`, `net ${fmtBb(c.net_bb)}`, `won ${c.won} of ${c.n}`,
      c.pf_opp ? `raised ${c.pfr} of ${c.pf_opp} preflop decisions (${c.raise_pct}%)` : "no preflop decision"];
    if (c.raise) out.push(`typically ${c.raise_typical}bb (${BASIS[c.raise_basis]}), median ${c.raise.median}, mean ${c.raise.mean}, ${c.raise.min}–${c.raise.max} of ${c.raise.n}`);
    return out;
  }

  function showTip(ev, label, c) {
    const tip = $("tip");
    tip.replaceChildren();
    const big = document.createElement("div"); big.className = "big";
    big.textContent = c.n === 0 ? label : `${c.n}× ${label}`;
    tip.appendChild(big);
    const rows = c.n === 0 ? [["never shown in this spot", ""]] : [
      ["net", fmtBb(c.net_bb)],
      ["won", `${c.won} / ${c.n}`],
      ["raised", c.pf_opp ? `${c.pfr} / ${c.pf_opp} (${c.raise_pct}%)` : "no decision"],
      ...(c.raise ? [
        ["typical raise", c.raise_typical == null ? "–" : `${c.raise_typical} bb`],
        ["from", BASIS[c.raise_basis]],
        ["raise median", `${c.raise.median} bb`],
        ["mode", c.raise.mode == null ? "none repeats" : `${c.raise.mode} bb`],
        ["mean", `${c.raise.mean} bb`],
        ["min – max", `${c.raise.min} – ${c.raise.max}`],
        ["raised", `${c.raise.n} of ${c.n}`],
      ] : [["raised", "0 of " + c.n]]),
    ];
    const weight = estWeight(label);
    if (weight != null) rows.push(["estimate", weight ? `${Math.round(100 * weight)}% of its combos` : "outside"]);
    for (const [k, v] of rows) {
      const r = document.createElement("div"); r.className = "row";
      const kk = document.createElement("span"); kk.textContent = k;
      const vv = document.createElement("b"); vv.append(k === "net" ? toned(v, c.net_bb) : v);
      r.append(kk, vv); tip.appendChild(r);
    }
    tip.style.display = "block";
    const rect = (ev.currentTarget || ev.target).getBoundingClientRect();
    const x = ev.clientX ?? rect.right, y = ev.clientY ?? rect.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
    tip.style.top = Math.min(y + 14, innerHeight - h - 8) + "px";
  }
  function hideTip() { $("tip").style.display = "none"; }

  // Made-hand bars into `bars`. `context` prefixes the hand list's title. In the
  // made view a bar lists its hands through its `made=` term; a sizing block's
  // bars list by ids, since the term alone does not say the bet size.
  function renderClassBars(bars, classes, context, byTerm = false) {
    bars.replaceChildren();
    if (!classes.length) {
      const p = document.createElement("div"); p.className = "lab"; p.textContent = "no shown hands in this spot";
      bars.appendChild(p); return;
    }
    const max = Math.max(...classes.map(c => c.pct));
    for (const { c, text } of classRows(classes)) {
      const term = byTerm ? madeTerm(c) : null;
      const title = `${context}${text} · shown ${c.n}×` + (term ? ` · ${term}` : "");
      const lab = document.createElement("div"); lab.className = "lab";
      lab.textContent = text;
      lab.tabIndex = 0; lab.setAttribute("role", "button");
      pickable(lab, title, term ? null : c.hand_ids, term);
      const track = document.createElement("div"); track.className = "track";
      const fill = document.createElement("div"); fill.className = "fill";
      fill.style.width = (c.pct / max * 100) + "%";
      track.appendChild(fill);
      pickable(track, title, term ? null : c.hand_ids, term);
      const val = document.createElement("div"); val.className = "val";
      val.textContent = fmtPct(c.pct);
      const sm = document.createElement("small"); sm.append(`${c.n} · `, toned(fmtBb(c.net_bb), c.net_bb));
      val.appendChild(sm);
      bars.append(lab, track, val);
    }
  }

  function blockSummary(d, b) {
    const parts = [`${b.n}× · ${fmtPct(b.pct)} of ${KIND_SPOT[d.kind]}`];
    if (d.kind === "faced_cbet" && b.n) parts.push(`fold ${fmtPct(b.fold)} · call ${fmtPct(b.call)} · raise ${fmtPct(b.raise)}`);
    if (b.n) parts.push(`${b.known} shown (${fmtPct(b.coverage)})`);
    return parts.join(" · ");
  }

  function renderSizing(d) {
    renderFoldEquity(d);
    const wrap = $("sizing");
    wrap.replaceChildren();
    if (!d.spot) {
      const p = document.createElement("p"); p.className = "muted";
      p.textContent = `no ${KIND_SPOT[d.kind]} on the ${d.street} in this spot`;
      wrap.appendChild(p); return;
    }
    for (const b of d.blocks) {
      const block = document.createElement("div"); block.className = "block" + (b.n ? "" : " none");
      const h = document.createElement("h3");
      const name = document.createElement("span"); name.textContent = SIZE_LABEL[b.size];
      const sm = document.createElement("small"); sm.textContent = blockSummary(d, b);
      h.append(name, sm);
      if (b.n) {
        const btn = document.createElement("button"); btn.type = "button"; btn.textContent = `${b.n} hands ›`;
        btn.addEventListener("click", () => openHands(`${d.street} ${KIND_SPOT[d.kind]} · ${SIZE_LABEL[b.size]}`, b.hand_ids));
        h.appendChild(btn);
      }
      block.appendChild(h);
      if (b.n) {
        const bars = document.createElement("div"); bars.className = "bars";
        renderClassBars(bars, b.classes, `${SIZE_LABEL[b.size]} · `);
        block.appendChild(bars);
      }
      wrap.appendChild(block);
    }
  }

  // The preflop table: the essentials per hand, with search, a minimum and a sort.
  // The raise sizes' spread (median, mean, min, max) is on the size's hover.
  const PF_COLS = [
    ["hand", "hand", "", null],
    ["n", "shown", "times shown", (c) => c.n],
    ["net", "net bb", "big blinds won or lost", (c) => c.net_bb],
    ["per", "bb/hand", "net bb per hand shown", (c) => c.net_bb / c.n],
    ["won", "won %", "share of these hands they won", (c) => 100 * c.won / c.n],
    ["raise", "raise %", "raised when they had the choice", (c) => c.raise_pct],
    ["size", "raise bb", "their usual preflop raise, in bb; hover for the spread", (c) => c.raise_typical],
  ];
  const pfTable = { q: "", min: 1, sort: "n", dir: -1 };
  // A class as two cards: one suit when suited, black and red when not, so
  // T9s reads 10♠9♠ and T9o 10♠9♥.
  const classCards = (label) => `${label[0]}s${label[1]}${label[2] === "s" ? "s" : "h"}`;
  // "a s" is suited aces, "kq" both KQ, "pair" the pairs: every word must match.
  const pfMatch = (label, q) => q.toLowerCase().split(/[\s,]+/).filter(Boolean).every((w) =>
    w === "pair" || w === "pairs" ? label.length === 2 : label.toLowerCase().includes(w));

  function renderPreflopTable(wrap, d) {
    const ctl = document.createElement("div"); ctl.className = "tbl-ctl";
    const q = document.createElement("input");
    q.type = "search"; q.placeholder = "search: a s · kq · pair · o"; q.value = pfTable.q;
    q.setAttribute("aria-label", "Search hands");
    const min = document.createElement("input");
    min.type = "number"; min.min = "1"; min.value = pfTable.min; min.setAttribute("aria-label", "Minimum shown");
    const minLabel = document.createElement("label"); minLabel.append("min shown ", min);
    const count = document.createElement("span"); count.className = "dim";
    ctl.append(q, minLabel, count);

    const t = document.createElement("table");
    const head = document.createElement("tr");
    const body = document.createElement("tbody");
    const order = Object.keys(d.cells); // chart order, for the hand column's sort
    const fmt = { net: (v) => v.toFixed(1), per: (v) => (v >= 0 ? "+" : "") + v.toFixed(2), won: (v) => v.toFixed(0) };
    for (const [key, text, tip] of PF_COLS) {
      const th = document.createElement("th");
      th.textContent = text + (pfTable.sort === key ? (pfTable.dir < 0 ? " ▾" : " ▴") : "");
      if (tip) th.title = tip;
      th.className = "sortable";
      th.addEventListener("click", () => {
        pfTable.dir = pfTable.sort === key ? -pfTable.dir : key === "hand" ? 1 : -1;
        pfTable.sort = key;
        wrap.replaceChildren();
        renderPreflopTable(wrap, d);
      });
      head.appendChild(th);
    }
    t.append(head, body);

    const fill = () => {
      const col = PF_COLS.find(([k]) => k === pfTable.sort);
      const val = col[3] ?? ((_, label) => order.indexOf(label));
      const rows = Object.entries(d.cells)
        .filter(([label, c]) => c.n >= pfTable.min && pfMatch(label, pfTable.q))
        .sort(([la, a], [lb, b]) => {
          const x = val(a, la), y = val(b, lb);
          if (x == null || y == null) return (x == null) - (y == null); // blanks last
          return pfTable.dir * (x - y) || b.n - a.n;
        });
      body.replaceChildren();
      for (const [label, c] of rows) {
        const tr = document.createElement("tr");
        for (const [key, , , get] of PF_COLS) {
          const td = document.createElement("td");
          const v = get ? get(c) : label;
          if (key === "hand") {
            td.title = label;
            td.appendChild(cardsEl(classCards(label)));
          } else td.textContent = v == null ? "–" : fmt[key] ? fmt[key](v) : v;
          if (key === "size" && c.raise) {
            td.title = `${BASIS[c.raise_basis]} · median ${c.raise.median} · mean ${c.raise.mean}`
              + ` · ${c.raise.min}–${c.raise.max} bb`;
          }
          if ((key === "net" || key === "per") && v) td.className = v > 0 ? "up" : "down";
          tr.appendChild(td);
        }
        tr.tabIndex = 0;
        tr.setAttribute("role", "button");
        tr.setAttribute("aria-label", `${label} · shown ${c.n}× — list these hands`);
        pickable(tr, `${label} · shown ${c.n}×`, c.hand_ids, null);
        body.appendChild(tr);
      }
      count.textContent = `${rows.length} hands`;
    };
    q.addEventListener("input", () => { pfTable.q = q.value; fill(); });
    min.addEventListener("input", () => { pfTable.min = Math.max(1, Number(min.value) || 1); fill(); });
    fill();
    wrap.append(ctl, t);
    const hint = document.createElement("p");
    hint.className = "note";
    hint.style.margin = "10px 0 0";
    hint.textContent = "click a header to sort, a row to list its hands";
    wrap.appendChild(hint);
  }

  function renderTable(d, view) {
    const wrap = $("table");
    wrap.replaceChildren();
    if (view === "preflop") { renderPreflopTable(wrap, d); return; }
    const t = document.createElement("table");
    const head = document.createElement("tr");
    const faced = view === "sizing" && d.kind === "faced_cbet";
    const cols = view === "made" ? ["class", "% of known", "n", "net bb", "won"]
      : ["size", "n", `% of ${KIND_SPOT[d.kind]}`, ...(faced ? ["fold", "call", "raise"] : []), "shown", "coverage"];
    for (const c of cols) { const th = document.createElement("th"); th.textContent = c; head.appendChild(th); }
    t.appendChild(head);
    // Every row stands for a set of hands, so clicking one lists them -- the
    // same drill-down the grid cells and bars have. Without it the table is the
    // one view you cannot get from a number back to the hands behind it.
    const row = (vals, { title = null, ids = null, term = null } = {}) => {
      const tr = document.createElement("tr");
      vals.forEach((v) => { const td = document.createElement("td"); td.textContent = v ?? "–"; tr.appendChild(td); });
      if (ids?.length) {
        tr.tabIndex = 0;
        tr.setAttribute("role", "button");
        tr.setAttribute("aria-label", `${title} — list these hands`);
        pickable(tr, title, term ? null : ids, term);
      }
      t.appendChild(tr);
      return tr;
    };
    if (view === "made") {
      for (const { c, text } of classRows(d.classes)) {
        const term = madeTerm(c);
        const tr = row([text, fmtPct(c.pct), c.n, fmtBb(c.net_bb).replace(" bb", ""), c.won],
          { title: `${text} · shown ${c.n}×` + (term ? ` · ${term}` : ""), ids: c.hand_ids, term });
        signTone(tr.cells[3], c.net_bb);
      }
    } else {
      for (const b of d.blocks) {
        row([SIZE_LABEL[b.size], b.n, fmtPct(b.pct),
          ...(faced ? [fmtPct(b.fold), fmtPct(b.call), fmtPct(b.raise)] : []),
          b.known, fmtPct(b.coverage)],
          { title: `${d.street} ${KIND_SPOT[d.kind]} · ${SIZE_LABEL[b.size]}`, ids: b.hand_ids });
      }
    }
    wrap.appendChild(t);
    const hint = document.createElement("p");
    hint.className = "note";
    hint.style.margin = "10px 0 0";
    hint.textContent = "click a row to list the hands behind it, then a hand to replay it";
    wrap.appendChild(hint);
  }

  // ---- hand list and replay ------------------------------------------------
  const HAND_LIMIT = 300;

  // The hands in the spot, or in the spot narrowed by one more `term`.
  async function handRows(term = null, scope = null) {
    const filter = [state.filter, term].filter(Boolean).join(",");
    // The hands the tab counted, so the list agrees with the tile it opened from.
    const games = scope || scopeOf(state.by);
    const key = `${state.player}|${filter}|${games}`;
    if (state.handRows?.key === key) return state.handRows.rows;
    const q = new URLSearchParams({ games });
    if (filter) q.set("filter", filter);
    const asked = loadSeq;
    const body = await getJson(`/players/${encodeURIComponent(state.player)}/hands?` + q);
    // Checked before caching, so a stale answer is never memoized for the session.
    if (body.hands.length && !("ip" in body.hands[0])) {
      throw new Error("the running server is older than this page: restart `pnt service`");
    }
    // A load since this was asked may mean new hands: these rows are kept for
    // this list only, not for the next one.
    if (asked === loadSeq) state.handRows = { key, rows: body.hands };
    return body.hands;
  }

  // Bumped by every open and close of the list: a cell clicked after another, or
  // the list closed by a new spot or view, outdates the rows still being fetched.
  let handsSeq = 0;
  // `ids` picks rows out of the spot's hands; `term` instead lists the spot
  // narrowed by that filter term, so the list is what the term finds.
  async function openHands(title, ids, term = null, scope = null) {
    const seq = ++handsSeq;
    $("hands").classList.remove("hidden");
    $("hands-title").textContent = title;
    $("hands-count").textContent = "";
    resetReplay($("replay"), true);
    applyLayout();
    const list = $("hand-rows");
    list.replaceChildren(message("loading…"));
    state.handIds = ids; // remembered so a change of order re-lists the same set
    state.handTerm = term;
    state.handScope = scope;
    try {
      const rows = await handRows(term, scope);
      if (seq !== handsSeq) return;
      const want = ids ? new Set(ids) : null;
      renderHandRows(want ? rows.filter(r => want.has(r.hand_id)) : rows);
    } catch (e) {
      if (seq !== handsSeq) return;
      list.replaceChildren(message(String(e.message || e), "err"));
    }
    $("hands").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function message(text, cls = "muted") {
    const p = document.createElement("p"); p.className = cls; p.textContent = text; return p;
  }

  // The row has one line; the tooltip is where "who was I facing" is spelled out.
  function handTitle(h) {
    const bits = [[h.game_id, `${h.players} dealt in`, h.ts].filter(Boolean).join(" · ")];
    if (h.ip != null) {
      bits.push((h.ip ? "in position" : "out of position")
        + (h.pos_players > 2 ? ` · acts ${h.pos_order + 1} of ${h.pos_players} postflop` : ""));
    }
    if (h.sat_out) bits.push("not dealt in · played by " + h.vs.join(", "));
    else if (h.vs?.length) bits.push("vs " + h.vs.join(", "));
    for (const [st, who] of Object.entries(h.vs_cbet || {})) bits.push(`${st}: ${who} c-bet at them`);
    for (const [st, who] of Object.entries(h.led_into || {})) bits.push(`${st}: could lead into ${who}`);
    return bits.join("\n");
  }

  // Chips first, since that is what the filter takes; blinds alongside when known.
  const fmtPot = (h) => h.bb ? `${h.pot.toLocaleString()} (${Math.round(h.pot / h.bb)}bb)` : h.pot.toLocaleString();

  function renderHandRows(rows) {
    const list = $("hand-rows");
    list.replaceChildren();
    // The server lists newest first; "biggest pot" reorders that, ties newest first.
    if (state.handSort === "pot") rows = [...rows].sort((a, b) => (b.pot ?? -1) - (a.pot ?? -1));
    $("hands-count").textContent = rows.length > HAND_LIMIT
      ? `${state.handSort === "pot" ? "biggest" : "newest"} ${HAND_LIMIT} of ${rows.length}`
      : `${rows.length} hand${rows.length === 1 ? "" : "s"}`;
    if (!rows.length) { list.appendChild(message("no hands")); return; }
    // Each with the review rows' ✎, so a hand found by drilling in can be written
    // on where it was found. Rows from a server too old to send notes get none.
    for (const h of rows.slice(0, HAND_LIMIT)) {
      const row = handRowButton(h, list, $("replay"));
      list.appendChild("note" in h ? reviewedRow(h, row, { noteOnly: true }) : row);
    }
  }

  // One hand as a row: the drill-down list and the review views both build them
  // here, so the two can never drift. `opts.kind`, `opts.vs`, `opts.sizes` and
  // `opts.why` let a review row say what it was flagged for.
  function handRowButton(h, list, replayBox, opts = {}) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "hand-row"; b.setAttribute("aria-pressed", "false");
    const span = (cls, text) => { const s = document.createElement("span"); s.className = cls; s.append(text); b.appendChild(s); return s; };
    if (opts.kind) {
      const k = span("kind", opts.kind.text);
      k.dataset.group = opts.kind.group;
      if (opts.kind.title) k.title = opts.kind.title;
    }
    span("num", `#${h.hand_number}`);
    // Whether they closed the action, not where they sat: every postflop stat
    // on these pages is defined against an aggressor, not against a seat.
    span("pos", h.ip == null ? "–" : h.ip ? "IP" : "OOP");
    // One name plus a count. The row is a wrapping flexbox and three names
    // break it; the full list is in the tooltip. A review row adds the
    // villain's cards when they were shown.
    const vs = opts.vs ?? (h.vs?.length ? { name: `vs ${h.vs[0]}${h.vs.length > 1 ? ` +${h.vs.length - 1}` : ""}` } : null);
    const vsEl = span("vs", "");
    if (vs) {
      const n = document.createElement("span"); n.className = "vn"; n.textContent = vs.name;
      vsEl.appendChild(n);
      if (vs.cards) vsEl.appendChild(cardsEl(vs.cards));
    }
    span("hole", h.hole_cards ? cardsEl(h.hole_cards) : h.sat_out ? "sat out" : "?? ??");
    if (h.sat_out) b.dataset.satOut = "";
    const boardEl = span("board", h.board.length ? cardsEl(h.board) : "no flop");
    // Double Board: the second board under the first.
    if (h.board2?.length) boardEl.append(document.createElement("br"), cardsEl(h.board2));
    span("pot", h.pot == null ? "" : `pot ${fmtPot(h)}`);
    span("sizes", opts.sizes ?? Object.entries(h.bet_size).map(([s, z]) => `${s} ${SHORT_SIZE[z]}`).join(" · "));
    signTone(span("net", h.net_bb == null ? "–" : fmtBb(h.net_bb)), h.net_bb);
    if (opts.why) span("why", opts.why);
    b.title = handTitle(h) + (opts.title ? "\n" + opts.title : "");
    b.addEventListener("click", () => {
      list.querySelectorAll(".hand-row").forEach(x => x.setAttribute("aria-pressed", x === b));
      pntReplay.show(replayBox, h.hand_id);
    });
    return b;
  }

  // Newest is the server's order; the others sort that, ties staying newest first.
  function orderReview(rows, view) {
    const order = orderOf(view);
    // Hand order is the order it was dealt: one game, so the hand number is enough.
    if (order === "hand") return [...rows].sort((a, b) => a.hand_number - b.hand_number);
    if (order === "pot") return [...rows].sort((a, b) => (b.pot_bb ?? b.pot ?? -1) - (a.pot_bb ?? a.pot ?? -1));
    if (order === "swing") return [...rows].sort((a, b) => Math.abs(b.diff_bb ?? b.net_bb ?? 0) - Math.abs(a.diff_bb ?? a.net_bb ?? 0));
    return rows;
  }

  // What the row's "sizes" slot says for each flag.
  function reviewDetail(h) {
    const pct = (x) => `${Math.round(x * 100)}%`;
    if (h.kind === "failed_bluff") {
      const size = h.bluff_size ? SHORT_SIZE[h.bluff_size] : h.bluff_pot != null ? `${pct(h.bluff_pot)} pot` : "";
      return [`${h.bluff_kind} ${h.street}`, size, h.answer].filter(Boolean).join(" · ");
    }
    if (h.equity != null && h.street !== "river") return `${pct(h.equity)} to win on the ${h.street}`;
    return [h.eff_bb != null ? `${Math.round(h.eff_bb)}bb deep` : "", h.spr != null ? `SPR ${h.spr}` : ""].filter(Boolean).join(" · ");
  }

  function reviewTitle(h) {
    const bits = [];
    if (h.eff_bb != null) bits.push(`effective ${Math.round(h.eff_bb)}bb` + (h.spr != null ? `, SPR ${h.spr} on the flop` : ""));
    for (const v of h.villains) {
      const profile = [v.archetype, v.wtsd_pct != null ? `WTSD ${v.wtsd_pct}%` : null,
        v.folds_river_pct != null ? `folds to river bets ${v.folds_river_pct}%` : null].filter(Boolean).join(", ");
      const range = v.uncapped == null ? "" : v.uncapped ? " · bet or raised earlier: uncapped" : " · only called before: capped";
      bits.push(`${v.player}${v.cards ? " " + pretty(v.cards) : ""}${v.made ? ` (${v.made.label})` : ""}${profile ? " · " + profile : ""}${range}`);
    }
    return bits.join("\n");
  }

  function renderReview(d, view) {
    // Flag chips for this view, each with its count; pressed means listed.
    const chips = $("review-kinds");
    chips.replaceChildren();
    for (const [kind, label] of REVIEW_KINDS[view]) {
      const b = document.createElement("button"); b.type = "button";
      b.dataset.kind = kind;
      b.setAttribute("aria-pressed", !state.hide.has(kind));
      b.title = flagRule(kind, d.thresholds);
      b.append(label);
      const n = document.createElement("small"); n.textContent = d.counts[kind]; b.appendChild(n);
      b.addEventListener("click", () => {
        if (state.hide.has(kind)) state.hide.delete(kind); else state.hide.add(kind);
        writeUrl(); render();
      });
      chips.appendChild(b);
    }
    syncListControls(view);
    renderRules(d, view);

    const all = reviewRows(d, view);
    const rows = orderReview(listedReview(all), view);
    const list = $("review-rows");
    list.replaceChildren();
    resetReplay();
    setReviewCount();
    if (!rows.length) {
      const hidden = state.hideSeen && all.length;
      list.appendChild(message(hidden ? "every flagged hand here is reviewed" : "nothing flagged in this spot"));
      return;
    }
    for (const h of rows.slice(0, HAND_LIMIT)) {
      const v = h.villains[0];
      const row = handRowButton(h, list, $("review-replay"), {
        kind: { text: KIND_LABEL[h.kind], group: h.group, title: flagRule(h.kind, d.thresholds) },
        vs: v ? { name: `vs ${v.player}${h.villains.length > 1 ? ` +${h.villains.length - 1}` : ""}`, cards: v.cards } : null,
        sizes: reviewDetail(h),
        why: h.why,
        title: reviewTitle(h),
      });
      list.appendChild(reviewedRow(h, row));
    }
  }

  // The rule behind each flag on show, so a row reads as "this rule fired", not as
  // a judgement. Air gets its own line once a flag that reads it is listed.
  function renderRules(d, view) {
    const box = $("review-rules");
    box.replaceChildren();
    if (!d?.thresholds) return;
    const shown = REVIEW_KINDS[view].filter(([k]) => !state.hide.has(k));
    for (const [kind, label] of shown) {
      const dt = document.createElement("dt"); dt.textContent = label;
      const dd = document.createElement("dd"); dd.textContent = flagRule(kind, d.thresholds);
      box.append(dt, dd);
    }
    if (shown.some(([k]) => k === "missed_bluff" || k === "failed_bluff")) {
      const dd = document.createElement("dd"); dd.className = "lead"; dd.textContent = AIR_RULE;
      box.append(dd);
    }
  }

  // The controls every list view shares, set for this one: the orders it offers,
  // and the session picker only where there is a session.
  function syncListControls(view) {
    const sort = $("review-sort");
    [...sort.options].forEach(o => { o.hidden = o.disabled = !ORDERS[view].includes(o.value); });
    sort.value = orderOf(view);
    const session = view === SESSION_VIEW;
    $("session-game").classList.toggle("hidden", !session);
    $("session-played").classList.toggle("hidden", !session);
    $("session-played").setAttribute("aria-pressed", state.played);
    $("session-sat").classList.toggle("hidden", !session);
    $("session-sat").setAttribute("aria-pressed", state.satOut);
    $("session-sat").disabled = !!state.filter;
    $("session-sat").title = state.filter
      ? "a filter keeps to the hands they played: clear it to see the ones they sat out"
      : "also list the hands of this session they were not dealt into";
  }

  // A hand counts as played when they put chips in by choice or saw a flop; a
  // flagged hand -- by a rule or with 🚩 -- is always listed, whatever it was, and
  // so is one they sat out (Sat out is the switch for those).
  const played = (h) => !h.sat_out && (h.vpip || h.saw_flop);
  const sessionRows = (d) => d.hands.filter(h => h.sat_out || !state.played || played(h) || h.flags.length || h.flagged);
  const listRows = (view) => view === SESSION_VIEW ? sessionRows(state.data)
    : view === TAGGED_VIEW ? state.data.hands : reviewRows(state.data, view);

  function renderSession(d) {
    $("review-kinds").replaceChildren(); $("review-rules").replaceChildren();
    syncListControls(SESSION_VIEW);
    const all = sessionRows(d);
    const rows = orderReview(listedReview(all), SESSION_VIEW);
    const list = $("review-rows");
    list.replaceChildren();
    resetReplay();
    setReviewCount();
    if (!rows.length) {
      list.appendChild(message(!state.game ? "no sessions for this player"
        : state.hideSeen && all.length ? "every hand here is reviewed"
        : d.hands.length ? "no hands played in this spot — turn off Played only" : "no hands in this spot"));
      return;
    }
    for (const h of rows.slice(0, HAND_LIMIT)) {
      const f = h.flags[0];
      // A hand they sat out names who played it and who won, in place of their own result.
      const away = h.sat_out ? {
        vs: { name: h.vs.length > 2 ? `${h.vs[0]} +${h.vs.length - 1}` : h.vs.join(" · ") },
        sizes: h.winner ? `${h.winner} won${h.winner_bb != null ? ` ${h.winner_bb} bb` : ""}` : "",
      } : {};
      const row = handRowButton(h, list, $("review-replay"), {
        ...away,
        kind: f ? { text: f.label, group: f.group } : h.flagged ? { text: "Flagged", group: "manual" } : null,
        why: h.flags.map(x => x.why).filter(Boolean).join(" · ") || undefined,
        title: h.flags.length > 1 ? "flagged: " + h.flags.map(x => x.label).join(", ") : "",
      });
      list.appendChild(reviewedRow(h, row));
    }
  }

  // ---- tagged ------------------------------------------------------------------
  // GET /tagged: the hands you tagged, in the list views' rows, one tag at a time
  // (none picked: every tagged hand). The chips above the list are this player's
  // tags in the spot with their counts, the 🚩 first as `flagged`. A tag added or
  // removed anywhere on the page (a row's box, the replay's) is followed: the rows
  // carry it at once, and this view asks again for its counts. See SPEC.md, "Saved
  // spots and hand tags".
  async function loadTagged(quiet, live) {
    const key = `${state.player}|${state.filter}|${state.tag}`;
    if (!quiet && state.tagged?.key === key) return state.tagged.data;
    const q = new URLSearchParams({ player: state.player });
    if (state.filter) q.set("filter", state.filter);
    if (state.tag) q.set("tag", state.tag);
    const data = await getJson("/tagged?" + q);
    if (live()) state.tagged = { key, data };
    return data;
  }

  function renderTaggedTiles(d) {
    setTileKeys(d.tag ? `tagged ${d.tag}` : "hands tagged", "marked reviewed", "net");
    const rows = d.hands;
    const net = rows.reduce((s, h) => s + (h.net_bb ?? 0), 0);
    $("t-hands").textContent = rows.length;
    $("t-hands").classList.toggle("attn", rows.length > 0);
    const seen = rows.filter(h => h.reviewed).length;
    $("t-known").textContent = seen;
    signTone($("t-known"), seen); // done with, in the profit green
    $("t-cov").textContent = rows.length ? fmtBb(net) : "–";
    if (rows.length) signTone($("t-cov"), net, net);
    $("t-raise").textContent = d.tags.filter(t => !t.builtin && t.hands).length;
    setRaiseKey("tags in this spot", `${rows.filter(h => h.note).length} with a note`);
  }

  function renderTagged(d) {
    $("review-kinds").replaceChildren(); $("review-rules").replaceChildren();
    renderTagChips(d);
    syncListControls(TAGGED_VIEW);
    const all = d.hands;
    const rows = orderReview(listedReview(all), TAGGED_VIEW);
    const list = $("review-rows");
    list.replaceChildren();
    resetReplay();
    setReviewCount();
    if (!rows.length) {
      list.appendChild(message(state.hideSeen && all.length ? "every tagged hand here is reviewed"
        : state.filter ? "nothing tagged in this spot" : state.tag ? `no hand of theirs is tagged ${state.tag}` : "nothing tagged yet"));
      return;
    }
    for (const h of rows.slice(0, HAND_LIMIT)) list.appendChild(reviewedRow(h, handRowButton(h, list, $("review-replay"))));
  }

  function renderTagChips(d) {
    const pick = $("tagged");
    pick.replaceChildren();
    for (const t of d.tags) {
      const b = document.createElement("button"); b.type = "button";
      b.append(t.builtin ? "🚩 flagged" : t.tag);
      if (t.builtin) { b.dataset.builtin = ""; b.title = "the hands you flagged 🚩"; }
      else b.title = `tag=${t.tag}`;
      const n = document.createElement("small"); n.textContent = t.hands; b.appendChild(n);
      b.setAttribute("aria-pressed", String(state.tag === t.tag));
      // Clicking the tag on show goes back to every tagged hand.
      b.addEventListener("click", () => { state.tag = state.tag === t.tag ? "" : t.tag; writeUrl(); load(); });
      pick.appendChild(b);
    }
    if (d.tags.length < 2) pick.appendChild(message("no tags yet: type one in the + tag box under a hand"));
  }

  // A write from any tag box: every cached row of that hand takes the new tags.
  // On the tagged view the counts are asked for again; the list is redrawn only
  // when a hand joined or left it, so a box being typed in and an open replay stay.
  document.addEventListener("pnt-tags", async (e) => {
    const { game_id, hand_number, tags } = e.detail;
    for (const hands of new Set([state.data?.hands, state.review?.data.hands, state.session?.data.hands,
      state.tagged?.data.hands, state.handRows?.rows])) {
      if (!Array.isArray(hands)) continue;
      for (const h of hands) if (h.game_id === game_id && h.hand_number === hand_number) h.tags = tags;
    }
    if (state.by !== TAGGED_VIEW || state.dataView !== TAGGED_VIEW) { state.tagged = null; return; }
    const seq = loadSeq;
    const shown = state.data;
    try {
      state.tagged = null;
      const fresh = await loadTagged(false, () => seq === loadSeq);
      if (seq !== loadSeq || state.data !== shown) return;
      const ids = (d) => d.hands.map(h => h.hand_id).join(",");
      if (ids(fresh) !== ids(shown)) { state.data = fresh; render(); return; }
      shown.tags = fresh.tags;
      renderTagChips(shown);
      renderTaggedTiles(shown);
    } catch (err) {
      showErr(err);
    }
  });

  // ---- side by side ------------------------------------------------------
  // In the split layout the replay pane is always there, so the right half does
  // not collapse before a hand is picked.
  // `box` and `shown` default to the review views'; the drill-down list passes
  // its own pane, shown whenever the list is.
  function resetReplay(box = $("review-replay"), shown = isListView(state.by)) {
    pntReplay.cancel(box); // the rows are new: a replay still loading is for one of the old
    if (state.split && shown) {
      box.classList.remove("hidden");
      box.dataset.empty = ""; // pntReplay.show clears it
      box.replaceChildren(message("click a hand to replay it · ↑ ↓ to step through"));
    } else {
      box.classList.add("hidden");
    }
  }

  function applyLayout() {
    const split = state.split && isListView(state.by);
    const handsSplit = state.split && !$("hands").classList.contains("hidden");
    $("review").classList.toggle("split", split);
    $("hands").classList.toggle("split", handsSplit);
    $("review-split").setAttribute("aria-pressed", state.split);
    $("hands-split").setAttribute("aria-pressed", state.split);
  }

  // ---- marking a hand reviewed, and noting what went wrong ----------------
  // Both are on the hand, and it is the server that holds them: a click or a
  // typed note is not believed until the write comes back. See SPEC.md, "Marking
  // a hand reviewed, and writing down what went wrong", and schema.sql for why
  // neither is stored against the hand id. The two are independent -- unmarking
  // a hand keeps its note.

  const listedReview = (rows) => rows.filter(h => !(state.hideSeen && h.reviewed));

  // How many rows this view lists, how many of its flags are marked, and how
  // many carry a note. Read off state rather than passed in, so a toggle can
  // refresh it without a render.
  function setReviewCount() {
    if (state.dataView !== state.by) return; // see render()
    const all = listRows(state.by);
    const n = listedReview(all).length;
    const seen = all.filter(h => h.reviewed).length;
    const noted = all.filter(h => h.note).length;
    const what = state.by === SESSION_VIEW ? "hand" : state.by === TAGGED_VIEW ? "tagged hand" : "flagged hand";
    const order = $("review-sort").value;
    const head = n > HAND_LIMIT
      ? `${order === "newest" ? "newest" : order === "hand" ? "first" : "top"} ${HAND_LIMIT} of ${n} ${what}s`
      : `${n} ${what}${n === 1 ? "" : "s"}`;
    $("review-count").textContent = [head, seen ? `${seen} reviewed` : "", noted ? `${noted} noted` : ""]
      .filter(Boolean).join(" · ");
  }

  // One hand's rows are one hand: a missed bluff and a beat on the same replay
  // move together, including the rows of the view that is not on show.
  // The session view and the review views hold their own copies of a hand, so a
  // mark made in one is carried into the other.
  function applyToHand(hand_id, fields) {
    for (const hands of new Set([state.data?.hands, state.review?.data.hands, state.session?.data.hands,
      state.tagged?.data.hands, state.handRows?.rows])) {
      // On the chart views `state.data.hands` is a count, not a list.
      if (!Array.isArray(hands)) continue;
      for (const other of hands) {
        if (other.hand_id === hand_id) Object.assign(other, fields);
      }
    }
  }

  function showErr(e) {
    $("err").textContent = String(e.message || e);
    $("err").classList.remove("hidden");
  }

  // `noteOnly`: the ✎ and nothing else, for the drill-down list, which is not a
  // review queue -- nothing there is ticked off, and its rows never fade.
  function reviewedRow(h, row, { noteOnly = false } = {}) {
    const wrap = document.createElement("div");
    wrap.className = "rev-row";
    const marks = document.createElement("div");
    marks.className = "marks";
    const body = document.createElement("div");
    body.className = "rev-body";
    const note = document.createElement("p");
    note.className = "rev-note";

    const mark = document.createElement("button");
    mark.type = "button";
    mark.className = "seen";
    const pen = document.createElement("button");
    pen.type = "button";
    pen.className = "note";
    pen.textContent = "✎";
    // Rows from a server too old to know about flags get no 🚩.
    const flag = !noteOnly && "flagged" in h ? document.createElement("button") : null;
    if (flag) {
      flag.type = "button";
      flag.className = "flag";
      flag.textContent = "🚩";
    }

    const paint = () => {
      wrap.dataset.reviewed = String(!noteOnly && !!h.reviewed);
      mark.setAttribute("aria-pressed", String(!!h.reviewed));
      mark.textContent = h.reviewed ? "✓" : "";
      mark.title = h.reviewed
        ? `reviewed ${(h.reviewed_at || "").slice(0, 10)} — click to unmark`
        : "mark this hand reviewed";
      mark.setAttribute("aria-label", `hand ${h.hand_number} reviewed`);
      pen.setAttribute("aria-pressed", String(!!h.note));
      pen.title = h.note
        ? `noted ${(h.noted_at || "").slice(0, 10)} — click to edit`
        : "write down what went wrong";
      pen.setAttribute("aria-label", `note on hand ${h.hand_number}`);
      note.textContent = h.note || "";
      note.classList.toggle("empty", !h.note);
      if (flag) {
        flag.setAttribute("aria-pressed", String(!!h.flagged));
        flag.title = h.flagged
          ? `flagged for manual review ${(h.flagged_at || "").slice(0, 10)} — click to unflag`
          : "flag this hand for manual review";
        flag.setAttribute("aria-label", `hand ${h.hand_number} flagged for manual review`);
      }
    };
    paint();

    flag?.addEventListener("click", async () => {
      flag.disabled = true;
      try {
        const out = await postJson(`/games/${encodeURIComponent(h.game_id)}/hands/${h.hand_number}/flag`, { flagged: !h.flagged });
        applyToHand(h.hand_id, { flagged: out.flagged, flagged_at: out.flagged_at });
        // The 🚩 is the tagged view's `flagged`: its counts and rows are now out of
        // date. On show it asks again; elsewhere the row is repainted in place, so
        // a replay stays open.
        state.tagged = null;
        if (state.by === TAGGED_VIEW) { load({ quiet: true }); return; }
        paint();
      } catch (e) {
        showErr(e);
      } finally {
        flag.disabled = false;
      }
    });

    mark.addEventListener("click", async () => {
      mark.disabled = true;
      try {
        const out = await postJson(`/hands/${h.hand_id}/reviewed`, { reviewed: !h.reviewed });
        applyToHand(h.hand_id, { reviewed: out.reviewed, reviewed_at: out.reviewed_at });
        // Hidden rows leave the list, which needs the render; otherwise the row
        // is repainted where it is, so an open replay stays open.
        if (state.hideSeen) { render(); return; }
        paint();
        setReviewCount();
      } catch (e) {
        showErr(e);
      } finally {
        mark.disabled = false;
      }
    });

    // The editor replaces the note in place, so the row never moves under the
    // cursor. Ctrl+Enter or leaving the box saves, Escape abandons the edit.
    // `edit` is the row's, not the click's: the pen has to be able to close an
    // editor a previous click opened.
    let edit = null;

    function closeEdit() {
      if (!edit) return;
      // Cleared first: taking the focused box out of the page can fire its own
      // blur, and that handler must find the edit already over.
      const box = edit;
      edit = null;
      box.replaceWith(note);
      paint();
    }

    async function save(box) {
      if (!edit) return;
      if (box.value.trim() === (h.note || "").trim()) { closeEdit(); return; }
      box.disabled = true;
      try {
        const out = await postJson(`/hands/${h.hand_id}/note`, { note: box.value });
        const fields = { note: out.note, noted_at: out.noted_at };
        applyToHand(h.hand_id, fields);
        // A drill-down row may belong to a list no longer cached anywhere.
        Object.assign(h, fields);
        closeEdit();
        if (!noteOnly) setReviewCount();
      } catch (e) {
        // The note is still in the box, and the box stays open with it.
        box.disabled = false;
        box.focus();
        showErr(e);
      }
    }

    pen.addEventListener("click", () => {
      // A click on the pen while editing has already blurred the box, which
      // saved and closed it; this is the one that opens it again.
      if (edit) { closeEdit(); return; }
      edit = document.createElement("div");
      edit.className = "rev-edit";
      const box = document.createElement("textarea");
      box.value = h.note || "";
      box.setAttribute("aria-label", `note on hand ${h.hand_number}`);
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = "Ctrl+Enter or click away to save · Esc to cancel · empty to delete";
      edit.append(box, hint);
      note.replaceWith(edit);
      pen.setAttribute("aria-pressed", "true");
      box.focus();
      box.setSelectionRange(box.value.length, box.value.length);
      box.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") { ev.stopPropagation(); closeEdit(); }
        else if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(box); }
      });
      box.addEventListener("blur", () => save(box));
    });

    if (noteOnly) marks.append(pen);
    else if (flag) { marks.classList.add("three"); marks.append(mark, flag, pen); }
    else marks.append(mark, pen);
    body.append(row, note);
    // The hand's tags, beside its note; rows from a server too old to send them get none.
    if (Array.isArray(h.tags)) body.append(pntReplay.tagBox(h.game_id, h.hand_number, h.tags));
    wrap.append(marks, body);
    return wrap;
  }

  function closeHands() {
    handsSeq++;
    pntReplay.cancel($("replay"));
    $("hands").classList.add("hidden");
    $("hand-rows").replaceChildren();
    $("replay").classList.add("hidden");
    applyLayout();
  }

  // ---- postflop strip ------------------------------------------------------
  // The same spot, read as frequencies: how often they c-bet it, fold to one,
  // raise one, or lead into it. Sample sizes are in the tooltips.
  // `live` is the load's: a strip for a spot since left is not drawn.

      state.filter = $("filter").value.trim();
      if (VIEWS.includes(e.data.by)) {
        state.by = e.data.by;
        document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === state.by));
      }
      if (["flop", "turn", "river"].includes(e.data.street)) { state.street = e.data.street; $("street").value = state.street; }
      if (["cbet", "bet", "faced_cbet"].includes(e.data.kind)) { state.kind = e.data.kind; $("kind").value = state.kind; }
      syncChips();
      closeHands();
      writeUrl();
      load({ quiet: true });
    }
  });

  // Embedded in the HUD, a link to the index would navigate the panel away from
  // the chart with no way back, so it only appears in a real tab.
  if (parent !== window) $("crumb").classList.add("hidden");
  // The controls set from the URL's state: at boot, and on Back and Forward.
  function syncControls() {
    $("filter").value = state.filter;
    $("street").value = state.street;
    $("kind").value = state.kind;
    if (state.order) $("review-sort").value = state.order;
    $("review-split").setAttribute("aria-pressed", state.split);
    $("hands-split").setAttribute("aria-pressed", state.split);
    $("session-played").setAttribute("aria-pressed", state.played);
    $("session-sat").setAttribute("aria-pressed", state.satOut);
    $("review-seen").setAttribute("aria-pressed", state.hideSeen);
    syncChips();
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === state.by));
    document.querySelectorAll("[data-color]").forEach(x => x.setAttribute("aria-pressed", x.dataset.color === state.color));
  }
  readUrl();
  crumbLinks();
  syncControls();
  loadPlayers().then(load).catch(e => { $("err").textContent = String(e.message || e); $("err").classList.remove("hidden"); });
  // `hand=<id>` (a link to one hand, e.g. the players page's shown hands): list
  // that hand and replay it, as if its row had been clicked.
  if (state.hand && state.player) {
    openHands("the linked hand", [state.hand]);
    pntReplay.show($("replay"), state.hand);
  }
})();
</script>
<script src="/filter-help.js"></script>
</body>
</html>
