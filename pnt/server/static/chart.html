<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range chart</title>
<script src="/loading.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --ring: rgba(11,11,11,0.10);
    --mid: #f0efec;
    --accent: #2a78d6;
    --flag: #c4372f;
    /* profit, loss and in-between, for figures read against a baseline */
    --up: #1f7a4d;
    --down: #b93a39;
    --amber: #a86b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --mid: #383835; --accent: #3987e5;
      --flag: #e66e6d; --up: #4cc38a; --down: #e66e6d; --amber: #e0a43a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --mid: #383835; --accent: #3987e5;
    --flag: #e66e6d; --up: #4cc38a; --down: #e66e6d; --amber: #e0a43a;
  }
  * { box-sizing: border-box; }
  /* Thin scrollbars in the theme's own greys, with no track and no arrow buttons.
     Inherited, so the inner scrollers (hand rows, the grid, the side list) match. */
  :root { scrollbar-width: thin; scrollbar-color: var(--axis) transparent; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Fluid: the page takes the window, with gutters that grow with it. What would
     balloon -- the grid's cells, the notes -- caps itself instead. */
  main { max-width: none; margin: 0; padding: 20px clamp(12px, 2vw, 28px) 48px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; }

  /* --- one filter row above everything it scopes --- */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .controls label { color: var(--ink-2); font-size: 13px; }
  select, input[type=text], input[type=number], button {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--axis); border-radius: 6px; padding: 5px 8px;
  }
  input[type=text] { min-width: 0; flex: 1 1 320px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  input[type=number] { width: 6.5em; font-variant-numeric: tabular-nums; }
  #treeback { color: var(--accent); border-color: var(--accent); }
  .controls.narrow { margin-top: -6px; }
  .controls.narrow .lbl { color: var(--muted); font-size: 12px; margin-right: 8px; }
  /* Your note on the player on show, under the dropdown. Set off like a hand's
     note: it is the one line here you wrote yourself. */
  .pnote { display: flex; align-items: flex-start; gap: 6px; margin: -6px 0 14px; font-size: 13px; color: var(--ink-2); }
  .pnote:empty { display: none; }
  .pnote + .controls.narrow { margin-top: 0; }
  .pnote .text { white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid var(--accent); padding: 1px 0 1px 8px; }
  .pnote .pen, .pnote .fold { flex: none; padding: 0 6px; font-size: 12px; color: var(--muted); }
  .pnote .pen:hover, .pnote .fold:hover { color: var(--ink); border-color: var(--accent); }
  .pnote.editing { flex-direction: column; align-items: stretch; gap: 4px; }
  .pnote textarea { width: 100%; max-width: 72ch; min-height: 3.4em; resize: vertical; font: inherit; font-size: 13px;
    color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 6px 8px; }
  .pnote .hint { color: var(--muted); font-size: 11px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 5px 10px; color: var(--ink-2); }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
  /* A top bar of tabs over a rule: bold labels with room between them, the open
     one in the accent and underlined. The second group sits at the right edge;
     a group wraps inside itself when the panel is narrow. */
  .views { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 24px; margin: -4px 0 14px;
    border-bottom: 1px solid var(--grid); }
  .views .seg { flex-wrap: wrap; min-width: 0; gap: 0 2px; border: 0; border-radius: 0; overflow: visible; }
  .views .seg + .seg { margin-left: auto; }
  .views .seg button { font-size: 13px; font-weight: 600; letter-spacing: .015em; padding: 7px 11px 6px; white-space: nowrap;
    line-height: 1.3; color: var(--ink-2); border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; margin-bottom: -1px; }
  .views .seg button:hover { color: var(--ink); background: var(--mid); }
  .views .seg button[aria-pressed=true] { color: var(--accent); background: transparent; border-bottom-color: var(--accent); }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .presets button { font-size: 12px; padding: 3px 8px; border-radius: 999px; color: var(--ink-2); }
  .presets button:hover { border-color: var(--muted); }
  /* Above the Lines tree once a click has narrowed the spot: what it is narrowed
     to, a way back one step, and a way back to every line. */
  .lback { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 12px;
    padding: 6px 10px; border: 1px solid var(--ring); border-radius: 8px; font-size: 12.5px; color: var(--ink-2); }
  .lback code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }
  .lback button { font-size: 12px; padding: 2px 10px; }
  .presets button[aria-pressed=true] { background: var(--accent); color: #fff; border-color: transparent; }
  .presets .lbl { color: var(--muted); font-size: 12px; align-self: center; margin-right: 2px; }
  .presets .sep { width: 1px; background: var(--grid); margin: 0 4px; }
  .lines .presets { margin-bottom: 6px; }
  .lines { margin-bottom: 14px; }
  .lines .lbl { min-width: 6.5em; }
  /* More filters: label column, chips column; one rule between sections. */
  .filters { margin-bottom: 14px; }
  .filters .presets { display: grid; grid-template-columns: 6.5em 1fr; gap: 6px 10px; margin-bottom: 6px; }
  .filters .presets .lbl { min-width: 0; margin: 0; padding-top: 3px; align-self: start; }
  .filters .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters .lines { margin-bottom: 0; }
  .filters > div + div { border-top: 1px solid var(--grid); padding-top: 6px; margin-top: 6px; }
  .common button.more { border-style: dashed; color: var(--accent); }
  .common button.more[aria-expanded=true] { border-style: solid; }
  /* Chip counts: the hands a click would leave, muted; a chip that would leave
     none is dimmed but still clicks. */
  .presets button .cnt { margin-left: 5px; font-size: .85em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .presets button[aria-pressed=true] .cnt { color: inherit; opacity: .75; }
  .presets button .cnt.stale { opacity: .4; }
  .presets button.zero { opacity: .45; }
  .presets button:disabled { opacity: .45; cursor: default; }
  .tile .k small { color: var(--muted); }

  /* --- stat tiles --- */
  .tiles { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 10px 14px; min-width: 150px; flex: 1 1 150px; }
  .tile .v { font-size: 24px; font-weight: 600; line-height: 1.1; }
  .tile .k { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tile.warn .v { color: var(--ink-2); }
  .tile.pick { cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .tile.pick:hover { border-color: var(--muted); }
  /* A result's sign, wherever one is printed: profit green, loss red (signTone).
     A tile's net under BIG_BB is .soft, a paler tone; .attn is a count that
     wants a look. Each tile render resets these (setTileKeys). */
  .up { color: var(--up); }
  .down { color: var(--down); }
  .tile .v.up { color: var(--up); }
  .tile .v.down { color: var(--down); }
  .tile .v.up.soft { color: color-mix(in srgb, var(--up) 70%, var(--muted)); }
  .tile .v.down.soft { color: color-mix(in srgb, var(--down) 70%, var(--muted)); }
  .tile .v.attn { color: var(--amber); }
  .note { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; max-width: 72ch; }
  ul.note { padding-left: 18px; max-width: 90ch; }
  ul.note li { margin: 1px 0; }
  .note b { color: var(--ink); font-weight: 600; }

  /* --- chart card --- */
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px; }
  .card.loading { opacity: .45; transition: opacity .15s; }
  /* Title left, every control together on the right. Spread with space-between,
     a middle control (Estimate, the sizing selects) floated alone mid-card. */
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .card-head h2 { font-size: 14px; font-weight: 600; margin: 0 auto 0 0; padding-right: 4px; }
  .card-head .ctl { display: inline-flex; gap: 6px; flex-wrap: wrap; }

  .grid-wrap { overflow-x: auto; }
  /* At most 64px a cell: wider, the 169 hands stop reading as one chart. */
  .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; background: var(--surface); min-width: 520px;
    max-width: calc(13 * 64px + 12 * 2px); }
  .cell {
    aspect-ratio: 1 / 1; border-radius: 4px; padding: 4px 5px; position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
    background: var(--mid); color: var(--ink); cursor: default; outline: 0;
    font-variant-numeric: tabular-nums;
  }
  .cell.pick { cursor: pointer; }
  .cell.empty { background: transparent; box-shadow: inset 0 0 0 1px var(--grid); color: var(--muted); }
  .cell.empty .n { visibility: hidden; }
  .cell.on-dark { color: #ffffff; }
  .cell.on-light { color: #0b0b0b; }
  .cell:hover, .cell:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); z-index: 1; }
  .cell .l { font-size: 12px; font-weight: 600; letter-spacing: .01em; }
  .cell .n { font-size: 15px; font-weight: 500; align-self: flex-end; }
  @media (max-width: 720px) { .cell .l { font-size: 10px; } .cell .n { font-size: 12px; } }
  /* The estimated range over the grid: a class outside it fades almost away, the
     one at its edge (only some of its combos in) half fades with a dashed mark, and
     an in-range class never shown keeps a visible edge. The fills stay as they were. */
  .grid.est-on .cell { transition: opacity .15s; }
  .grid.est-on .cell:not(.est-in) { opacity: .12; }
  .grid.est-on .cell.est-part { opacity: .5; outline: 2px dashed var(--ink-2); outline-offset: -5px; }
  .grid.est-on .cell.est-in.empty { box-shadow: inset 0 0 0 1px var(--ink-2); color: var(--ink-2); }
  .grid.est-on .cell:hover { opacity: 1; }
  .est { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
  .est .cap { color: var(--ink-2); }
  .est .cap b { color: var(--ink); font-weight: 600; }
  .est .sub { color: var(--muted); font-size: 11.5px; }
  .est .bd-ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .est .bd-ctl input { flex: 0 0 11em; width: 11em; min-width: 0; font-family: ui-monospace, Consolas, monospace; }
  .est h3 { font-size: 13px; font-weight: 600; margin: 6px 0 0; }
  .est h3 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .est .catbar { position: relative; display: flex; gap: 2px; height: 16px; margin-top: 18px; }
  .est .catbar i { display: block; height: 100%; min-width: 2px; }
  .est .catbar i:first-child { border-radius: 4px 0 0 4px; }
  .est .catbar i:last-of-type { border-radius: 0 4px 4px 0; }
  .est .cut { position: absolute; top: -18px; bottom: -3px; border-left: 2px solid var(--ink); pointer-events: none; }
  .est .cut span { position: absolute; left: 4px; top: 0; white-space: nowrap; font-size: 11px; color: var(--ink); }
  .est .cut.right span { left: auto; right: 4px; }
  .est .catkey { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink-2); font-size: 12px; }
  .est .catkey i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .est table { border-collapse: collapse; max-width: 640px; }
  .est th, .est td { text-align: right; padding: 3px 10px 3px 0; font-variant-numeric: tabular-nums; }
  .est th:first-child, .est td:first-child { text-align: left; }
  .est th { font-weight: 500; color: var(--ink-2); font-size: 12px; }
  .est ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 11.5px; }

  .scale { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--ink-2); font-size: 12px; flex-wrap: wrap; }
  .scale .bar { display: flex; gap: 2px; }
  .scale .bar i { display: block; width: 22px; height: 12px; border-radius: 2px; }

  /* --- composition bars --- */
  .bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 12px; align-items: center; }
  .bars .lab { text-align: right; color: var(--ink-2); white-space: nowrap; }
  .bars .pick { cursor: pointer; }
  .bars .lab.pick:hover, .bars .lab.pick:focus-visible { color: var(--ink); text-decoration: underline; outline: 0; }
  .bars .track { height: 14px; background: transparent; position: relative; }
  .bars .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
  .bars .val { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bars .val small { color: var(--muted); margin-left: 6px; }

  /* --- sizing blocks --- */
  .sizing { display: flex; flex-direction: column; gap: 18px; }
  .block h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: baseline; }
  .block h3 small { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .block h3 button { font-size: 12px; padding: 1px 8px; border-radius: 999px; color: var(--ink-2); }
  .block.none { opacity: .5; }
  .block .bars { padding-left: 4px; }

  /* --- lines: one row per line, a stacked strength bar of the hands shown ---
     Segments sit 2px apart on the surface, so neighbours never merge; the bar is
     always the whole width, since its parts are shares of the known hands. */
  .lineview { display: flex; flex-direction: column; gap: 10px; }
  .lineview .presets, .lineview > p { margin: 0; } /* the gap alone spaces the rows */
  .lineview .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
  .lineview .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .lrows { display: grid; grid-template-columns: max-content max-content minmax(120px, 1fr) max-content; gap: 6px 12px; align-items: center; }
  .lrows .h { color: var(--muted); font-size: 12px; }
  .lrows .lab { font-family: ui-monospace, Consolas, monospace; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .lrows .lab:hover, .lrows .lab:focus-visible { text-decoration: underline; outline: 0; }
  .lrows .num { text-align: right; font-variant-numeric: tabular-nums; }
  .lrows .stack { display: flex; gap: 2px; height: 14px; }
  .lrows .stack i { display: block; height: 100%; min-width: 3px; cursor: pointer; }
  .lrows .stack i:first-child { border-radius: 4px 0 0 4px; }
  .lrows .stack i:last-child { border-radius: 0 4px 4px 0; }
  .lrows .stack i:only-child { border-radius: 4px; }
  .lrows .stack i:hover, .lrows .stack i:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .lrows .stack.none { color: var(--muted); font-size: 12px; align-items: center; }
  .lrows .val { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; color: var(--ink-2); }
  .lrows .val small { color: var(--muted); margin-left: 6px; }
  /* Tree rows, in Lines and Value:bluff: a caret opens a row into the ways on
     under it, and each level sits one step further in. */
  .lrows .lab { font-family: inherit; cursor: default; }
  .lrows .lab:hover { text-decoration: none; }
  .tlab { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; }
  .tlab { align-items: center; }
  .tlab .caret { flex: none; width: 18px; height: 18px; padding: 0; border: 1px solid var(--axis); border-radius: 5px;
    background: var(--surface); color: var(--ink-2); font-size: 10px; line-height: 16px; text-align: center; cursor: pointer; }
  .tlab .caret:hover, .tlab .caret:focus-visible { border-color: var(--accent); color: var(--accent); outline: 0; }
  .tlab .caret[aria-expanded=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tlab .caret.leaf { visibility: hidden; }
  .tlab .ways { color: var(--muted); font-size: 11px; }
  .tlab .st { flex: none; width: 3.3em; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
  .tlab .words { cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
  .tlab .words:hover, .tlab .words:focus-visible { text-decoration: underline; outline: 0; }
  .tlab .words b { font-weight: 600; color: var(--ink); }
  .tlab .code { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .tsub { color: var(--ink-2); }
  .tmore { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; }
  /* Narrow, the coverage goes under its bar rather than pushing the page sideways. */
  @media (max-width: 600px) {
    .lrows { grid-template-columns: minmax(0, max-content) max-content minmax(90px, 1fr); gap: 2px 8px; }
    .lrows .h:nth-child(4) { display: none; }
    .lrows .val { grid-column: 3; margin-bottom: 4px; font-size: 10px; white-space: normal; }
    .lrows .lab { font-size: 11px; }
    /* The words say the line and the caret says it opens: the code and the
       count of ways on are what give way, and a long line ends in an ellipsis,
       so the bar keeps its width. */
    .tlab { gap: 4px; overflow: hidden; }
    .tlab .code, .tlab .ways { display: none; }
    .tlab .st { width: 2.8em; font-size: 9.5px; }
  }
  /* --- strength by street --- */
  .sp-ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--ink-2); }
  .sp-wrap { overflow-x: auto; }
  .sp-wrap table th.grp { text-align: center; color: var(--ink-2); border-bottom: 0; padding-bottom: 0; }
  .sp-wrap table td.c { cursor: pointer; }
  .sp-wrap table td.c:hover, .sp-wrap table td.c:focus-visible { outline: 1px solid var(--muted); outline-offset: -1px; }
  .sp-wrap table td.c small { display: block; color: var(--muted); font-size: 11px; }
  .sp-wrap table td.zero { color: var(--muted); }
  .sp-wrap table td.slow { font-weight: 600; }
  .sp-wrap table tr.total td { border-top: 1px solid var(--axis); font-weight: 600; }
  .sp-foot { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .sp-foot button { font-size: 12px; padding: 0 6px; }
  .sp-key { display: inline-flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .sp-key i { display: inline-block; width: 10px; height: 4px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  /* The merged grid: one cell per made hand and street, its share over its n, and
     a thin bar of bet it / slowplayed / gave up under them. */
  .sp-gridbox { max-width: 680px; }
  .sp-grid th:not(:first-child), .sp-grid td:not(:first-child) { text-align: center; width: 24%; }
  .sp-grid td.c b { display: block; font-weight: 600; }
  .sp-grid tr.total td.c b { font-weight: 700; }
  .sp-mix { display: flex; gap: 1px; height: 4px; margin: 3px auto 0; max-width: 6em; border-radius: 2px; overflow: hidden; }
  .sp-mix i { display: block; height: 100%; }
  .sp-detail { margin-top: 14px; }
  .sp-detail summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .sp-detail > div { margin-top: 8px; }
  .sp-h { margin-top: 18px; }
  .sp-h h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); }
  .sp-made { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 18px; margin-top: 8px; }
  .sp-made .gh { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; border-bottom: 1px solid var(--grid); padding-bottom: 3px; }
  .sp-made .gh small { color: var(--muted); }
  .sp-made .ln { display: grid; grid-template-columns: minmax(0, max-content) minmax(30px, 1fr) max-content; gap: 8px;
    align-items: center; padding: 2px 0; font-size: 12px; cursor: pointer; }
  .sp-made .ln:hover .code, .sp-made .ln:focus-visible .code { text-decoration: underline; }
  .sp-made .ln:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .sp-made .code { font-family: ui-monospace, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-made .code.more { font-family: inherit; color: var(--ink-2); }
  .sp-made .bar { height: 6px; background: var(--mid); border-radius: 3px; overflow: hidden; }
  .sp-made .bar i { display: block; height: 100%; background: var(--accent); }
  .sp-made .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .sp-made > .sp-foot { grid-column: 1 / -1; margin: 0; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; margin-top: 12px; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  /* The plain data tables (made hands, Group by, Results, the side bets): a
     header ruled off in the axis grey, light zebra rows, room to read. :where
     keeps it weak, so each table's own hover and row styles still win. */
  :where(#table, .gb-body, #results, #bounty) th { font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--axis); white-space: nowrap; }
  :where(#table, .gb-body, #results, #bounty) :is(th, td) { padding: 6px 10px; }
  :where(#table, .gb-body, #results, #bounty) tr:nth-child(even) > td { background: color-mix(in srgb, var(--mid) 40%, transparent); }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { background: var(--mid); }
  tr.pick:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  tr.pick td:first-child::after { content: " ›"; color: var(--muted); }
  #table { overflow-x: auto; }
  #table .tbl-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px;
    color: var(--ink-2); font-size: 13px; }
  #table .tbl-ctl input[type=search] { font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--axis); border-radius: 6px; padding: 5px 8px; width: 15em; }
  #table .tbl-ctl .dim { color: var(--muted); }
  #table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  #table th.sortable:hover { color: var(--ink); }

  /* --- fold equity, under the sizing blocks --- */
  .foldeq { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grid); }
  .foldeq h3 { font-size: 13px; font-weight: 600; margin: 14px 0 0; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: baseline; }
  .foldeq h3:first-of-type { margin-top: 0; }
  .foldeq h3 small { color: var(--muted); font-weight: 400; }
  .foldeq .tbl { overflow-x: auto; }
  .foldeq table { margin-top: 6px; }
  .foldeq tr.none td { color: var(--muted); }
  /* A positive edge on their bets, an over-fold facing them: the exploit signal. */
  .foldeq td.hot { color: var(--accent); font-weight: 600; }
  .foldeq td.sub { cursor: pointer; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
  .foldeq td.sub:hover { color: var(--ink); }

  /* --- hand list and replay --- */
  #hands { margin-top: 14px; }
  .hand-rows { display: flex; flex-direction: column; max-height: 360px; overflow-y: auto; }
  .hand-row {
    display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; text-align: left;
    border: 0; border-bottom: 1px solid var(--grid); border-radius: 0; background: transparent;
    padding: 6px 4px; font-variant-numeric: tabular-nums;
  }
  .hand-row:hover, .hand-row[aria-pressed=true] { background: var(--mid); }
  .hand-row .num { min-width: 4.5em; color: var(--muted); }
  .hand-row .pos { min-width: 3.2em; color: var(--ink-2); }
  /* The name ellipsizes; the villain's cards beside it never do. */
  .hand-row .vs { min-width: 6em; display: inline-flex; align-items: baseline; gap: 4px; color: var(--ink-2); }
  .hand-row .vs .vn { max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hand-row .hole { min-width: 4.6em; }
  .hand-row[data-sat-out] .hole, .hand-row[data-sat-out] .net { color: var(--muted); }
  .hand-row .board { min-width: 10.5em; color: var(--ink-2); }
  .hand-row .pot { min-width: 5.5em; color: var(--ink-2); }
  .hand-row .sizes { flex: 1; color: var(--muted); font-size: 12px; }
  .hand-row .net { margin-left: auto; }
  .hand-rows.tall { max-height: 560px; }
  .hand-row .kind { font-size: 11px; padding: 0 7px; border: 1px solid var(--axis); border-radius: 999px;
    color: var(--ink-2); white-space: nowrap; }
  .hand-row .kind[data-group=beat] { border-color: var(--accent); color: var(--accent); }
  .hand-row .kind[data-group=manual] { border-color: var(--flag); color: var(--flag); }
  .hand-row .why { flex-basis: 100%; color: var(--ink-2); font-size: 12px; }
  /* A flagged row, its "reviewed" mark and its note. Both buttons sit beside the
     row, not in it: the row is itself a button, and a button may not contain
     another. The note runs full width underneath, in the second column. */
  .rev-row { display: flex; align-items: flex-start; gap: 6px; border-bottom: 1px solid var(--grid); }
  .rev-row .marks { flex: none; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  /* With the 🚩 there are three: ✓ and 🚩 side by side, ✎ under the ✓, so the row
     is no taller than with two. */
  .rev-row .marks.three { display: grid; grid-template-columns: repeat(2, 22px); }
  .rev-body { flex: 1; min-width: 0; }
  .rev-row .hand-row { width: 100%; border-bottom: 0; }
  .rev-row .marks button { width: 22px; height: 22px; padding: 0; line-height: 1;
    border-radius: 6px; color: var(--muted); font-size: 12px; }
  .rev-row .marks button[aria-pressed=true] { color: var(--accent); border-color: var(--accent); }
  /* The 🚩 is an emoji, so it is greyed rather than recoloured until it is set. */
  .rev-row .marks button.flag { filter: grayscale(1); opacity: .45; font-size: 11px; overflow: hidden; }
  .rev-row .marks button.flag:hover { opacity: .8; }
  .rev-row .marks button.flag[aria-pressed=true] { filter: none; opacity: 1; border-color: var(--flag); }
  /* Marked rows stay in place and step back, so the list keeps its shape. A note
     never fades: it is the one thing on the row you wrote yourself. */
  .rev-row[data-reviewed=true] .hand-row { opacity: .5; }
  .rev-row[data-reviewed=true] .hand-row:hover { opacity: 1; }
  .rev-note { font-size: 12px; color: var(--ink-2); margin: 0 0 6px; padding-left: 2px;
    white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid var(--accent); padding: 2px 0 2px 8px; }
  .rev-note.empty { display: none; }
  .rev-edit { display: flex; flex-direction: column; gap: 4px; margin: 0 0 8px; }
  .rev-edit textarea { width: 100%; min-height: 3.4em; resize: vertical; font: inherit; font-size: 12px;
    color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 6px 8px; }
  .rev-edit .hint { color: var(--muted); font-size: 11px; }
  #review-count { margin: 0 0 6px; font-size: 12px; }
  /* What each flag listed here fired on: the rule, its cutoffs, a matchup it catches. */
  .rules { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; margin: 0 0 8px;
    font-size: 12px; color: var(--ink-2); }
  .rules:empty { display: none; }
  .rules dt { font-weight: 600; color: var(--ink); }
  .rules dd { margin: 0; }
  .rules .lead { grid-column: 1 / -1; color: var(--muted); }
  #review.split .rules { grid-column: 1 / -1; }
  .kinds { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .kinds button { font-size: 12px; padding: 3px 8px; border-radius: 999px; color: var(--ink-2); }
  .kinds button[aria-pressed=true] { background: var(--accent); color: #fff; border-color: transparent; }
  /* The list views' on/off switches (Played only, Sat out, Hide reviewed, Side by side). */
  #reviewctl > button[aria-pressed=true] { color: var(--accent); border-color: var(--accent); }
  #reviewctl > button:disabled { opacity: .45; cursor: default; }
  .kinds button small { opacity: .8; margin-left: 4px; }
  /* The Tagged view's picker: one chip per tag, the 🚩 first; and a saved spot
     pinned into the Common row, told from the stock chips by its ★. */
  .tagpick { display: flex; margin: 0 0 8px; }
  .tagpick button[data-builtin] { border-style: dashed; }
  .tagpick .muted { font-size: 12px; align-self: center; }
  .common button[data-spot]::before { content: "★ "; color: var(--accent); }
  .common button[data-spot][aria-pressed=true]::before { color: inherit; }
  .replay { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--grid); font-size: 13px; }
  .replay h3 { font-size: 14px; margin: 0 0 4px; overflow-wrap: anywhere; }
  .replay h3 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .replay .who { color: var(--ink-2); margin: 0 0 6px; }
  .replay .street { margin-top: 10px; }
  .replay .street > b { text-transform: capitalize; }
  .replay .street > span { color: var(--muted); margin-left: 8px; }
  .replay ol { margin: 4px 0 0; padding-left: 22px; }
  .replay li.forced { color: var(--muted); }
  .muted { color: var(--muted); }

  /* --- side by side: the list on the left, the replay on the right ---
     The replay pane sticks to the top of the window and scrolls on its own, so
     clicking down a list never moves the page. The list is the narrower side at
     every width, a phone and the extension side panel included, and its rows go
     compact when it is narrow (below). On a phone the list has the whole width
     until a hand is picked, rather than give most of it to the placeholder. The
     review views and the drill-down list under the charts share the one switch;
     allin.html and pots.html read it too (pnt.reviewLayout). Two-fifths and
     three-fifths of the card, each capped at 600px on a wide screen and the pair
     centred there, so the space either side of it matches rather than pooling
     to the right of a replay that never needs 900px. */
  #review.split, #hands.split { display: grid; grid-template-columns: min(calc(40% - 4.8px), 600px) min(calc(60% - 7.2px), 600px);
    justify-content: center; gap: 0 12px; align-items: start; }
  @media (max-width: 600px) {
    #review.split:has(> .replay[data-empty]), #hands.split:has(> .replay[data-empty]) { grid-template-columns: minmax(0, 1fr); }
    .split > .replay[data-empty] { display: none; }
  }
  #review.split #review-count, #hands.split .card-head { grid-column: 1 / -1; }
  #review.split .hand-rows.tall, #hands.split .hand-rows { max-height: calc(100vh - 140px); max-height: calc(100dvh - 140px); }
  #review.split .replay, #hands.split .replay { position: sticky; top: 12px; margin-top: 0; padding: 0 0 0 12px; border-top: 0;
    border-left: 1px solid var(--grid); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto; }
  #hands-split[aria-pressed=true] { color: var(--accent); border-color: var(--accent); }
  /* A narrow list stacks a row instead of crushing it: number, cards and net on
     the first line, then the board, who it was against, and the size note (a
     review row's reason, a sat-out hand's result). Position and pot are left to
     the replay. Sized by the list, not the window, so the rows fit whether the
     list is narrow from the pane beside it or from the screen. `.hand-rows`
     in the selectors outranks the 600px block below. */
  .hand-rows { container-type: inline-size; }
  @container (max-width: 420px) {
    .hand-rows .hand-row { gap: 1px 6px; padding: 4px 2px; font-size: 11px; }
    .hand-rows .hand-row :is(.pos, .pot) { display: none; }
    .hand-rows .hand-row :is(.num, .hole, .board, .vs, .sizes) { min-width: 0; }
    .hand-rows .hand-row .vs .vn { max-width: 100%; }
    .hand-rows .hand-row .board { order: 1; flex-basis: 100%; }
    .hand-rows .hand-row .vs { order: 2; }
    .hand-rows .hand-row .sizes { order: 3; flex-basis: 100%; font-size: 10px; }
    .hand-rows .hand-row .why { order: 4; }
    .hand-rows .hand-row .pc-row { flex-wrap: wrap; }
    .hand-rows .hand-row :is(.kind, .why) { font-size: 10px; }
    .rev-row .marks.three { display: flex; }
  }

  /* --- postflop strip --- */
  .strip { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
    padding: 10px 14px 12px; margin-bottom: 16px; overflow-x: auto; }
  .strip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .strip-head b { font-size: 13px; font-weight: 600; }
  .strip-head a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .strip-grid { display: grid; grid-template-columns: 3.5em repeat(4, minmax(4.5em, max-content)) 1fr;
    gap: 3px 16px; font-variant-numeric: tabular-nums; font-size: 13px; min-width: 640px; }
  .strip-grid .h { color: var(--muted); font-size: 12px; }
  .strip-grid .st { color: var(--ink-2); text-transform: capitalize; }
  .strip-grid .mix { color: var(--muted); font-size: 12px; }

  .tip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
    border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    font-size: 13px; min-width: 150px;
  }
  .tip .big { font-size: 18px; font-weight: 600; }
  .tip .row { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); }
  .tip .row b { color: var(--ink); font-weight: 500; }
  .err { color: #d03b3b; margin: 12px 0; }
  .crumb { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
    margin-bottom: 12px; font-size: 13px; }
  .crumb a { color: var(--accent); text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  .crumb .go a + a { margin-left: 14px; }
  .hidden { display: none !important; }

  /* --- value:bluff: a stacked bar per kind of aggression, grouped by street.
     The four classes are one diverging scale, strongest claim to weakest: value
     blue, marginal the neutral midpoint, semi-bluff and bluff red, the bluff
     deepest. Dark mode takes its own steps, deepest the lightest, as the ramps
     elsewhere on the page do. Checked with the dataviz palette validator. */
  .bv { --bv-value: #256abf; --bv-marginal: #d6d5cc; --bv-semi_bluff: #ef9291; --bv-bluff: #b93a39;
    display: flex; flex-direction: column; gap: 14px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .bv { --bv-value: #6da7ec; --bv-marginal: #3e3d3a; --bv-semi_bluff: #e34948; --bv-bluff: #f6b6b5; }
  }
  :root[data-theme="dark"] .bv { --bv-value: #6da7ec; --bv-marginal: #3e3d3a; --bv-semi_bluff: #e34948; --bv-bluff: #f6b6b5; }
  .bv-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .bv-key { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink-2); font-size: 12px; }
  .bv-key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .bv-street h3 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .bv-rows { display: grid; grid-template-columns: minmax(9em, max-content) minmax(120px, 1fr) repeat(3, max-content);
    gap: 4px 14px; align-items: center; font-variant-numeric: tabular-nums; }
  .bv-row { display: contents; }
  .bv-row > * { min-width: 0; }
  .bv-row .lab { color: var(--ink-2); white-space: nowrap; overflow: hidden; }
  .bv-row .lab .words:hover, .bv-row .lab .words:focus-visible { color: var(--ink); }
  .bv-row.none .lab { cursor: default; text-decoration: none; color: var(--muted); }
  .bv-row.roll .lab { color: var(--ink); font-weight: 600; }
  .bv-bar { display: flex; gap: 2px; height: 14px; }
  .bv-bar span { min-width: 3px; cursor: pointer; }
  .bv-bar span:first-child { border-radius: 4px 0 0 4px; }
  .bv-bar span:last-child { border-radius: 0 4px 4px 0; }
  .bv-bar span:only-child { border-radius: 4px; }
  .bv-bar span:hover, .bv-bar span:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .bv-bar.empty { box-shadow: inset 0 0 0 1px var(--grid); border-radius: 4px; }
  .bv-row .num { text-align: right; white-space: nowrap; }
  .bv-row .num small { color: var(--muted); margin-left: 4px; }
  .bv-row.none .num { color: var(--muted); }
  .bv-cols { color: var(--muted); font-size: 12px; }
  .bv-cols.num { text-align: right; }
  @media (max-width: 600px) {
    .bv-rows { grid-template-columns: minmax(6em, max-content) minmax(60px, 1fr) repeat(3, max-content); gap: 3px 6px; font-size: 11px; }
    .bv-row .num small { display: none; }
    .bv-key, .bv-cols, .bv-street h3 { font-size: 10px; }
    .bv-bar { height: 10px; }
  }

  /* Narrow: the extension's side panel embeds this page a few hundred pixels
     wide. The grid shrinks to the width instead of scrolling sideways -- the
     cell text scales with it -- and the legend puts its bar on a row of its own,
     stretched across, with the two ends labelled underneath. The controls come
     down to the side panel's own 11px so the page reads as part of it.
     `minmax(0, 1fr)`: a plain 1fr column will not shrink below its label, which
     pushed the last column a few pixels past the edge. The page is not to scroll
     sideways at all -- everything wide has a scroller of its own -- since a
     nudge sideways hides the left edge of every control. */
  @media (max-width: 600px) {
    html, body { overflow-x: hidden; }
    body { font-size: 12px; }
    main { padding: 8px 8px 32px; }
    .crumb { font-size: 11px; margin-bottom: 6px; }
    h1 { font-size: 14px; margin-bottom: 8px; }
    h1 small { font-size: 11px; margin-left: 4px; }

    .controls { gap: 4px 6px; margin-bottom: 8px; }
    .controls label, .controls.narrow .lbl { font-size: 11px; }
    .controls.narrow { margin-top: -2px; }
    select, input[type=text], input[type=number], button { font-size: 11px; padding: 2px 6px; border-radius: 5px; }
    input[type=text] { font-size: 11px; flex-basis: 200px; }
    input[type=number] { width: 5em; }
    .seg { border-radius: 5px; }
    .seg button { padding: 2px 7px; }
    .views { column-gap: 12px; margin-bottom: 10px; }
    .views .seg button { font-size: 11px; padding: 4px 7px 3px; }
    .presets { gap: 3px; margin-bottom: 8px; }
    .presets button { font-size: 10px; padding: 1px 6px; }
    .presets .lbl { font-size: 10px; }
    .lines { margin-bottom: 8px; }
    .lines .presets { margin-bottom: 3px; }
    .lines .lbl { min-width: 5.5em; }
    .filters .presets { grid-template-columns: 5.5em 1fr; gap: 3px 6px; margin-bottom: 3px; }
    .filters .chips { gap: 3px; }
    .block h3 button { font-size: 10px; padding: 0 6px; }

    .tiles { gap: 6px; margin-bottom: 8px; }
    .tile { padding: 5px 8px; min-width: 100px; flex-basis: 100px; border-radius: 6px; }
    .tile .v { font-size: 16px; }
    .tile .k { font-size: 10px; }
    .note { font-size: 11px; margin-bottom: 8px; }
    .strip { padding: 6px 8px 8px; margin-bottom: 8px; }
    .strip-grid { font-size: 11px; gap: 2px 10px; }
    .strip-head b { font-size: 12px; }
    .strip-head a { font-size: 11px; }
    .bars { font-size: 11px; gap: 3px 8px; }
    table { font-size: 11px; }
    th, td { padding: 3px 5px; }
    th { font-size: 10px; }
    .hand-row { gap: 1px 8px; padding: 4px 2px; font-size: 11px; }
    /* The card columns give up their alignment rather than crush the size
       note into a column a word wide; it wraps to a line of its own instead.
       A list narrower still stacks its rows (the @container rules above). */
    .hand-row .hole, .hand-row .board { min-width: 0; }
    .hand-row .sizes { min-width: 12em; }
    .hand-row .kind, .hand-row .why, .kinds button { font-size: 10px; }
    .kinds button { padding: 1px 6px; }
    .replay { font-size: 11px; }
    .tip { font-size: 11px; }

    .card { padding: 8px; border-radius: 8px; }
    .card-head { gap: 6px; margin-bottom: 6px; }
    .card-head h2 { font-size: 12px; }
    .grid { min-width: 0; gap: 1px; grid-template-columns: repeat(13, minmax(0, 1fr)); }
    .cell { padding: 1px 2px; border-radius: 2px; min-width: 0; overflow: hidden; }
    .cell .l { font-size: clamp(7px, 2.1vw, 11px); letter-spacing: 0; }
    .cell .n { font-size: clamp(8px, 2.5vw, 13px); }
    .scale { gap: 2px 8px; justify-content: space-between; font-size: 10px; margin-top: 6px; }
    .scale .bar { order: -1; flex: 1 1 100%; gap: 1px; }
    .scale .bar i { flex: 1 1 0; width: auto; height: 8px; }
  }

  /* --- results by pot type ---
     Won and lost as one bar from zero, in the profit and loss colours (--up,
     --down); the net and bb/100 figures take the same colours. */
  #results { display: flex; flex-direction: column; gap: 18px; overflow-x: auto; }
  #results h3 { font-size: 13px; font-weight: 600; margin: 0; }
  #results table { margin-top: 6px; min-width: 620px; }
  #results td.role { padding-left: 22px; color: var(--ink-2); }
  #results td.diverge { width: 28%; min-width: 120px; }
  #results .zero { position: relative; height: 14px; }
  #results .zero::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--axis); }
  #results .zero i { position: absolute; top: 0; height: 100%; min-width: 2px; }
  #results .zero i.up { left: 50%; background: var(--up); border-radius: 0 4px 4px 0; }
  #results .zero i.down { right: 50%; background: var(--down); border-radius: 4px 0 0 4px; }
  #results tr.empty td { color: var(--muted); }
  #results .worst { font-size: 11px; margin-left: 6px; padding: 0 6px; border: 1px solid var(--flag); border-radius: 999px; color: var(--flag); }
  #results tr.pick td:first-child::after { content: none; }
  #results .why { color: var(--muted); font-size: 12px; margin: 4px 0 0; }

  /* --- tilt: after a big loss, and through the night ---
     Plain tables; a VPIP or PFR that moved from all hands by the gap worth a
     look is marked in the flag colour, the way the worst pot is on Results. */
  #tilt { display: flex; flex-direction: column; gap: 18px; overflow-x: auto; }
  #tilt h3 { font-size: 13px; font-weight: 600; margin: 0; }
  #tilt table { margin-top: 6px; min-width: 560px; }
  #tilt tr.empty td { color: var(--muted); }
  #tilt td small { color: var(--muted); margin-left: 3px; }
  #tilt td.moved { color: var(--flag); font-weight: 600; }
  #tilt .why { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  /* A figure read against its baseline (numTone): better in the accent blue the
     MDF column uses, worse in the loss red, about the same in amber. The ± and
     n beside it stay muted. Tilt colours its bb/100, Timing its value share. */
  #tilt td.num-good, #timing td.num-good { color: var(--accent); font-weight: 600; }
  #tilt td.num-bad, #timing td.num-bad { color: var(--down); font-weight: 600; }
  #tilt td.num-eh, #timing td.num-eh { color: var(--amber); }
  #tilt td[class*="num-"] small, #timing td[class*="num-"] small { font-weight: 400; }

  /* --- timing tells: what the hands were, by how long the decision took ---
     A table per spot, a row per tempo bucket, with the strength tiers as one
     stacked bar in the Lines view's colours. The pool comes first. */
  #timing { display: flex; flex-direction: column; gap: 18px; overflow-x: auto; }
  /* --- shows without being asked, and the 7-2 bounty board --- */
  #shows, #bounty { display: flex; flex-direction: column; gap: 14px; overflow-x: auto; }
  #shows table, #bounty table { min-width: 520px; }
  #shows tr.total td { font-weight: 600; }
  #shows tbody tr, #bounty tbody tr { cursor: pointer; }
  #shows tbody tr:hover td, #bounty tbody tr:hover td { background: var(--mid); }
  /* Strong in the profit colour, draws and air in the loss colour, marginal in
     amber. A class cell is tinted by its share of the row's two-card shows; a
     list row's read is a pill of the same colour. */
  #shows .cls-strong, #shows .ahead { --c: var(--up); }
  #shows .cls-marginal { --c: var(--amber); }
  #shows .cls-air, #shows .cls-draw, #shows .behind { --c: var(--down); }
  #shows .ahead, #shows .behind { color: var(--c); }
  #shows td.share small { color: var(--muted); font-size: 11px; margin-left: 5px; }
  #shows .read { display: inline-block; padding: 0 8px; border-radius: 999px; white-space: nowrap; font-size: 12.5px;
    color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 35%, transparent); }
  #shows .street { color: var(--muted); margin-right: 5px; }
  #shows .vs .pc-row { margin-left: 5px; }
  #shows .showfilters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
  #shows .showfilters > span { display: inline-flex; align-items: center; gap: 6px; }
  #shows .showfilters .seg { flex-wrap: wrap; }
  #shows .showfilters .seg button { font-size: 12.5px; padding: 3px 10px; white-space: nowrap; }
  #shows tbody td { white-space: nowrap; }
  #shows .showfilters .seg small { margin-left: 4px; opacity: .7; }
  #shows .showfilters + table { margin-top: 0; }
  #shows td.dim, #bounty td.dim { color: var(--muted); }
  #bounty td.up { color: var(--up); font-weight: 600; }
  #bounty td.down { color: var(--down); font-weight: 600; }
  #bounty tr.me td { background: var(--mid); }
  #bounty .hero72 { font-size: 13px; color: var(--ink-2); margin: 0; }
  #timing h3 { font-size: 13px; font-weight: 600; margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #timing table { margin-top: 6px; min-width: 600px; }
  #timing td small { color: var(--muted); margin-left: 3px; }
  #timing tr.spot td { font-weight: 600; padding-top: 10px; }
  #timing tr.empty td { color: var(--muted); }
  #timing td.tbar { width: 30%; min-width: 120px; }
  #timing .tbar span { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--mid); }
  #timing .tbar i { display: block; height: 100%; }
  #timing .why { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  #timing ul.why { padding-left: 18px; }
  #timing ul.why b { color: var(--ink-2); font-weight: 600; }
  #timing .warn { color: var(--flag); font-size: 12px; margin: 0; }
  #timing td.cellpick { cursor: pointer; }
  #timing td.cellpick:hover { background: var(--mid); }

  /* --- red line and blue line, at the top of Results ---
     Red is the hands that never reached showdown, blue the ones that did, grey
     their sum; the all-in adjusted total is a dashed grey. Each line keeps its own
     colour in both themes. */
  #winnings { --red: #c4372f; --blue: #2a78d6; --total: #52514e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #winnings { --red: #e66e6d; --blue: #6da7ec; --total: #c3c2b7; }
  }
  :root[data-theme="dark"] #winnings { --red: #e66e6d; --blue: #6da7ec; --total: #c3c2b7; }
  #winnings .wlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  #winnings .wlegend button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  #winnings .wlegend button:hover, #winnings .wlegend button:focus-visible { color: var(--ink); text-decoration: underline; outline: 0; }
  #winnings .wlegend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  #winnings .wlegend .red i { border-color: var(--red); }
  #winnings .wlegend .blue i { border-color: var(--blue); }
  #winnings .wlegend .total i { border-color: var(--total); }
  #winnings .wlegend .adjusted i { border-color: var(--muted); border-top-style: dashed; }
  #winnings .wcap { color: var(--muted); font-size: 12px; min-height: 1.4em; margin: 4px 0 0; overflow-wrap: anywhere; }
  #winnings svg { display: block; width: 100%; height: auto; max-height: 280px; }
  #winnings svg.sessions { max-height: 110px; margin-top: 6px; }
  #winnings svg text { fill: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
  #winnings .wzero { stroke: var(--axis); stroke-width: 1; }
  #winnings .wguide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  #winnings polyline { fill: none; stroke-width: 1.6; stroke-linejoin: round; }
  #winnings polyline.red { stroke: var(--red); }
  #winnings polyline.blue { stroke: var(--blue); }
  #winnings polyline.total { stroke: var(--total); stroke-width: 2; }
  #winnings polyline.adjusted { stroke: var(--muted); stroke-dasharray: 4 3; }
  #winnings .wdot { fill: var(--surface); stroke-width: 1.6; }
  #winnings .wdot.red { stroke: var(--red); }
  #winnings .wdot.blue { stroke: var(--blue); }
  #winnings .wdot.total { stroke: var(--total); }
  #winnings rect.up { fill: var(--up); }
  #winnings rect.down { fill: var(--down); }
  #winnings rect.bar { cursor: pointer; }
  #winnings rect.bar:hover, #winnings rect.bar:focus-visible { opacity: 0.75; outline: 0; }

  /* --- the give-up funnel, at the end of Results ---
     One bar per row from zero to 100%: of the flops seen for the steps, of the
     hands that reached the street for the folds. One colour; the figures say the rest. */
  #funnel { display: flex; flex-direction: column; gap: 18px; } /* its two tables, spaced as #results spaces its own */
  #funnel td.share { width: 28%; min-width: 120px; }
  #funnel .fill { position: relative; height: 14px; background: var(--mid); border-radius: 4px; }
  #funnel .fill i { position: absolute; left: 0; top: 0; height: 100%; min-width: 1px; background: var(--accent); border-radius: 4px; }
  #funnel tr.sub td { color: var(--ink-2); }

  /* --- group by, beside the grid ---
     The chart card and the Group by card side by side once the window has room
     for both, the grid at its full size on the left; stacked below that. Only the
     preflop and made views have the panel, and the HUD's embed never does. */
  /* The page is fluid, so on a wide window the bars, tables and hand lists keep a
     reading width inside their card rather than spreading figures a screen apart. */
  .bars, .lrows, .bv-rows, #table table, .foldeq table, .sp-wrap table,
  #results table, #tilt table, #timing table, #shows table, #bounty table { max-width: 1100px; }
  #review:not(.split) .hand-rows, #hands:not(.split) .hand-rows { max-width: 1280px; }
  .duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  /* Stacked, the two cards keep the grid's width rather than the page's, so the
     card's buttons sit over the grid instead of a screen of empty card. */
  .duo.two { grid-template-columns: minmax(0, 920px); }
  @media (min-width: 1200px) { .duo.two { grid-template-columns: minmax(0, 920px) minmax(360px, 1fr); } }
  .gb .card-head small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .gb-ctl { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  .gb-ctl label { display: inline-flex; gap: 6px; align-items: center; }
  .gb-ctl input[type=number] { width: 5em; }
  .gb-body { overflow-x: auto; }
  .gb-body.loading { opacity: .45; transition: opacity .15s; }
  .gb table { margin-top: 8px; }
  .gb th.sort { cursor: pointer; user-select: none; white-space: nowrap; }
  .gb th.sort:hover { color: var(--ink); }
  .gb td.lab { white-space: nowrap; max-width: 16em; overflow: hidden; text-overflow: ellipsis; }
  .gb td.lab .add { color: var(--accent); margin-right: 6px; }
  .gb td small { color: var(--muted); margin-left: 3px; }
  .gb tr.row { cursor: pointer; }
  .gb tr.row:hover td, .gb tr.row:focus-visible td { background: var(--mid); }
  .gb tr.row:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .gb tr.grp td { font-weight: 600; padding-top: 9px; }
  .gb tr.sub td.lab { padding-left: 22px; color: var(--ink-2); }
  .gb tr.total td { border-top: 1px solid var(--axis); font-weight: 600; }
  .gb td.mix { width: 26%; min-width: 90px; }
  .gb-mix { display: flex; gap: 2px; height: 12px; }
  .gb-mix i { display: block; height: 100%; min-width: 3px; }
  .gb-mix i:first-child { border-radius: 3px 0 0 3px; }
  .gb-mix i:last-child { border-radius: 0 3px 3px 0; }
  .gb-mix i:only-child { border-radius: 3px; }
  .gb-mix.none { box-shadow: inset 0 0 0 1px var(--grid); border-radius: 3px; }
  .gb-foot { color: var(--muted); font-size: 12px; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .gb-foot i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  @media (max-width: 600px) {
    .gb-ctl { font-size: 11px; gap: 4px 8px; }
    .gb-foot { font-size: 10px; }
    .gb td small { display: none; }
    .gb td.mix { min-width: 60px; }
  }

  /* --- the spot tree (by=tree) ---
     One row per decision point: caret, how they got there (muted), the spot, its
     hands, and what they chose there as a stacked bar and as text. Each level sits
     one step further in; narrow, the steps shrink and the text drops under the bar. */
  #tree { --tr-fold: #b4b2a9; --tr-check: #e1e0d9; --tr-call: #6da7ec; --tr-raise: #b93a39; --tind: 16px;
    display: flex; flex-direction: column; gap: 8px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #tree { --tr-fold: #6b6a65; --tr-check: #44433f; --tr-call: #3987e5; --tr-raise: #e66e6d; }
  }
  :root[data-theme="dark"] #tree { --tr-fold: #6b6a65; --tr-check: #44433f; --tr-call: #3987e5; --tr-raise: #e66e6d; }
  #tree .tbase code { color: var(--ink); }
  #tree .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
  #tree .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .trows { display: grid; grid-template-columns: minmax(0, max-content) max-content minmax(120px, 1fr) max-content;
    gap: 5px 12px; align-items: center; max-width: 1100px; }
  .trows .h { color: var(--muted); font-size: 12px; }
  .trows .trow { display: contents; }
  .trows .trow.dim > * { opacity: .45; }
  .trows .tl { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap;
    padding-left: calc(var(--d, 0) * var(--tind)); font-size: 13px; }
  .trows .caret { flex: none; width: 18px; height: 18px; padding: 0; border: 1px solid var(--axis); border-radius: 5px;
    background: var(--surface); color: var(--ink-2); font-size: 10px; line-height: 16px; text-align: center; cursor: pointer; }
  .trows .caret:hover, .trows .caret:focus-visible { border-color: var(--accent); color: var(--accent); outline: 0; }
  .trows .caret[aria-expanded=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .trows .caret.leaf { visibility: hidden; }
  .trows .edge { color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .trows .spot { flex: none; cursor: pointer; }
  .trows .spot:hover, .trows .spot:focus-visible { text-decoration: underline; outline: 0; }
  .trows .seat .spot { font-weight: 600; }
  .trows .num { text-align: right; font-variant-numeric: tabular-nums; }
  .trows .stack { display: flex; gap: 2px; height: 14px; }
  .trows .stack i { display: block; height: 100%; min-width: 3px; cursor: pointer; }
  .trows .stack i:first-child { border-radius: 4px 0 0 4px; }
  .trows .stack i:last-child { border-radius: 0 4px 4px 0; }
  .trows .stack i:only-child { border-radius: 4px; }
  .trows .stack i:hover, .trows .stack i:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .trows .stack.none { color: var(--muted); font-size: 12px; align-items: center; }
  .trows .txt { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; color: var(--ink-2); }
  #treectl .lbl { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
  @media (max-width: 600px) {
    #tree { --tind: 7px; }
    .trows { grid-template-columns: minmax(0, 1fr) max-content minmax(56px, 26%); gap: 2px 8px; }
    .trows .h:nth-child(4) { display: none; }
    .trows .tl { font-size: 12px; gap: 4px; }
    .trows .txt { grid-column: 1 / -1; padding-left: calc(var(--d, 0) * var(--tind) + 22px); margin-bottom: 4px;
      font-size: 10.5px; white-space: normal; }
  }

  /* --- made hands by street (Made hands › Streets) ---
     Flop holding against river holding, each cell tinted by its share of the row. */
  #streets { display: flex; flex-direction: column; gap: 6px; overflow-x: auto; }
  #streets h3 { font-size: 13px; font-weight: 600; margin: 10px 0 0; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: baseline; }
  #streets h3:first-child { margin-top: 0; }
  #streets h3 small { color: var(--muted); font-weight: 400; }
  #streets table { margin-top: 4px; min-width: 560px; max-width: 1100px; }
  #streets th { font-weight: 500; font-size: 12px; color: var(--ink-2); }
  #streets td.c { cursor: pointer; text-align: center; }
  #streets td.c:hover, #streets td.c:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  #streets td.c.on-dark { color: #fff; }
  #streets td.c.on-light { color: #0b0b0b; }
  #streets td.zero { color: var(--muted); text-align: center; }
  #streets td small { display: block; color: inherit; opacity: .7; font-size: 10.5px; }
  #streets tr.total td { border-top: 1px solid var(--axis); font-weight: 600; }
  #streets .snote { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
</style>
</head>
<body>
<main>
  <div class="crumb" id="crumb"><a href="/">&lsaquo; tracker</a>
    <span class="go"><a id="statslink" href="/stats.html">stats &rsaquo;</a>
      <a id="allinlink" href="/allin.html">all-in EV &rsaquo;</a>
      <a id="potslink" href="/pots.html">biggest pots &rsaquo;</a></span></div>
  <h1>Range chart <small id="subtitle">what a player had in a spot, from the hands where it was shown</small></h1>

  <div class="controls">
    <label for="player">Player</label>
    <select id="player"></select>
    <label for="filter">Spot</label>
    <input id="filter" type="text" placeholder="e.g. 3bet_pot,vs=player 3,last:7d · every term under ? Filters" spellcheck="false">
    <button class="primary" id="apply">Apply</button>
    <button id="clear" title="back to all hands">Clear</button>
    <button id="back" class="hidden" title="undo the last change to the spot (Alt+←)">← Back</button>
    <button id="treeback" class="hidden" title="the spot tree, scrolled where you left it (or the browser's Back)">‹ Back to tree</button>
  </div>
  <!-- The views, on a row of their own: how they play on the left, then over on
       the right the results and the hands to look at again. -->
  <div class="views">
    <span class="seg" role="group" aria-label="Analysis views">
      <button data-view="preflop" aria-pressed="true" title="the 169 starting hands, coloured by result">Preflop</button>
      <button data-view="sizing" aria-pressed="false" title="what they had, by bet size; and how often each size got folds">Sizing</button>
      <button data-view="lines" aria-pressed="false" title="every line they took after the flop, and how strong it was when shown">Lines</button>
      <button data-view="tree" aria-pressed="false" title="every spot they reached, seat first, and what they chose there">Tree</button>
      <button data-view="bluffs" aria-pressed="false" title="what they bet, raised and jammed with: value against bluffs, by size">Value:bluff</button>
      <button data-view="strength" aria-pressed="false" title="what they did on a street with a big made hand: bet it, or slowplay it">Slowplays</button>
      <button data-view="tilt" aria-pressed="false" title="how they play after losing a big pot, and as the night wears on">Tilt</button>
      <button data-view="timing" aria-pressed="false" title="how long they took to act, and what the hands were: snap, normal or tank">Timing</button>
    </span>
    <span class="seg" role="group" aria-label="Results and review views">
      <button data-view="made" aria-pressed="false" title="what the shown hands had made, one row per kind">Made hands</button>
      <button data-view="results" aria-pressed="false" title="big blinds won and lost, by pot type, seat and position">Results</button>
      <button data-view="shows" aria-pressed="false" title="the hands they turned over when nobody asked: how often air, how often strong">Shows</button>
      <button data-view="review" aria-pressed="false" title="hands worth a replay: missed bluffs, missed value, failed bluffs">Review</button>
      <button data-view="tagged" aria-pressed="false" title="hands you tagged on a row or in a replay, by tag">Tagged</button>
      <button data-view="beats" aria-pressed="false" title="suckouts and coolers">Bad beats</button>
      <button data-view="session" aria-pressed="false" title="every hand of one session, flagged or not">Session</button>
      <button data-view="bounties" aria-pressed="false" title="the 7-2 side bet: who won and paid bounties, every player">7-2</button>
      <button data-view="nit" aria-pressed="false" title="the Nit Game: who was paid the penalty and who paid it, every player">Nit</button>
    </span>
  </div>
  <div class="pnote" id="pnote"></div>
  <div class="controls narrow">
    <label for="pot">Pot ≥</label>
    <input id="pot" type="number" min="0" step="1" placeholder="any" title="final pot, in chips (writes pot>=N into the spot)">
    <span class="lbl">chips</span>
    <label for="vs">vs</label>
    <select id="vs" title="hands where this player was still in when they last acted (writes vs=name into the spot)">
      <option value="">anyone</option>
    </select>
  </div>
  <!-- The filter chips: a short Common row by default, and every chip behind
       "More filters" as a two-column list, label then chips. -->
  <div class="presets common" id="common"><span class="lbl">Common</span></div>
  <div class="filters hidden" id="filters">
    <div id="presets"></div>
    <div class="lines" id="pottype"></div>
    <div class="lines" id="lines"></div>
    <div class="lines" id="actions"></div>
    <div class="lines" id="jams"></div>
    <div class="lines" id="limps"></div>
    <div class="presets textures" id="textures"><span class="lbl">Board</span></div>
  </div>

  <div class="tiles">
    <button type="button" class="tile pick" id="t-hands-tile" title="list these hands">
      <div class="v" id="t-hands">–</div><div class="k" id="t-hands-k">hands in this spot ›</div></button>
    <div class="tile"><div class="v" id="t-known">–</div><div class="k" id="t-known-k">cards known</div></div>
    <div class="tile warn"><div class="v" id="t-cov">–</div><div class="k" id="t-cov-k">coverage</div></div>
    <div class="tile"><div class="v" id="t-raise">–</div><div class="k" id="t-raise-k">usual preflop raise</div></div>
  </div>
  <ul class="note" id="note"></ul>
  <div class="strip hidden" id="strip"></div>
  <div class="err hidden" id="err"></div>

  <div class="duo" id="duo">
  <section class="card" id="card">
    <div class="card-head">
      <h2 id="card-title">Starting hands</h2>
      <span class="seg" id="colorseg" role="group" aria-label="Color by">
        <button data-color="net" aria-pressed="true">Net won</button>
        <button data-color="pfr" aria-pressed="false">Raise %</button>
        <button data-color="size" aria-pressed="false">Raise size</button>
      </span>
      <button id="esttoggle" aria-pressed="false" title="outline the range their frequency at this spot implies (e.g. position=BTN,unopened=raise)">Estimate</button>
